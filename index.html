SUBJ=[{id:"ar",g:6,t:"العلوم",ic:"🔬",s:"الفصل الأول · الاحتراق والهواء",L:LAR,rtl:1,T:30,MT:60,M:[["الاحتراق تفاعل بين الأكسجين ومادة، وينتج عنه حرارة وضوء.","للهواء دور في حدوث الاحتراق واستمراره.","في الوعاء المغلق يُستهلك الهواء فتنطفئ الشمعة بعد وقت قصير.","لازم يتجدد الهواء الطازج (يدخل ويخرج) عشان الاشتعال يستمر."],["الهواء خليط من الغازات: نيتروجين 78%، أكسجين 21%، ثاني أكسيد الكربون 0.04%.","الأكسجين هو الغاز الوحيد الذي يساعد على الاحتراق، ويجعل اللهب أقوى وأكثر سطوعاً.","النيتروجين وثاني أكسيد الكربون لا يساعدان على الاحتراق."],["أثناء الاحتراق يقل الأكسجين ويزداد ثاني أكسيد الكربون.","ماء الجير سائل رائق عديم اللون، ويتحول إلى أبيض لبني مع ثاني أكسيد الكربون.","نرتدي نظارات الأمان لحماية العين من ماء الجير."]]},{id:"en",g:6,t:"Science",ic:"🧪",s:"Chapter 1 · Burning and Air",L:D0,T:45,MT:90,M:[["Burning is a reaction between oxygen and a substance that produces heat and light.","Air has a role in the occurrence and continuation of burning.","In a closed jar the air is used up, so the candle goes out after a short time.","Fresh air must constantly flow in and out for burning to continue."],["Air is a mixture of gases: nitrogen 78%, oxygen 21%, carbon dioxide 0.04%.","Oxygen helps burning: the flame becomes stronger and brighter.","Nitrogen and carbon dioxide do not help burning."],["During burning, oxygen decreases and carbon dioxide increases.","Limewater is a colorless clear liquid that turns milky white with carbon dioxide.","Wear safety goggles to protect the eyes from limewater."]]}];

)","لأن قوى التماسك بين جسيماتها ضعيفة نسبياً والمسافات البينية كبيرة نسبياً مما يسمح بالجريان وتغيير الشكل مع ثبات الحجم.","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)"],"a":1,"e":"الإجابة الصحيحة: لأن قوى التماسك بين جسيماتها ضعيفة نسبياً والمسافات البينية كبيرة نسبياً مما يسمح بالجريان وتغيير الشكل مع ثبات الحجم.","id":"sc2p2_essay27"},{"t":"mc","q":"علل: تصنيف السوائل والغازات معاً تحت اسم المائعات (Fluids).","o":["الطاقة الداخلية للنظام (Internal Energy)","لأن قوى التماسك بين جسيماتها ضعيفة جداً والمسافات البينية كبيرة جداً وحركتها عشوائية وحرة تماماً.","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)"],"a":1,"e":"الإجابة الصحيحة: لأن قوى التماسك بين جسيماتها ضعيفة جداً والمسافات البينية كبيرة جداً وحركتها عشوائية وحرة تماماً.","id":"sc2p2_essay28"},{"t":"mc","q":"علل: انتشار لون نقطة حبر في الماء تدريجياً حتى يتلون الماء بالكامل.","o":["نظرية الجسيمات للمادة (Particle theory)","لقدرتها على الجريان وسهولة تغيير شكلها وتأخذ شكل الإناء الحاوي لها.","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)"],"a":1,"e":"الإجابة الصحيحة: لقدرتها على الجريان وسهولة تغيير شكلها وتأخذ شكل الإناء الحاوي لها.","id":"sc2p2_essay29"},{"t":"mc","q":"علل: انتشار رائحة العطر في الهواء الساخن أسرع من انتشاره في الهواء البارد.","o":["النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)","الطاقة الداخلية للنظام (Internal Energy)","بسبب الحركة المستمرة والعشوائية لجسيمات الحبر والماء والانتشار من التركيز العالي للمنخفض."],"a":3,"e":"الإجابة الصحيحة: بسبب الحركة المستمرة والعشوائية لجسيمات الحبر والماء والانتشار من التركيز العالي للمنخفض.","id":"sc2p2_essay30"},{"t":"mc","q":"علل: انتشار غاز الهيدروجين أسرع من غاز الأكسجين عند نفس درجة الحرارة.","o":["الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)","لأن ارتفاع درجة الحرارة يزيد من متوسط طاقة حركة الجسيمات وسرعة انتشارها."],"a":3,"e":"الإجابة الصحيحة: لأن ارتفاع درجة الحرارة يزيد من متوسط طاقة حركة الجسيمات وسرعة انتشارها.","id":"sc2p2_essay31"},{"t":"mc","q":"علل: تتميز حالة البلازما بالتوصيل الكهربائي الفائق والممتاز.","o":["لأن كتلة جزيء الهيدروجين أصغر من كتلة جزيء الأكسجين (علاقة عكسية بين الكتلة وسرعة الانتشار).","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)"],"a":0,"e":"الإجابة الصحيحة: لأن كتلة جزيء الهيدروجين أصغر من كتلة جزيء الأكسجين (علاقة عكسية بين الكتلة وسرعة الانتشار).","id":"sc2p2_essay32"},{"t":"mc","q":"علل: استخدام البلازما في أجهزة تكييف الهواء الحديثة.","o":["النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)","لأنها تتكون من غازات متأينة تحوي أيونات موجبة وإلكترونات حرة طليقة الحركة.","نظرية الجسيمات للمادة (Particle theory)"],"a":2,"e":"الإجابة الصحيحة: لأنها تتكون من غازات متأينة تحوي أيونات موجبة وإلكترونات حرة طليقة الحركة.","id":"sc2p2_essay33"},{"t":"mc","q":"علل: ثبات درجة حرارة الثلج عند 0°م أثناء عملية الانصهار رغم استمرار التسخين.","o":["نظرية الجسيمات للمادة (Particle theory)","لأن الأيونات المشحونة تقوم بتفكيك الملوثات والجراثيم وتجذب الأتربة مما ينقي الهواء.","الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)"],"a":1,"e":"الإجابة الصحيحة: لأن الأيونات المشحونة تقوم بتفكيك الملوثات والجراثيم وتجذب الأتربة مما ينقي الهواء.","id":"sc2p2_essay34"},{"t":"mc","q":"علل: تعتبر عمليات الانصهار والتجمد والتبخر تغيرات فيزيائية انعكاسية.","o":["الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)","لأن الطاقة الحرارية المكتسبة تستهلك في إضعاف قوى التماسك بين الجسيمات لتحويلها لسائل بدلاً من رفع الحرارة.","نظرية الجسيمات للمادة (Particle theory)"],"a":2,"e":"الإجابة الصحيحة: لأن الطاقة الحرارية المكتسبة تستهلك في إضعاف قوى التماسك بين الجسيمات لتحويلها لسائل بدلاً من رفع الحرارة.","id":"sc2p2_essay35"},{"t":"mc","q":"علل: انخفاض درجة غليان الماء النقي عن 100°م على قمم الجبال العالية.","o":["لأنها لا تنتج مواد جديدة ولا تغير في التركيب الكيميائي للجزيئات ويمكن عكسها بتغيير الحرارة.","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)"],"a":0,"e":"الإجابة الصحيحة: لأنها لا تنتج مواد جديدة ولا تغير في التركيب الكيميائي للجزيئات ويمكن عكسها بتغيير الحرارة.","id":"sc2p2_essay36"},{"t":"mc","q":"علل: ينصح باستخدام قدر الضغط (Steam Pot) في المناطق الجبلية مرتفعة السطح.","o":["النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)","بسبب انخفاض الضغط الجوي بالارتفاع عن مستوى سطح البحر.","نظرية الجسيمات للمادة (Particle theory)"],"a":2,"e":"الإجابة الصحيحة: بسبب انخفاض الضغط الجوي بالارتفاع عن مستوى سطح البحر.","id":"sc2p2_essay37"},{"t":"mc","q":"علل: قدر الضغط يوفر الوقت والطاقة بنسبة 70% إلى 90% عند طهي الطعام.","o":["لأن الضغط الجوي منخفض على الجبال مما يقلل درجة الغليان، فتقوم طنجرة الضغط برفع الضغط للطهي السريع.","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)"],"a":0,"e":"الإجابة الصحيحة: لأن الضغط الجوي منخفض على الجبال مما يقلل درجة الغليان، فتقوم طنجرة الضغط برفع الضغط للطهي السريع.","id":"sc2p2_essay38"},{"t":"mc","q":"علل: إضافة الملح أو السكر للماء النقي يغير من درجات غليانه وتجمده.","o":["النماذج التعليمية (Modelling)","لأن حبس البخار يرفع الضغط فتصل درجة غليان الماء لأعلى من 100°م مما ينضج الطعام أسرع.","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)"],"a":1,"e":"الإجابة الصحيحة: لأن حبس البخار يرفع الضغط فتصل درجة غليان الماء لأعلى من 100°م مما ينضج الطعام أسرع.","id":"sc2p2_essay39"},{"t":"mc","q":"علل: جفاف الملابس المبتلة عند تعرضها للشمس رغم عدم وصول حرارتها لدرجة الغليان.","o":["لأن جزيئات الشوائب تتداخل مع جزيئات الماء وتؤثر على قوى التماسك بينها فتتغير طاقة تغير الحالة.","الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)"],"a":0,"e":"الإجابة الصحيحة: لأن جزيئات الشوائب تتداخل مع جزيئات الماء وتؤثر على قوى التماسك بينها فتتغير طاقة تغير الحالة.","id":"sc2p2_essay40"},{"t":"mc","q":"علل: تجف الملابس بسرعة أكبر في الأيام التي تهب فيها الرياح ويقل فيها الرطوبة.","o":["بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط.","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)"],"a":0,"e":"الإجابة الصحيحة: بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط.","id":"sc2p2_essay41"},{"t":"mc","q":"علل: تعريض رذاذ مستخلص القهوة لهواء ساخن وجاف عند تصنيع القهوة سريعة الذوبان.","o":["الطاقة الداخلية للنظام (Internal Energy)","لأن سرعة الرياح تقطع جزيئات البخار وانخفاض الرطوبة يزيد القابلية للاستيعاب فيزداد معدل التبخر.","النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)"],"a":1,"e":"الإجابة الصحيحة: لأن سرعة الرياح تقطع جزيئات البخار وانخفاض الرطوبة يزيد القابلية للاستيعاب فيزداد معدل التبخر.","id":"sc2p2_essay42"},{"t":"mc","q":"علل: يعتبر الترمومتر الطبي نظاماً مغلقاً.","o":["الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)","لزيادة مساحة سطح القطرات وسرعة التبخر الفوري للماء وجمع بلورات القهوة الجافة."],"a":3,"e":"الإجابة الصحيحة: لزيادة مساحة سطح القطرات وسرعة التبخر الفوري للماء وجمع بلورات القهوة الجافة.","id":"sc2p2_essay43"},{"t":"mc","q":"علل: تعتبر قارورة الفراغ (الترمس) نظاماً معزولاً.","o":["نظرية الجسيمات للمادة (Particle theory)","الطاقة الداخلية للنظام (Internal Energy)","لأنه يتبادل الطاقة (الحرارة) فقط مع جسم المريض دون تبادل المادة (الزئبق).","النماذج التعليمية (Modelling)"],"a":2,"e":"الإجابة الصحيحة: لأنه يتبادل الطاقة (الحرارة) فقط مع جسم المريض دون تبادل المادة (الزئبق).","id":"sc2p2_essay44"},{"t":"mc","q":"علل: تعبر درجة الحرارة عن متوسط طاقة حركة الجسيمات وليس طاقة حركة الجسيم الواحد.","o":["الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","النماذج التعليمية (Modelling)"],"a":2,"e":"الإجابة الصحيحة: لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","id":"sc2p2_essay45"},{"t":"mc","q":"علل: ارتفاع درجة حرارة المادة عند اكتسابها طاقة حرارية.","o":["الطاقة الداخلية للنظام (Internal Energy)","لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة.","النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)"],"a":1,"e":"الإجابة الصحيحة: لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة.","id":"sc2p2_essay46"},{"t":"mc","q":"علل: ارتفاع درجة حرارة 0.5 كجم ماء أسرع من 1 كجم ماء عند تسخينهما بنفس المصدر بنفس الزمن.","o":["نظرية الجسيمات للمادة (Particle theory)","الطاقة الداخلية للنظام (Internal Energy)","لأن اكتساب الطاقة الحرارية يزيد من متوسط طاقة حركة الجسيمات وبالتالي ترتفع حرارة النظام.","النماذج التعليمية (Modelling)"],"a":2,"e":"الإجابة الصحيحة: لأن اكتساب الطاقة الحرارية يزيد من متوسط طاقة حركة الجسيمات وبالتالي ترتفع حرارة النظام.","id":"sc2p2_essay47"},{"t":"mc","q":"علل: يفضل استخدام النحاس أو الألومنيوم في تصنيع أواني الطهي بدلاً من المواد الأخرى.","o":["لأن الطاقة الحرارية تتوزع على عدد أقل من الجسيمات في الكتلة الأصغر فيزداد متوسط طاقة حركتها بمقدار أكبر.","نظرية الجسيمات للمادة (Particle theory)","الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)"],"a":0,"e":"الإجابة الصحيحة: لأن الطاقة الحرارية تتوزع على عدد أقل من الجسيمات في الكتلة الأصغر فيزداد متوسط طاقة حركتها بمقدار أكبر.","id":"sc2p2_essay48"},{"t":"mc","q":"علل: استخدام الماء كأفضل سائل لتبريد محركات السيارات (في الرادياتير).","o":["النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)","لأن حرارتها النوعية منخفضة فيسخن بسرعة ويوصل الحرارة للطعام بكفاءة.","الطاقة الداخلية للنظام (Internal Energy)"],"a":2,"e":"الإجابة الصحيحة: لأن حرارتها النوعية منخفضة فيسخن بسرعة ويوصل الحرارة للطعام بكفاءة.","id":"sc2p2_essay49"},{"t":"mc","q":"ماذا يحدث عند: وضع نقطة حبر أو كريستالة برمنجنات البوتاسيوم في beaker به ماء.","o":["لأن حرارته النوعية هي الأعلى مرتفعة جداً فيمتص كميات كبيرة من حرارة المحرك دون ارتفاع كبير في حرارته.","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)"],"a":0,"e":"الإجابة الصحيحة: لأن حرارته النوعية هي الأعلى مرتفعة جداً فيمتص كميات كبيرة من حرارة المحرك دون ارتفاع كبير في حرارته.","id":"sc2p2_essay50"},{"t":"mc","q":"ماذا يحدث عند: وضع نقطة حبر أو كريستالة برمنجنات البوتاسيوم في beaker به ماء.","o":["تنتشر جسيمات المادة الملونة تدريجياً في الماء حتى يتلون السائل بالكامل باللون البنفسجي أو لون الحبر.","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)"],"a":0,"e":"الإجابة الصحيحة: تنتشر جسيمات المادة الملونة تدريجياً في الماء حتى يتلون السائل بالكامل باللون البنفسجي أو لون الحبر.","id":"sc2p2_essay51"},{"t":"mc","q":"ماذا يحدث عند: الضغط على مكبس محقنة طبية تحتوي على هواء ومسدودة الطرف.","o":["نظرية الجسيمات للمادة (Particle theory)","الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)","يقل حجم الهواء المنسكب ويزداد ضغطه لتقليل المسافات البينية بين جزيئاته دون تغير حجم الجزيئات نفسها."],"a":3,"e":"الإجابة الصحيحة: يقل حجم الهواء المنسكب ويزداد ضغطه لتقليل المسافات البينية بين جزيئاته دون تغير حجم الجزيئات نفسها.","id":"sc2p2_essay52"},{"t":"mc","q":"ماذا يحدث عند: الضغط على مكبس محقنة طبية تحتوي على ماء أو رمل.","o":["لا يتغير الحجم ولا ينضغط المكبس لأن السوائل والمواد الصلبة غير قابلة للانضغط.","الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)"],"a":0,"e":"الإجابة الصحيحة: لا يتغير الحجم ولا ينضغط المكبس لأن السوائل والمواد الصلبة غير قابلة للانضغط.","id":"sc2p2_essay53"},{"t":"mc","q":"ماذا يحدث عند: تسخين غاز متعادل إلى درجات حرارة فائقة جداً أو إمراره في مجال كهربائي قوي.","o":["النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)","يتأين الغاز ويتحول إلى الحالة البلازمية (أيونات موجبة وإلكترونات حرة).","الطاقة الداخلية للنظام (Internal Energy)"],"a":2,"e":"الإجابة الصحيحة: يتأين الغاز ويتحول إلى الحالة البلازمية (أيونات موجبة وإلكترونات حرة).","id":"sc2p2_essay54"},{"t":"mc","q":"ماذا يحدث عند: مرور الأشعة الكونية المشحونة بالقرب من المجال المغناطيسي للقطبين الشمالي والجنوبي للأرض.","o":["تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)"],"a":0,"e":"الإجابة الصحيحة: تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","id":"sc2p2_essay55"},{"t":"mc","q":"ماذا يحدث عند: اكتساب قطعة من الثلج (-5°م) كمية من الطاقة الحرارية باستمرار.","o":["نظرية الجسيمات للمادة (Particle theory)","ترتفع حرارته حتى 0°م، ثم تثبت عند 0°م حتى يكتمل الانصهار، ثم ترتفع حرارة الماء حتى 100°م.","الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)"],"a":1,"e":"الإجابة الصحيحة: ترتفع حرارته حتى 0°م، ثم تثبت عند 0°م حتى يكتمل الانصهار، ثم ترتفع حرارة الماء حتى 100°م.","id":"sc2p2_essay56"},{"t":"mc","q":"ماذا يحدث عند: وصول الماء إلى درجة الغليان (100°م) مع استمرار التسخين.","o":["الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","النماذج التعليمية (Modelling)"],"a":2,"e":"الإجابة الصحيحة: تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","id":"sc2p2_essay57"},{"t":"mc","q":"ماذا يحدث عند: ترك الثلج الجاف (ثاني أكسيد الكربون الصلب) في درجة حرارة الغرفة.","o":["نظرية الجسيمات للمادة (Particle theory)","الطاقة الداخلية للنظام (Internal Energy)","يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","النماذج التعليمية (Modelling)"],"a":2,"e":"الإجابة الصحيحة: يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","id":"sc2p2_essay58"},{"t":"mc","q":"ماذا يحدث عند: ملامسة بخار الماء الجوي لسطح بارد (مثل أوراق الشجر في الصباح الباكر).","o":["الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)","يتكثف بخار الماء ويتحول إلى قطرات ماء سائلة تسمى الصقيع أو الندى."],"a":3,"e":"الإجابة الصحيحة: يتكثف بخار الماء ويتحول إلى قطرات ماء سائلة تسمى الصقيع أو الندى.","id":"sc2p2_essay59"},{"t":"mc","q":"ماذا يحدث لدرجة غليان الماء النقي عند الصعود إلى قمة جبل ارتفاعه 3000 متر فوق سطح البحر.","o":["النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","تقل درجة غليان الماء بمقدار 10°م فتصبح 90°م لأن الضغط الجوي ينخفض."],"a":3,"e":"الإجابة الصحيحة: تقل درجة غليان الماء بمقدار 10°م فتصبح 90°م لأن الضغط الجوي ينخفض.","id":"sc2p2_essay60"},{"t":"mc","q":"ماذا يحدث لدرجة غليان الماء النقي عند الهبوط إلى منخفض عمقه 300 متر تحت سطح البحر.","o":["النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)","الطاقة الداخلية للنظام (Internal Energy)","ترتفع درجة غليان الماء بمقدار 1°م فتصبح 101°م لأن الضغط الجوي يزداد."],"a":3,"e":"الإجابة الصحيحة: ترتفع درجة غليان الماء بمقدار 1°م فتصبح 101°م لأن الضغط الجوي يزداد.","id":"sc2p2_essay61"},{"t":"mc","q":"ماذا يحدث عند: زيادة الضغط داخل طنجرة الضغط (قدر الضغط) أثناء طهي الطعام.","o":["ترتفع درجة غليان الماء لأعلى من 100°م فينضج الطعام بسرعة ويقل زمن الطهي وتوفير الطاقة.","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)"],"a":0,"e":"الإجابة الصحيحة: ترتفع درجة غليان الماء لأعلى من 100°م فينضج الطعام بسرعة ويقل زمن الطهي وتوفير الطاقة.","id":"sc2p2_essay62"},{"t":"mc","q":"ماذا يحدث لدرجة تجمد ودرجة غليان الماء عند إدابة 180 جم من الجلوكوز في لتر ماء نقي.","o":["النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)","ترتفع درجة الغليان لتصبح 100.5°م وتنخفض درجة التجمد لتصبح -1.86°م.","نظرية الجسيمات للمادة (Particle theory)"],"a":2,"e":"الإجابة الصحيحة: ترتفع درجة الغليان لتصبح 100.5°م وتنخفض درجة التجمد لتصبح -1.86°م.","id":"sc2p2_essay63"},{"t":"mc","q":"ماذا يحدث لمعدل تبخر سائل عند زيادة مساحة السطح المعرضة للهواء.","o":["يزداد معدل تبخر السائل لزيادة عدد الجزيئات السطحية المعرضة للهواء.","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)"],"a":0,"e":"الإجابة الصحيحة: يزداد معدل تبخر السائل لزيادة عدد الجزيئات السطحية المعرضة للهواء.","id":"sc2p2_essay64"},{"t":"mc","q":"ماذا يحدث لمعدل تبخر سائل عند ارتفاع نسبة الرطوبة في الجو.","o":["يقل معدل تبخر السائل لأن الهواء يكون مشبعاً ببخار الماء.","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)"],"a":0,"e":"الإجابة الصحيحة: يقل معدل تبخر السائل لأن الهواء يكون مشبعاً ببخار الماء.","id":"sc2p2_essay65"},{"t":"mc","q":"ماذا يحدث لمعدل تبخر سائل عند زيادة سرعة تيارات الهواء (الرياح).","o":["الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)","يزداد معدل تبخر السائل لنقل الجزيئات المتبخرة بعيداً عن السطح."],"a":3,"e":"الإجابة الصحيحة: يزداد معدل تبخر السائل لنقل الجزيئات المتبخرة بعيداً عن السطح.","id":"sc2p2_essay66"},{"t":"mc","q":"ماذا يحدث لكتلة ودرجة حرارة ماء يغلي داخل إناء مفتوح (نظام مفتوح).","o":["تقل كتلة النظام (لتبخر بخار الماء) وتقل درجة الحرارة لانتقال الحرارة للوسط المحيط.","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)"],"a":0,"e":"الإجابة الصحيحة: تقل كتلة النظام (لتبخر بخار الماء) وتقل درجة الحرارة لانتقال الحرارة للوسط المحيط.","id":"sc2p2_essay67"},{"t":"mc","q":"ماذا يحدث لكتلة ودرجة حرارة علبة صودا مغلقة موضوعة في ثلج (نظام مغلق).","o":["الطاقة الداخلية للنظام (Internal Energy)","النماذج التعليمية (Modelling)","تظل كتلة النظام ثابته، بينما تقل درجة حرارته بفقدان الطاقة للثلج.","نظرية الجسيمات للمادة (Particle theory)"],"a":2,"e":"الإجابة الصحيحة: تظل كتلة النظام ثابته، بينما تقل درجة حرارته بفقدان الطاقة للثلج.","id":"sc2p2_essay68"},{"t":"mc","q":"ماذا يحدث لكتلة ودرجة حرارة مشروب ساخن داخل قارورة الفراغ / الترمس (نظام معزول).","o":["النماذج التعليمية (Modelling)","تظل كتلة المشروب ودرجة حرارته ثابتين لعدم وجود تبادل للمادة أو الطاقة.","الطاقة الداخلية للنظام (Internal Energy)","نظرية الجسيمات للمادة (Particle theory)"],"a":1,"e":"الإجابة الصحيحة: تظل كتلة المشروب ودرجة حرارته ثابتين لعدم وجود تبادل للمادة أو الطاقة.","id":"sc2p2_essay69"},{"t":"mc","q":"ماذا يحدث للطاقة الداخلية للنظام عند زيادة طاقة الحركة لجسيماته.","o":["الطاقة الداخلية للنظام (Internal Energy)","تزداد الطاقة الداخلية للنظام (لأن الطاقة الداخلية = طاقة الحركة + طاقة الوضع).","النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)"],"a":1,"e":"الإجابة الصحيحة: تزداد الطاقة الداخلية للنظام (لأن الطاقة الداخلية = طاقة الحركة + طاقة الوضع).","id":"sc2p2_essay70"},{"t":"mc","q":"ماذا يحدث لمتوسط طاقة حركة الجسيمات عند رفع درجة حرارة المادة.","o":["نظرية الجسيمات للمادة (Particle theory)","يزداد متوسط طاقة حركة الجسيمات وتزداد سرعتها وتصادماتها.","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)"],"a":1,"e":"الإجابة الصحيحة: يزداد متوسط طاقة حركة الجسيمات وتزداد سرعتها وتصادماتها.","id":"sc2p2_essay71"},{"t":"mc","q":"ماذا يحدث عند تسخين كتلين متساويتين من الماء والزيت بنفس المصدر الحراري لنفس الفترة الزمنية.","o":["النماذج التعليمية (Modelling)","نظرية الجسيمات للمادة (Particle theory)","الطاقة الداخلية للنظام (Internal Energy)","ترتفع درجة حرارة الزئبق/الزيت بمقدار أكبر من الماء لأن الحرارة النوعية للزيت أقل من الماء."],"a":3,"e":"الإجابة الصحيحة: ترتفع درجة حرارة الزئبق/الزيت بمقدار أكبر من الماء لأن الحرارة النوعية للزيت أقل من الماء.","id":"sc2p2_essay72"},{"t":"mc","q":"ماذا يحدث عند تسخين كتلين متساويتين من النحاس والألومنيوم كسبتا نفس كمية الحرارة.","o":["نظرية الجسيمات للمادة (Particle theory)","النماذج التعليمية (Modelling)","الطاقة الداخلية للنظام (Internal Energy)","ترتفع درجة حرارة النحاس بمقدار أكبر من الألومنيوم لأن الحرارة النوعية للنحاس أقل."],"a":3,"e":"الإجابة الصحيحة: ترتفع درجة حرارة النحاس بمقدار أكبر من الألومنيوم لأن الحرارة النوعية للنحاس أقل.","id":"sc2p2_essay73"},{"t":"mc","q":"ماذا يحدث عند تسخين كتلين متساويتين من الماء وا const MA2=[["التنفس هو العملية التي يأخذ بها الجسم الأكسجين ويتخلص من ثاني أكسيد الكربون.","الشهيق: دخول هواء به أكسجين كثير وثاني أكسيد كربون قليل، ويرتفع الصدر لأعلى.","الزفير: خروج هواء به ثاني أكسيد كربون كثير وأكسجين قليل، وينخفض الصدر لأسفل.","نشاط: هواء الزفير يعكّر ماء الجير ويحوّله لأبيض لبني، وهواء الغرفة يعكّره قليلاً.","أنابيب كاشف الغاز تقيس الأكسجين وثاني أكسيد الكربون في هواء الزفير."],["الجهاز التنفسي مسؤول عن التنفس. مسار الهواء: الأنف (أو الفم) ثم القصبة الهوائية ثم الرئتان.","داخل كل رئة حويصلات هوائية صغيرة تحيط بها شبكة أوعية دموية، والرئتان هما الموقع الرئيسي لتبادل الغازات.","الأكسجين ينتقل إلى الدم ويضخه القلب لكل الجسم، وثاني أكسيد الكربون ينتقل من الدم إلى الهواء ويخرج بالزفير.","السمك يتنفس بالخياشيم (يمتص الأكسجين الذائب في الماء)، والقطة تتنفس بالرئتين."]],
ME2=[["Breathing is the process by which the body takes in oxygen and lets out carbon dioxide.","Breathing in: air with a large amount of oxygen enters, and the chest moves up.","Breathing out: air with a large amount of carbon dioxide leaves, and the chest moves down.","Activity: breathed-out air turns limewater milky white, room air only slightly cloudy.","Gas detector tubes check oxygen and carbon dioxide in breathed-out air."],["The respiratory system is responsible for breathing. Air path: nose (or mouth), windpipe, then the lungs.","Each lung has tiny alveoli surrounded by blood vessels; the lungs are the main site of gas exchange.","Oxygen moves into the blood and the heart pumps it around the body; carbon dioxide moves into the air and is breathed out.","Fish breathe with gills (absorbing oxygen dissolved in water); a cat breathes with lungs."]],
MA3=[["الهضم هو تكسير الطعام وتحويله إلى صورة سهلة الامتصاص، والمسار الهضمي من الفم إلى فتحة الشرج.","الترتيب: الفم، البلعوم، المريء، المعدة، الأمعاء الدقيقة، الأمعاء الغليظة.","الأسنان تقطع وتطحن، واللعاب يبدأ هضم النشا ويحوّل بعضه إلى سكر.","المعدة تفرز عصارة هضمية، والأمعاء الدقيقة يكتمل فيها الهضم ويُمتص معظم الغذاء.","الأمعاء الغليظة تمتص الماء ويخرج الباقي كبراز، والسمك والقطة لهما نفس المسار."],["محلول اليود يكشف النشا: يتحول من البني إلى الأزرق المسود.","أنبوب (نشا + لعاب) لا يتغير لون اليود فيه لأن النشا تحول إلى سكر.","أنبوب (نشا + ماء) يتحول فيه اليود لأزرق مسود لأن النشا لم يُهضم.","نضع الأنابيب في ماء 40°م لتكون مثل حرارة الجسم. الاستنتاج: اللعاب يهضم النشا ويحوله إلى سكر."],["الأمعاء الدقيقة هي العضو الرئيسي لامتصاص الغذاء المهضوم ومعظم الماء.","الزغابات نتوءات صغيرة تغطي جدارها الداخلي وتزيد مساحة السطح، وفيها أوعية دموية تنقل الغذاء للدم.","الدم يحمل الغذاء الممتص إلى الكبد ثم لكل الجسم، والكبد يخزّن بعضه.","الباقي غير المهضوم ينتقل للأمعاء الغليظة ثم يخرج كبراز.","نشاط المنشفة الخشنة يوضح كيف تزيد الزغابات مساحة الامتصاص."]],
ME3=[["Digestion is breaking down food into a form easy to absorb; the digestive tract runs from the mouth to the anus.","Order: mouth, pharynx, food pipe, stomach, small intestine, large intestine.","Teeth cut and grind; saliva begins digesting starch and changes some into sugar.","The stomach secretes digestive juice; digestion is completed and most nutrients absorbed in the small intestine.","The large intestine absorbs water and the rest leaves as feces; fish and cats have the same path."],["Iodine solution detects starch: it changes from brown to blue-black.","Tube 1 (starch + saliva): iodine color does not change because starch changed into sugar.","Tube 2 (starch + water): iodine turns blue-black because starch was not digested.","Tubes are warmed to 40°C like the body. Conclusion: saliva digests starch into sugar."],["The small intestine is the main organ absorbing digested food and most water.","Villi are tiny bumps on its inner wall; they increase surface area and move nutrients into the blood vessels.","Blood carries nutrients to the liver, then to the whole body; the liver stores some.","Undigested food moves on to the large intestine and leaves as feces.","The rough towel activity shows how villi increase the absorption surface."]];

["m","Why do the particles of matter store potential energy?","Due to the forces of attraction between them|Because they are in continuous motion|Because they are very large|Because they have no mass","لماذا تختزن جسيمات المادة طاقة وضع؟","بسبب قوى التجاذب بينها|لأنها في حركة مستمرة|لأنها كبيرة جداً|لأنها بلا كتلة","طاقة الوضع من التجاذب."],
["m","Why do the particles of matter have kinetic energy?","Because they are in continuous motion|Because of the forces of attraction|Because they are charged|Because they have no spaces","لماذا تمتلك جسيمات المادة طاقة حركة؟","لأنها في حالة حركة مستمرة|بسبب قوى التجاذب|لأنها مشحونة|لأنها بلا فراغات","طاقة الحركة من الحركة."],
["m","Why do solids have a definite shape and a definite volume?","Very strong forces of attraction and very small interparticle spaces|Very weak forces and very large spaces|Relatively weak forces and large spaces|There are no forces between particles","لماذا للمواد الصلبة شكل وحجم محددان؟","قوى تجاذب قوية جداً وفراغات بينية صغيرة جداً|قوى ضعيفة جداً وفراغات كبيرة جداً|قوى ضعيفة نسبياً وفراغات كبيرة|لا توجد قوى بين الجسيمات","تجاذب قوي وفراغات صغيرة."],
["m","Why do liquids have an indefinite shape but a definite volume?","Relatively weak forces of attraction and relatively large interparticle spaces|Very strong forces and very small spaces|Very weak forces and very large spaces|Their particles do not move","لماذا للسوائل شكل غير محدد وحجم محدد؟","قوى تجاذب ضعيفة نسبياً وفراغات بينية كبيرة نسبياً|قوى قوية جداً وفراغات صغيرة جداً|قوى ضعيفة جداً وفراغات كبيرة جداً|لأن جسيماتها لا تتحرك","القوى كافية لتماسك الحجم لكن لا تثبّت الشكل."],
["m","Why do gases have no definite shape and no definite volume?","Very weak forces of attraction and very large interparticle spaces|Very strong forces of attraction|Very small spaces|They have no particles","لماذا لا يوجد للغازات شكل ولا حجم محدد؟","قوى تجاذب ضعيفة جداً وفراغات بينية كبيرة جداً|قوى تجاذب قوية جداً|فراغات صغيرة جداً|لأنها بلا جسيمات","تجاذب ضعيف جداً وفراغات كبيرة."],
["m","Why is it difficult to break a piece of rock?","The forces of attraction between its particles are very strong|Its particles are far apart|It has kinetic energy only|It is a fluid","لماذا يصعب كسر قطعة صخر؟","لأن قوى التجاذب بين جسيماتها قوية جداً|لأن جسيماتها متباعدة|لأن لها طاقة حركة فقط|لأنها مائع","تجاذب قوي جداً."],
["m","Why can table salt dissolve in water?","Salt particles occupy the spaces between water particles|Salt particles disappear|Water particles become smaller|Salt is a gas","لماذا يذوب ملح الطعام في الماء؟","لأن جسيمات الملح تشغل الفراغات بين جسيمات الماء|لأن جسيمات الملح تختفي|لأن جسيمات الماء تصغر|لأن الملح غاز","بتدخل في الفراغات."],
["m","Why are gases easily compressible?","The interparticle spaces between their particles are very large|The forces between particles are very strong|They have fixed shapes|Their particles are charged","لماذا تنضغط الغازات بسهولة؟","لأن الفراغات بين جسيماتها كبيرة جداً|لأن القوى بين جسيماتها قوية جداً|لأن لها أشكالاً ثابتة|لأن جسيماتها مشحونة","فراغات كبيرة جداً."],
["m","Why does smoke from a candle wick spread in the air?","Smoke particles collide with air particles and move randomly in all directions|Smoke is heavier than air|Air particles stop moving|The candle attracts the smoke","لماذا ينتشر دخان فتيل الشمعة في الهواء؟","لأن جسيمات الدخان تتصادم مع جسيمات الهواء فتتحرك عشوائياً في كل الاتجاهات|لأن الدخان أثقل من الهواء|لأن جسيمات الهواء تتوقف|لأن الشمعة تجذب الدخان","حركة براونية وانتشار."],
["m","What causes the random motion of pollen grains suspended in water?","Collisions with the molecules of the fluid|Gravity only|A magnetic force|The temperature of the pollen","ما سبب الحركة العشوائية لحبوب اللقاح المعلقة في الماء؟","تصادمها مع جزيئات المائع|الجاذبية فقط|قوة مغناطيسية|حرارة حبوب اللقاح","تصادمات جزيئات المائع."],
["m","How are gases ionized to form plasma?","Passing through a strong electric field or heating to extremely high temperatures|Cooling them|Compressing them by hand|Mixing them with water","كيف تتأين الغازات لتكوّن البلازما؟","بمرورها في مجال كهربي قوي أو بتسخينها لدرجات حرارة عالية جداً|بتبريدها|بضغطها باليد|بخلطها بالماء","مجال كهربي قوي أو حرارة عالية."],
["m","Why is the plasma state used in air conditioners?","To improve air quality in enclosed spaces|To make the air colder|To make the air heavier|To produce light","لماذا تُستخدم حالة البلازما في المكيفات؟","لتحسين جودة الهواء في الأماكن المغلقة|لتبريد الهواء أكثر|لزيادة وزن الهواء|لإنتاج الضوء","الأيونات تحطم الملوثات."],
["m","Which of these is an example of plasma?","Lightning|Ice|Water vapor|A rock","أي مما يلي مثال على البلازما؟","البرق|الثلج|بخار الماء|الصخرة","البرق والشمس والنجوم والشفق."],
["m","Why are educational models used in science?","To simplify things that are too tiny to be seen or too massive to be comprehended|To make real objects bigger|To replace all experiments|To change the properties of matter","لماذا تُستخدم النماذج التعليمية في العلوم؟","لتبسيط ما هو صغير جداً لا يُرى أو ضخم جداً لا يُستوعب|لتكبير الأشياء الحقيقية|لتحل محل كل التجارب|لتغيير خواص المادة","النمذجة تبسّط الفهم."]],[]);
SUBJ.push({id:"ar8",g:8,t:"العلوم",ic:"🔬",s:"",rtl:1,T:35,MT:60,ul:["الوحدة","Unit"],C:[{n:"المادة والطاقة",ne:"Matter and Energy",L:ar(D4),M:[["المادة هي كل ما له كتلة ويشغل حيّزاً، وكتلتها كمية ثابتة لا تتغير من مكان لآخر.","يصنّف العلماء المواد حسب حالتها الفيزيائية: صلبة وسائلة وغازية، وندرس خواصها: الشكل والانسيابية، الحجم والانضغاطية، والانتشار.","السوائل والغازات موائع: تنساب وتأخذ شكل الإناء، أما الصلب فله شكل ثابت. اللزوجة هي مقاومة السائل للانسياب، فكلما قلّت زادت الانسيابية (الماء أقل لزوجة من العسل).","الغازات قابلة للانضغاط (يقل حجمها بزيادة الضغط)، أما السوائل والمواد الصلبة فلا تنضغط.","الانتشار هو حركة الجسيمات من التركيز المرتفع إلى المنخفض. معدله في الغازات أكبر من السوائل أكبر من الصلب، ويزداد بارتفاع الحرارة ويقل بزيادة كتلة الجسيمات."],["النمذجة: تمثيل مبسّط لما هو صغير جداً لا يُرى أو ضخم جداً لا يُستوعب، مثل جسيمات المادة والنظام الشمسي.","نظرية الجسيمات: المادة تتكون من جسيمات صغيرة جداً في حركة مستمرة، جسيمات المادة الواحدة متماثلة، وبينها فراغات تختلف حسب الحالة، وتختزن طاقة وضع (بسبب التجاذب) وطاقة حركة (بسبب الحركة).","الصلب: تجاذب قوي جداً وفراغات صغيرة جداً (شكل وحجم ثابتان). السائل: تجاذب ضعيف نسبياً وفراغات أكبر (شكل متغير وحجم ثابت). الغاز: تجاذب ضعيف جداً وفراغات كبيرة جداً (لا شكل ولا حجم ثابت).","هذا يفسّر صعوبة كسر الصخر، وانسياب السوائل، وذوبان الملح في الماء، وانضغاط الغازات.","الحركة البراونية: حركة عشوائية لجسيمات كبيرة نسبياً معلقة في مائع بسبب تصادمها بجسيماته (اكتشفها روبرت براون)، وتفسّر انتشار دخان الشمعة.","البلازما: الحالة الرابعة، غاز متأين من أيونات موجبة وإلكترونات حرة وتوصيلها الكهربي عالٍ، وتحدث بمجال كهربي قوي أو حرارة عالية جداً، مثل الشمس والنجوم والبرق والشفق القطبي، وتُستخدم في مكيفات تنقي الهواء."]]}]},{id:"en8",g:8,t:"Science",ic:"🧪",s:"",T:50,MT:90,ul:["الوحدة","Unit"],C:[{n:"المادة والطاقة",ne:"Matter and Energy",L:D4,M:[["Matter is anything that has mass and occupies space; its mass is constant and does not change from one place to another.","Scientists classify materials by physical state: solid, liquid and gas. We study shape and fluidity, volume and compressibility, and diffusibility.","Liquids and gases are fluids: they flow and take the shape of their container, while solids have a fixed shape. Viscosity is a liquid's resistance to flow: the lower it is, the greater the fluidity (water is less viscous than honey).","Gases are compressible (their volume decreases as pressure increases); liquids and solids are incompressible.","Diffusion is the movement of particles from high to low concentration. The rate is gases > liquids > solids; it increases with temperature and decreases as the mass of the particles increases."],["Modelling is a simplified representation of things too tiny to be seen or too massive to be comprehended, like particles of matter and the solar system.","Particle theory: matter is made of very tiny particles in continuous motion; particles of one substance are identical, there are spaces between them that vary with the state, and they have potential energy (attraction) and kinetic energy (motion).","Solid: very strong attraction and very small spaces (definite shape and volume). Liquid: relatively weak attraction and larger spaces (indefinite shape, definite volume). Gas: very weak attraction and very large spaces (no definite shape or volume).","This explains why a rock is hard to break, why liquids flow, why salt dissolves in water, and why gases are compressible.","Brownian motion: random motion of relatively large particles suspended in a fluid caused by collisions with its particles (discovered by Robert Brown); it explains the spread of candle smoke.","Plasma: the fourth state, an ionized gas of positive ions and free electrons with high electrical conductivity. It forms in a strong electric field or at extremely high temperatures, e.g. the Sun, stars, lightning and the aurora, and is used in air conditioners to purify air."]]}]});

mk2(D5[0],0,[["d","The temperature at which a substance begins to change from the solid to the liquid state","Melting point","درجة الحرارة التي تبدأ عندها المادة في التحول من الحالة الصلبة إلى السائلة","درجة الانصهار"],
["d","The temperature at which a substance begins to change from the liquid to the gaseous state","Boiling point","درجة الحرارة التي تبدأ عندها المادة في التحول من الحالة السائلة إلى الغازية","درجة الغليان"],
["d","The change of matter from the liquid state to the solid state when losing thermal energy","Freezing","تحول المادة من الحالة السائلة إلى الصلبة عند فقد طاقة حرارية","التجمد"],
["d","The change of matter from the gaseous state to the liquid state when losing thermal energy","Condensation","تحول المادة من الحالة الغازية إلى السائلة عند فقد طاقة حرارية","التكاثف"],
["d","The change of matter from the liquid state to the gaseous state when gaining thermal energy","Evaporation","تحول المادة من الحالة السائلة إلى الغازية عند اكتساب طاقة حرارية","التبخر"],
["d","The change of matter from the solid state directly to the gaseous state without passing through the liquid state","Sublimation","تحول المادة من الحالة الصلبة مباشرة إلى الغازية دون المرور بالحالة السائلة","التسامي"],
["d","The change of matter from the gaseous state directly to the solid state","Deposition","تحول المادة من الحالة الغازية مباشرة إلى الصلبة","الترسيب"],
["d","The amount of water vapour present in the air","Humidity","كمية بخار الماء الموجودة في الهواء","الرطوبة"],
["j","curve","Which part of the heating curve shows the melting process (solid + liquid)?","Part 2|Part 1|Part 3|Part 5","أي جزء من منحنى التسخين يوضح عملية الانصهار (صلب + سائل)؟","الجزء 2|الجزء 1|الجزء 3|الجزء 5","عند الانصهار تثبت درجة الحرارة (الجزء 2)."],
["j","curve","Which part of the heating curve shows the boiling process (liquid + gas)?","Part 4|Part 2|Part 3|Part 1","أي جزء من منحنى التسخين يوضح عملية الغليان (سائل + غاز)؟","الجزء 4|الجزء 2|الجزء 3|الجزء 1","عند الغليان تثبت الحرارة (الجزء 4)."],

["j","curve","Why is the temperature constant in part 4?","The energy gained weakens the attraction forces between particles|The heating has stopped|The particles stop moving|The substance is solid","لماذا تثبت درجة الحرارة في الجزء 4؟","الطاقة المكتسبة تُضعف قوى التجاذب بين الجسيمات|توقف التسخين|توقفت الجسيمات عن الحركة|المادة صلبة","الطاقة تُستخدم في تغيير الحالة لا رفع الحرارة."],
["s","What is the state of the substance?","Solid|Solid + liquid|Liquid|Liquid + gas|Gas","Below the melting point:0|Equal to the melting point:1|Between the melting and boiling points:2|Equal to the boiling point:3|Above the boiling point:4","ما حالة المادة؟","صلبة|صلبة + سائلة|سائلة|سائلة + غازية|غازية","أقل من درجة الانصهار:0|تساوي درجة الانصهار:1|بين الانصهار والغليان:2|تساوي درجة الغليان:3|أعلى من درجة الغليان:4","حالة المادة حسب درجة حرارتها."],
["s","Does it gain or lose thermal energy?","Gains thermal energy|Loses thermal energy","Melting:0|Evaporation:0|Sublimation:0|Freezing:1|Condensation:1|Deposition:1","هل تكتسب طاقة حرارية أم تفقدها؟","تكتسب طاقة|تفقد طاقة","الانصهار:0|التبخر:0|التسامي:0|التجمد:1|التكاثف:1|الترسيب:1","الانصهار والتبخر والتسامي تحتاج تسخين."],
["s","Evaporation or boiling?","Evaporation|Boiling","Occurs at any temperature below the boiling point:0|Only surface molecules escape:0|Takes energy from the surrounding medium:0|Occurs at a fixed temperature:1|Occurs for all molecules of the liquid:1|Accompanied by bubbles:1","تبخر أم غليان؟","التبخر|الغليان","يحدث عند أي درجة أقل من الغليان:0|تفلت جزيئات السطح فقط:0|يأخذ الطاقة من الوسط المحيط:0|يحدث عند درجة حرارة ثابتة:1|يحدث لكل جزيئات السائل:1|يصاحبه فقاقيع:1","الفرق بين التبخر والغليان."],
["o","Arrange what happens when ice is heated:","Ice temperature rises until the melting point|Ice melts at a constant temperature (0°C)|Water temperature rises until the boiling point|Water boils at a constant temperature (100°C)","رتّب ما يحدث عند تسخين الثلج:","ترتفع حرارة الثلج حتى درجة الانصهار|ينصهر الثلج عند درجة حرارة ثابتة (0°م)|ترتفع حرارة الماء حتى درجة الغليان|يغلي الماء عند درجة ثابتة (100°م)","منحنى التسخين بالترتيب."],
["o","Arrange the states from the lowest to the highest kinetic energy of particles:","Solid|Liquid|Gas","رتّب الحالات من الأقل إلى الأكثر طاقة حركة للجسيمات:","الصلبة|السائلة|الغازية","طاقة الحركة تزيد من الصلب للغاز."],
["o","Arrange the steps of making instant coffee:","Prepare a concentrated coffee extract|Spray the extract into very hot dry air (about 250°C)|The droplets evaporate quickly|Collect the solid instant coffee crystals","رتّب خطوات صناعة القهوة سريعة الذوبان:","تحضير مستخلص قهوة مركّز|رش المستخلص في هواء ساخن جاف جداً (حوالي 250°م)|تتبخر القطرات بسرعة|تجميع بلورات القهوة الصلبة","خطوات الصناعة."],

SUBJ.filter(x=>x.g==8).forEach(x=>{x.C[0].L.push(...(x.rtl?A5:D5));x.C[0].M.push(...(x.rtl?[["#الجزء الأول: الانصهار والغليان ومنحنى التسخين","عند الضغط الجوي العادي درجة انصهار الجليد 0°م ودرجة غليان الماء 100°م.","عند التسخين ترتفع حرارة الجليد حتى درجة الانصهار (تزداد طاقة حركة الجسيمات)، ثم تثبت أثناء الانصهار لأن الطاقة تُضعف قوى التجاذب، وبعدها ترتفع حرارة الماء حتى الغليان وتثبت أثناء الغليان.","منحنى التسخين: أقل من الانصهار صلب، عند الانصهار صلب + سائل، بينهما سائل، عند الغليان سائل + غاز، وأعلى من الغليان غاز. وزمن الانصهار أقل من زمن الغليان.","اكتساب الطاقة يزيد طاقة حركة الجسيمات فترتفع الحرارة، وفقدها يقللها فتنخفض.","الضغط الجوي: بزيادته ترتفع درجة الغليان وتنخفض درجة التجمد. في الجبال يقل الضغط فتقل درجة الغليان (حوالي 1°م لكل 300 م ارتفاع)، وقدر الضغط يرفع درجة الغليان فيقلل زمن الطهي.","النقاوة: الشوائب تغيّر قوى التجاذب فتتغير درجتا الغليان والانصهار (الجلوكوز يرفع الغليان ويخفض التجمد)، ونتحقق من النقاوة بمقارنة الدرجات بالقيم الثابتة.","#الجزء الثاني: التحولات العكسية والتبخر","الانصهار عكس التجمد، والتبخر عكس التكاثف، والتسامي عكس الترسيب، وكلها تغيرات فيزيائية لا يتغير فيها تركيب الجزيئات.","أمثلة: الندى والضباب والسحب (تكاثف)، الصقيع (ترسيب)، الثلج الجاف واليود الصلب (تسامي).","التبخر عند أي درجة وبجزيئات السطح فقط وبدون فقاقيع، أما الغليان فعند درجة ثابتة ولكل الجزيئات وبفقاقيع.","يزداد معدل التبخر بارتفاع الحرارة وزيادة مساحة السطح وسرعة تيارات الهواء، ويقل بزيادة الرطوبة.","دورة الماء تعتمد على التبخر والتكاثف والتجمد والانصهار، والقهوة سريعة الذوبان تُصنع برش المستخلص في هواء ساخن جاف لزيادة التبخر."],["#الجزء الأول: الأنظمة والطاقة الداخلية","النظام: أي جزء من الكون قيد الدراسة تُلاحظ فيه تغيرات الطاقة والمادة، وله حدود تفصله عن الوسط المحيط الذي يتبادل معه الطاقة أو المادة.","المفتوح يتبادل الطاقة والمادة (وعاء ماء يغلي)، المغلق يتبادل الطاقة فقط (علبة مشروب في الثلج، الترمومتر الطبي)، المعزول لا يتبادل شيئاً (الترمس).","ماء ساخن: في المفتوح تقل الحرارة والكتلة، في المغلق تقل الحرارة وتثبت الكتلة، في المعزول تثبت الحرارة والكتلة.","الطاقة الداخلية = مجموع طاقتي الوضع والحركة لجسيمات النظام. طاقة الوضع أكبر ما يمكن في الصلب وشبه معدومة في الغاز، وطاقة الحركة أقل ما يمكن في الصلب وأكبر ما يمكن في الغاز.","#الجزء الثاني: درجة الحرارة والحرارة النوعية","درجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات (درجة السخونة أو البرودة) وليست كل الطاقة الداخلية. اكتساب الطاقة يرفعها وفقدها يخفضها.","مقدار التغير في الحرارة يتوقف على كتلة المادة (الكتلة الأقل ترتفع أكثر)، ونوعها، وحالتها.","الحرارة النوعية: كمية الحرارة اللازمة لرفع حرارة 1 كجم من المادة 1°م، وتُقاس بوحدة جول/كجم·°م، وهي صفة مميزة لا تتغير بالكتلة وتختلف باختلاف النوع والحالة.","كلما زادت الحرارة النوعية احتاجت المادة حرارة أكبر وارتفعت حرارتها قليلاً وبردت ببطء (الماء الأعلى: 4180). لذلك يُستخدم الزئبق في الترمومتر، والماء في المبرد وفي جسم الإنسان، والنحاس في أواني الطهي."]]:[["#Part 1: Melting, boiling and the heating curve","At normal atmospheric pressure, ice melts at 0°C and water boils at 100°C.","When heated, the temperature of ice rises to the melting point (particles gain kinetic energy), stays constant during melting because the energy weakens the attraction forces, then water heats up to the boiling point and stays constant while boiling.","Heating curve: below the melting point = solid; at it = solid + liquid; between = liquid; at the boiling point = liquid + gas; above it = gas. Melting takes less time than boiling.","Gaining energy increases the kinetic energy of particles so temperature rises; losing energy lowers it.","Atmospheric pressure: when it increases the boiling point rises and the freezing point falls. On mountains the pressure is lower so the boiling point drops (about 1°C per 300 m). A pressure cooker raises the boiling point and shortens cooking time.","Purity: impurities change the attraction forces, so melting and boiling points change (glucose raises the boiling point and lowers the freezing point). Purity is checked by comparing with the fixed values.","#Part 2: Reversible changes and evaporation","Melting is the reverse of freezing, evaporation of condensation, sublimation of deposition. They are physical changes: the molecules do not change.","Examples: dew, fog and clouds (condensation), frost (deposition), dry ice and solid iodine (sublimation).","Evaporation happens at any temperature, only for surface molecules, with no bubbles; boiling happens at a fixed temperature, for all molecules, with bubbles.","The rate of evaporation increases with temperature, surface area and air currents, and decreases with humidity.","The water cycle depends on evaporation, condensation, freezing and melting; instant coffee is made by spraying the extract into hot dry air to speed up evaporation."],["#Part 1: Systems and internal energy","A system is any part of the universe under study where changes in energy and matter are observed; it has a boundary separating it from the surroundings, with which it can exchange energy or matter.","Open: exchanges energy and matter (open pot of boiling water). Closed: exchanges energy only (can of drink in ice, medical thermometer). Isolated: exchanges nothing (thermos flask).","Hot water: in an open system temperature and mass decrease; in a closed system temperature decreases and mass is constant; in an isolated system both are constant.","Internal energy = the sum of potential and kinetic energies of the particles. Potential energy is largest in solids and almost non-existent in gases; kinetic energy is smallest in solids and largest in gases.","#Part 2: Temperature and specific heat","Temperature measures the average kinetic energy of the particles (hotness or coldness), not all the internal energy. Gaining energy raises it, losing energy lowers it.","The change in temperature depends on the mass (a smaller mass rises more), the type and the state of the substance.","Specific heat: the heat needed to raise 1 kg of a substance by 1°C, measured in J/kg·°C. It is a characteristic property that does not depend on mass and varies with type and state.","The higher the specific heat, the more heat is needed, the smaller the rise in temperature, and the slower it cools (water is the highest: 4180). So mercury is used in thermometers, water in radiators and the human body, and copper in cooking utensils."]]))});

const MA6=[
["#القلب والنبض","القلب يعمل مثل المضخة: يرسل الدم إلى جميع أجزاء الجسم عبر الأوعية الدموية ثم يستقبله مرة أخرى.","نبضات القلب هي الحركة المستمرة للقلب أثناء ضخه للدم، ونحس بها كنبض عند الرسغ والرقبة والكاحل.","#الدورة الدموية","الدورة الدموية هي الحركة المستمرة للدم داخل شبكة من الأوعية الدموية المنتشرة في الجسم.","1) القلب يضخ دماً غنياً بالأكسجين والعناصر الغذائية إلى كل أجزاء الجسم.","2) الدم يجمع ثاني أكسيد الكربون والفضلات الناتجة في الجسم ويعود إلى القلب.","3) القلب يضخ الدم المحمّل بثاني أكسيد الكربون إلى الرئتين.","4) الدم يطرد ثاني أكسيد الكربون ويأخذ الأكسجين في الرئتين ثم يعود إلى القلب.","مفتاح الألوان: الأحمر = دم غني بالأكسجين، والأزرق = دم غني بثاني أكسيد الكربون.","الجهاز الدوري هو الجهاز المسؤول عن ضخ الدم وتوزيعه في الجسم، ويشمل القلب والأوعية الدموية.","#نشاط قياس النبض","نضع الإصبع قرب قاعدة الإبهام على الرسغ ونعد النبضات في دقيقة: حوالي 70 نبضة أثناء الجلوس، وحوالي 110 نبضات بعد القفز الخفيف.","الاستنتاج: القلب ينبض أسرع أثناء الجهد (الحركة أو الرياضة) لأنه يضخ الدم بسرعة أكبر ليمد الجسم بأكسجين وعناصر غذائية أكثر لإنتاج الطاقة."],
["بعد استفادة الجسم من الأكسجين والعناصر الغذائية تتكون فضلات (مواد غير ضرورية وضارة) لازم يتخلص منها الجسم بعملية الإخراج.","الدم ينقل الفضلات الضارة إلى أعضاء تتخلص منها خارج الجسم مثل الكليتين.","الكليتان تزيلان الفضلات والماء الزائد من الدم على هيئة بول.","البول سائل يحتوي على الفضلات والماء الزائد، وينتج عندما ترشّح الكليتان الدم.","#تكوّن البول وخروجه","1) الدم المحمّل بالفضلات يمر في الكليتين.","2) الكليتان ترشحان الدم وتزيلان الفضلات والماء الزائد.","3) البول ينتقل من الكليتين عبر الحالبين إلى المثانة البولية.","4) البول يُخزَّن مؤقتاً في المثانة البولية حتى يخرج من الجسم.","الحالبان أنبوبان دقيقان ينقلان البول من الكليتين إلى المثانة البولية.","الجهاز البولي هو الجهاز المسؤول عن ترشيح الدم بإزالة الفضلات والماء الزائد وتكوين البول والتخلص منه."],
["تترتب الأعضاء بالقرب من بعضها داخل تجاويف الجسم لأنها تعمل معاً لأداء وظائفها.","#الصدر","الرئتان اليمنى واليسرى والقلب بينهما، وكلها محمية بالأضلاع.","#البطن","المعدة: تقع في أعلى البطن (أسفل القلب والرئتين).","الأمعاء الدقيقة: عضو طويل يقع أسفل المعدة.","الأمعاء الغليظة: تحيط بالأمعاء الدقيقة.","#الظهر","الكليتان: تقعان في أسفل الظهر، كلية على كل جانب من العمود الفقري.","#ترابط الأعضاء","ترتبط أعضاء الجسم ببعضها بالأوعية الدموية: الدم ينقل الأكسجين والعناصر الغذائية إلى الأعضاء، وينقل الفضلات منها إلى الأعضاء التي تساعد على التخلص منها."]];

["#Heart and pulse","The heart works like a pump, sending blood to all parts of the body through the blood vessels and then receiving it again.","Heartbeat is the continuous movement of the heart as it pumps blood. It can be felt as a pulse at the wrist, the neck and the ankle.","#Blood circulation","Blood circulation is the continuous movement of blood through a network of blood vessels spread throughout the body.","1) The heart pumps blood rich in oxygen and nutrients to all parts of the body.","2) The blood collects carbon dioxide and waste produced in the body and returns to the heart.","3) The heart pumps blood that carries carbon dioxide to the lungs.","4) The blood lets out carbon dioxide, takes in oxygen in the lungs and returns to the heart.","Key: red = blood rich in oxygen, blue = blood rich in carbon dioxide.","The circulatory system is responsible for pumping and circulating the blood throughout the body. It includes the heart and the blood vessels.","#Activity: measuring the pulse","Put your finger near the base of your thumb on your wrist and count the beats in 1 minute: about 70 beats per minute while sitting and about 110 after jumping lightly.","Conclusion: the heart beats faster during effort, such as movement or exercise, because it pumps blood faster to give the body more oxygen and nutrients to produce energy."],
["After the body benefits from oxygen and nutrients, unnecessary and harmful substances called waste products are produced and must be eliminated through excretion.","The blood carries harmful waste products to certain organs that eliminate them out of the body, such as the kidneys.","The two kidneys remove waste products and extra water from the blood in the form of urine.","Urine is a liquid containing waste products and extra water, produced when the kidneys filter the blood.","#Urine formation and discharging","1) The blood that carries waste products flows through the kidneys.","2) The kidneys filter the blood, removing waste products and extra water.","3) Urine passes from the kidneys through the two ureters to the urinary bladder.","4) Urine is temporarily stored in the urinary bladder until it is discharged from the body.","The ureters are two fine tubes that carry urine from the kidneys to the urinary bladder.","The urinary system is the system responsible for filtering the blood by removing waste products and excess water, forming urine and getting rid of it."],
["The organs are arranged close together inside the body cavities because they work together to perform their functions.","#Chest","The right and left lungs, and the heart between them, are all protected by the ribs.","#Abdomen","Stomach: located in the upper abdomen (below the heart and lungs).","Small intestine: a long organ located below the stomach.","Large intestine: it surrounds the small intestine.","#Back","The two kidneys: located on the lower back, one kidney on each side of the backbone.","#Connection between organs","The body organs are connected to one another by blood vessels: blood carries oxygen and nutrients to the organs, and carries waste products from them to the organs that help eliminate the waste."]];
