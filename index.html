const OCT_REVIEW=[{"id":"octA1","t":"mc","q":"The state of matter characterized by a definite shape and a definite volume is:","o":["Solid","Liquid","Gas","Plasma"],"a":0,"e":"Correct answer: Solid."},{"id":"octA2","t":"mc","q":"Fluids are substances that have the ability to flow; they include:","o":["Solids only","Liquids and gases","Gases only","Solids and liquids"],"a":1,"e":"Correct answer: Liquids and gases."},{"id":"octA3","t":"mc","q":"Which state of matter is highly compressible due to large intermolecular spaces?","o":["Solid","Liquid","Gas","Ice"],"a":2,"e":"Correct answer: Gas."},{"id":"octA4","t":"mc","q":"The natural spreading and mixing of particles from higher concentration to lower concentration is called:","o":["Sublimation","Diffusion","Ionization","Condensation"],"a":1,"e":"Correct answer: Diffusion."},{"id":"octA5","t":"mc","q":"Diffusion occurs fastest in:","o":["Solids","Liquids","Gases","Highly viscous liquids"],"a":2,"e":"Correct answer: Gases."},{"id":"octA6","t":"mc","q":"A simplified physical or mental representation used to explain tiny or complex systems is a:","o":["Scientific theory","Scientific model","Natural law","Physical property"],"a":1,"e":"Correct answer: Scientific model."},{"id":"octA7","t":"mc","q":"The state of matter consisting of an ionized gas with free electrons and positive ions is:","o":["Solid","Liquid","Vapor","Plasma"],"a":3,"e":"Correct answer: Plasma."},{"id":"octA8","t":"mc","q":"Plasma is naturally formed at very high temperatures in:","o":["The ocean floor","Stars and lightning","The Earth's crust","Commercial refrigerators"],"a":1,"e":"Correct answer: Stars and lightning."},{"id":"octA9","t":"mc","q":"Advanced air purification technology uses plasma because it:","o":["Freezes dust particles","Kills bacteria and neutralizes odors","Absorbs carbon dioxide","Increases humidity"],"a":1,"e":"Correct answer: Kills bacteria and neutralizes odors."},{"id":"octA10","t":"mc","q":"Intermolecular forces of attraction are strongest in:","o":["Gases","Liquids","Solids","Plasma"],"a":2,"e":"Correct answer: Solids."},{"id":"octA11","t":"mc","q":"Intermolecular spaces are almost negligible (extremely tiny) in:","o":["Oxygen gas","Liquid water","Iron metal","Water vapor"],"a":2,"e":"Correct answer: Iron metal."},{"id":"octA12","t":"mc","q":"Particles of a solid exhibit motion described as:","o":["Completely free and random","Vibrational in fixed positions","Translational and sliding","High-speed orbital"],"a":1,"e":"Correct answer: Vibrational in fixed positions."},{"id":"octA13","t":"mc","q":"When a solid absorbs thermal energy, its kinetic energy increases and it turns into a liquid at its:","o":["Boiling point","Melting point","Freezing point","Condensation point"],"a":1,"e":"Correct answer: Melting point."},{"id":"octA14","t":"mc","q":"The constant temperature at which a liquid changes into a gas throughout the liquid is the:","o":["Melting point","Boiling point","Dew point","Sublimation point"],"a":1,"e":"Correct answer: Boiling point."},{"id":"octA15","t":"mc","q":"Direct transformation of a solid into a gas without passing through the liquid state is:","o":["Evaporation","Sublimation","Condensation","Fusion"],"a":1,"e":"Correct answer: Sublimation."},{"id":"octA16","t":"mc","q":"An example of a substance that undergoes sublimation at room conditions is:","o":["Sodium chloride","Dry ice (solid CO2)","Liquid mercury","Pure copper"],"a":1,"e":"Correct answer: Dry ice (solid CO2)."},{"id":"octA17","t":"mc","q":"Evaporation takes place at:","o":["The boiling point only","Any temperature below boiling point","The freezing point only","100°C exclusively"],"a":1,"e":"Correct answer: Any temperature below boiling point."},{"id":"octA18","t":"mc","q":"Evaporation occurs strictly at the:","o":["Bottom of the container","Surface of the liquid","Middle of the liquid","Walls of the vessel"],"a":1,"e":"Correct answer: Surface of the liquid."},{"id":"octA19","t":"mc","q":"Which of the following factors INCREASES the rate of evaporation?","o":["Decreasing surface area","Increasing air humidity","Increasing temperature","Decreasing wind speed"],"a":2,"e":"Correct answer: Increasing temperature."},{"id":"octA20","t":"mc","q":"On a very humid day, the rate of evaporation of sweat from the human body:","o":["Increases significantly","Decreases","Remains unaffected","Accelerates rapid cooling"],"a":1,"e":"Correct answer: Decreases."},{"id":"octA21","t":"mc","q":"High wind speed accelerates evaporation because it:","o":["Lowers the liquid temperature","Removes vapor molecules from above the surface","Decreases surface area","Increases intermolecular forces"],"a":1,"e":"Correct answer: Removes vapor molecules from above the surface."},{"id":"octA22","t":"mc","q":"Boiling differs from evaporation in that boiling:","o":["Occurs at the surface only","Occurs throughout the whole liquid","Occurs at any temperature","Does not form bubbles"],"a":1,"e":"Correct answer: Occurs throughout the whole liquid."},{"id":"octA23","t":"mc","q":"As atmospheric pressure decreases (e.g., on top of a high mountain), the boiling point of water:","o":["Increases above 100°C","Decreases below 100°C","Remains exactly 100°C","Drops to 0°C"],"a":1,"e":"Correct answer: Decreases below 100°C."},{"id":"octA24","t":"mc","q":"A pressure cooker cooks food faster because high pressure inside:","o":["Lowers the boiling point","Raises the boiling point of water","Prevents heat transfer","Freezes the water"],"a":1,"e":"Correct answer: Raises the boiling point of water."},{"id":"octA25","t":"mc","q":"Adding salt (a soluble impurity) to pure water causes its boiling point to:","o":["Decrease","Increase above 100°C","Remain unchanged","Drop to 0°C"],"a":1,"e":"Correct answer: Increase above 100°C."},{"id":"octA26","t":"mc","q":"Adding a non-volatile impurity (like salt) to water causes its freezing point to:","o":["Increase above 0°C","Decrease below 0°C","Stay exactly 0°C","Double"],"a":1,"e":"Correct answer: Decrease below 0°C."},{"id":"octA27","t":"mc","q":"Salt is spread on icy roads in winter because it:","o":["Raises the melting point of ice","Lowers the freezing point of water to prevent ice formation","Absorbs all sunlight","Increases friction without melting ice"],"a":1,"e":"Correct answer: Lowers the freezing point of water to prevent ice formation."},{"id":"octA28","t":"mc","q":"A system that allows exchange of both energy and matter with its surroundings is a/an:","o":["Closed system","Isolated system","Open system","Thermal insulator"],"a":2,"e":"Correct answer: Open system."},{"id":"octA29","t":"mc","q":"A sealed glass bottle of water that permits heat transfer but no mass exchange is a/an:","o":["Open system","Closed system","Isolated system","Vacuum system"],"a":1,"e":"Correct answer: Closed system."},{"id":"octA30","t":"mc","q":"A thermos flask (vacuum flask) represents an ideal approximation of a/an:","o":["Open system","Closed system","Isolated system","Permeable system"],"a":2,"e":"Correct answer: Isolated system."},{"id":"octA31","t":"mc","q":"Internal energy of a substance is defined as the total sum of its particles':","o":["Kinetic energy only","Potential energy only","Kinetic energy and potential energy","Mechanical energy and chemical energy"],"a":2,"e":"Correct answer: Kinetic energy and potential energy."},{"id":"octA32","t":"mc","q":"The temperature of a substance is a direct measure of the:","o":["Total mass of its particles","Average kinetic energy of its particles","Total volume of the container","Potential energy between molecules"],"a":1,"e":"Correct answer: Average kinetic energy of its particles."},{"id":"octA33","t":"mc","q":"When a substance absorbs thermal energy without changing its state, its particles move:","o":["Slower and kinetic energy decreases","Faster and average kinetic energy increases","At constant speed with zero kinetic energy","In a straight line backwards"],"a":1,"e":"Correct answer: Faster and average kinetic energy increases."},{"id":"octA34","t":"mc","q":"The amount of heat required to raise the temperature of 1 kg of a substance by 1°C is:","o":["Thermal capacity","Specific heat capacity","Latent heat of fusion","Internal work"],"a":1,"e":"Correct answer: Specific heat capacity."},{"id":"octA35","t":"mc","q":"Which substance has the highest specific heat capacity known in nature?","o":["Copper metal","Liquid water","Sand","Iron metal"],"a":1,"e":"Correct answer: Liquid water."},{"id":"octA36","t":"mc","q":"Because water has a very high specific heat capacity, it:","o":["Heats up and cools down very quickly","Takes a long time to heat up and a long time to cool down","Never absorbs heat","Boils instantly at 50°C"],"a":1,"e":"Correct answer: Takes a long time to heat up and a long time to cool down."},{"id":"octA37","t":"mc","q":"Equal masses of sand and water exposed to the same heat source for 5 minutes will show:","o":["Sand heating up much faster than water","Water heating up much faster than sand","Both reaching the exact same temperature","Sand remaining cold while water boils"],"a":0,"e":"Correct answer: Sand heating up much faster than water."},{"id":"octA38","t":"mc","q":"If equal amounts of thermal energy are supplied to 1 kg and 2 kg of liquid water:","o":["The 1 kg mass will experience a greater temperature rise","The 2 kg mass will experience a greater temperature rise","Both will experience the same temperature rise","Neither will change temperature"],"a":0,"e":"Correct answer: The 1 kg mass will experience a greater temperature rise."},{"id":"octA39","t":"mc","q":"Solid ice has a specific heat capacity that is:","o":["Equal to liquid water","Higher than liquid water","Lower than liquid water","Infinite"],"a":2,"e":"Correct answer: Lower than liquid water."},{"id":"octA40","t":"mc","q":"Thermal expansion occurs because heating a substance causes its particles to:","o":["Increase in mass","Gain kinetic energy, vibrate more vigorously, and push apart","Shrink in size","Multiply in number"],"a":1,"e":"Correct answer: Gain kinetic energy, vibrate more vigorously, and push apart."},{"id":"octA41","t":"mc","q":"The temperature at which all particle motion theoretically ceases is called Absolute Zero, which corresponds to:","o":["0°C","-273.15°C (0 Kelvin)","100°C","-100°C"],"a":1,"e":"Correct answer: -273.15°C (0 Kelvin)."},{"id":"octA42","t":"mc","q":"Which phase change releases thermal energy to the surroundings?","o":["Melting","Evaporation","Sublimation","Freezing"],"a":3,"e":"Correct answer: Freezing."},{"id":"octA43","t":"mc","q":"Condensation is the physical process of changing a:","o":["Solid into a liquid","Gas into a liquid by cooling","Liquid into a solid","Solid directly into a gas"],"a":1,"e":"Correct answer: Gas into a liquid by cooling."},{"id":"octA44","t":"mc","q":"During a phase change (like boiling or melting), the temperature of a pure substance:","o":["Increases continuously","Decreases steadily","Remains constant","Fluctuates rapidly"],"a":2,"e":"Correct answer: Remains constant."},{"id":"octA45","t":"mc","q":"The energy absorbed during melting that overcomes intermolecular bonds without raising temperature is called:","o":["Specific heat capacity","Latent heat of fusion","Latent heat of vaporization","Kinetic energy"],"a":1,"e":"Correct answer: Latent heat of fusion."},{"id":"octA46","t":"mc","q":"Why does spreading out a wet towel speed up its drying?","o":["It increases humidity","It increases the exposed surface area for evaporation","It lowers air temperature","It blocks wind flow"],"a":1,"e":"Correct answer: It increases the exposed surface area for evaporation."},{"id":"octA47","t":"mc","q":"Water droplets forming on the outer surface of a cold glass cylinder demonstrate:","o":["Evaporation","Sublimation","Condensation","Melting"],"a":2,"e":"Correct answer: Condensation."},{"id":"octA48","t":"mc","q":"A gas can be compressed into a smaller volume because:","o":["Its particles are fixed","Intermolecular spaces between its particles are very large","Intermolecular forces are extremely strong","Its particles do not move"],"a":1,"e":"Correct answer: Intermolecular spaces between its particles are very large."},{"id":"octA49","t":"mc","q":"The kinetic theory of matter states that all matter is composed of tiny particles that are:","o":["Completely stationary","In continuous motion","Embedded in solid matrix","Indestructible spheres without spaces"],"a":1,"e":"Correct answer: In continuous motion."},{"id":"octA50","t":"mc","q":"Neon sign lights glow with vibrant colors because they contain:","o":["Compressed oxygen gas","Heated liquid mercury","Glowing plasma state","Solid fluorescent powder"],"a":2,"e":"Correct answer: Glowing plasma state."},{"id":"octB1","t":"tf","q":"Liquids have a fixed shape and take the volume of the container holding them.","a":false,"e":"1. False (Liquids have a fixed volume but take the SHAPE of the container)."},{"id":"octB2","t":"tf","q":"Diffusion occurs faster in warm liquids than in cold liquids.","a":true,"e":"2. True."},{"id":"octB3","t":"tf","q":"Gases and liquids are collectively known as fluids because they can flow.","a":true,"e":"3. True."},{"id":"octB4","t":"tf","q":"Plasma is the most abundant state of matter in the universe.","a":true,"e":"4. True (Plasma makes up over 99% of visible matter in the universe like stars)."},{"id":"octB5","t":"tf","q":"Intermolecular forces of attraction in gases are stronger than in solids.","a":false,"e":"5. False (Intermolecular forces in gases are extremely WEAK or negligible)."},{"id":"octB6","t":"tf","q":"Particles in a solid object have translational motion moving freely from place to place.","a":false,"e":"6. False (Particles in a solid have VIBRATIONAL motion in fixed positions)."},{"id":"octB7","t":"tf","q":"Melting is an endothermic process that absorbs thermal energy.","a":true,"e":"7. True."},{"id":"octB8","t":"tf","q":"Sublimation is the transformation of a liquid into a gas below its boiling point.","a":false,"e":"8. False (Sublimation is the transformation of a SOLID into a gas)."},{"id":"octB9","t":"tf","q":"Dry ice is solid carbon dioxide that sublimates directly into gas at room temperature.","a":true,"e":"9. True."},{"id":"octB10","t":"tf","q":"Evaporation occurs throughout the entire volume of a liquid and forms bubbles.","a":false,"e":"10. False (Evaporation occurs ONLY at the SURFACE without forming bubbles; boiling forms bubbles)."},{"id":"octB11","t":"tf","q":"Increasing the exposed surface area of a liquid increases its rate of evaporation.","a":true,"e":"11. True."},{"id":"octB12","t":"tf","q":"On high mountain peaks, water boils at a temperature higher than 100°C.","a":false,"e":"12. False (On high mountains, pressure is lower, so water boils at a LOWER temperature than 100°C)."},{"id":"octB13","t":"tf","q":"Pressure cookers cook food faster by increasing atmospheric pressure, which raises boiling point.","a":true,"e":"13. True."},{"id":"octB14","t":"tf","q":"Adding table salt to pure water lowers its boiling point below 100°C.","a":false,"e":"14. False (Adding salt RAISES the boiling point above 100°C)."},{"id":"octB15","t":"tf","q":"Adding salt to ice lowers the freezing point of water, preventing ice formation on roads.","a":true,"e":"15. True."},{"id":"octB16","t":"tf","q":"An open system allows the exchange of thermal energy only with its surroundings.","a":false,"e":"16. False (An open system permits exchange of BOTH energy AND matter)."},{"id":"octB17","t":"tf","q":"A thermos flask is an example of an isolated thermodynamic system.","a":true,"e":"17. True."},{"id":"octB18","t":"tf","q":"Internal energy consists solely of the kinetic energy of microscopic particles.","a":false,"e":"18. False (Internal energy is the sum of BOTH kinetic energy and potential energy)."},{"id":"octB19","t":"tf","q":"Temperature is a measure of the average kinetic energy of the particles in a body.","a":true,"e":"19. True."},{"id":"octB20","t":"tf","q":"Water has a lower specific heat capacity than copper metal.","a":false,"e":"20. False (Water has a much HIGHER specific heat capacity than copper)."},{"id":"octB21","t":"tf","q":"Substances with low specific heat capacity heat up and cool down quickly.","a":true,"e":"21. True."},{"id":"octB22","t":"tf","q":"Equal masses of different materials require different amounts of heat to raise their temperature by 1°C.","a":true,"e":"22. True."},{"id":"octB23","t":"tf","q":"Solid ice requires more heat to raise its temperature by 1°C than an equal mass of liquid water.","a":false,"e":"23. False (Solid ice has a LOWER specific heat capacity (~2090 J/kg°C) than liquid water (~4184 J/kg°C))."},{"id":"octB24","t":"tf","q":"During boiling, the temperature of pure water continues to rise above 100°C.","a":false,"e":"24. False (During boiling, temperature remains CONSTANT at 100°C until all liquid turns to vapor)."},{"id":"octB25","t":"tf","q":"Freezing and condensation are exothermic thermal phase changes.","a":true,"e":"25. True."},{"id":"octC1","t":"mc","q":"Which scientific term matches this description? The state of matter having a definite volume but taking the shape of its container.","o":["Ionization","Liquid state","Intermolecular spaces","Latent heat of fusion / vaporization"],"a":1,"e":"Correct answer: Liquid state."},{"id":"octC2","t":"mc","q":"Which scientific term matches this description? Substances that can flow and have no fixed shape (liquids and gases).","o":["Intermolecular attraction forces","Specific heat capacity","Humidity","Fluids"],"a":3,"e":"Correct answer: Fluids."},{"id":"octC3","t":"mc","q":"Which scientific term matches this description? The natural movement of particles from an area of higher concentration to lower concentration.","o":["Diffusion","Intermolecular spaces","Scientific model","Plasma state"],"a":0,"e":"Correct answer: Diffusion."},{"id":"octC4","t":"mc","q":"Which scientific term matches this description? A simplified physical or mental representation of an object, system, or concept.","o":["Scientific model","Humidity","Open system","Melting point"],"a":0,"e":"Correct answer: Scientific model."},{"id":"octC5","t":"mc","q":"Which scientific term matches this description? The fourth state of matter consisting of a gas of ions and free electrons.","o":["Freezing","Plasma state","Diffusion","Internal energy"],"a":1,"e":"Correct answer: Plasma state."},{"id":"octC6","t":"mc","q":"Which scientific term matches this description? The spaces present between the molecules or particles of a substance.","o":["Melting point","Specific heat capacity","Boiling point","Intermolecular spaces"],"a":3,"e":"Correct answer: Intermolecular spaces."},{"id":"octC7","t":"mc","q":"Which scientific term matches this description? The forces that hold neighboring particles together in a substance.","o":["Intermolecular attraction forces","Sublimation","Diffusion","Melting point"],"a":0,"e":"Correct answer: Intermolecular attraction forces."},{"id":"octC8","t":"mc","q":"Which scientific term matches this description? The temperature at which a solid substance changes into a liquid state.","o":["Condensation","Scientific model","Intermolecular spaces","Melting point"],"a":3,"e":"Correct answer: Melting point."},{"id":"octC9","t":"mc","q":"Which scientific term matches this description? The temperature at which a liquid rapidly turns into vapor throughout its volume.","o":["Fluids","Melting point","Specific heat capacity","Boiling point"],"a":3,"e":"Correct answer: Boiling point."},{"id":"octC10","t":"mc","q":"Which scientific term matches this description? The direct phase change from a solid to a gas without passing through the liquid state.","o":["Sublimation","Boiling point","Absolute zero (0 K)","Plasma state"],"a":0,"e":"Correct answer: Sublimation."},{"id":"octC11","t":"mc","q":"Which scientific term matches this description? The slow phase change of a liquid into a gas taking place only at the liquid surface at any temperature.","o":["Plasma state","Freezing","Evaporation","Boiling point"],"a":2,"e":"Correct answer: Evaporation."},{"id":"octC12","t":"mc","q":"Which scientific term matches this description? The mass of water vapor present in a given volume of air.","o":["Humidity","Scientific model","Absolute zero (0 K)","Impurities"],"a":0,"e":"Correct answer: Humidity."},{"id":"octC13","t":"mc","q":"Which scientific term matches this description? A sealed cooking vessel that speeds cooking by trapping steam to elevate boiling temperature.","o":["Humidity","Scientific model","Melting point","Pressure cooker"],"a":3,"e":"Correct answer: Pressure cooker."},{"id":"octC14","t":"mc","q":"Which scientific term matches this description? Foreign substances mixed into a pure material that alter its physical properties like boiling and freezing points.","o":["Intermolecular spaces","Diffusion","Open system","Impurities"],"a":3,"e":"Correct answer: Impurities."},{"id":"octC15","t":"mc","q":"Which scientific term matches this description? A system that exchanges both energy and matter with its surrounding environment.","o":["Evaporation","Open system","Freezing","Latent heat of fusion / vaporization"],"a":1,"e":"Correct answer: Open system."},{"id":"octC16","t":"mc","q":"Which scientific term matches this description? A system that exchanges energy only, but not matter, with its surroundings.","o":["Closed system","Latent heat of fusion / vaporization","Intermolecular spaces","Scientific model"],"a":0,"e":"Correct answer: Closed system."},{"id":"octC17","t":"mc","q":"Which scientific term matches this description? A system that does not exchange either energy or matter with its surroundings.","o":["Diffusion","Liquid state","Specific heat capacity","Isolated system"],"a":3,"e":"Correct answer: Isolated system."},{"id":"octC18","t":"mc","q":"Which scientific term matches this description? The total sum of potential energy and kinetic energy stored within the particles of a substance.","o":["Boiling point","Internal energy","Diffusion","Freezing"],"a":1,"e":"Correct answer: Internal energy."},{"id":"octC19","t":"mc","q":"Which scientific term matches this description? A physical quantity that indicates the average kinetic energy of particles in a substance.","o":["Liquid state","Intermolecular attraction forces","Melting point","Temperature"],"a":3,"e":"Correct answer: Temperature."},{"id":"octC20","t":"mc","q":"Which scientific term matches this description? The amount of heat required to raise the temperature of 1 kg of a substance by 1°C.","o":["Ionization","Specific heat capacity","Isolated system","Latent heat of fusion / vaporization"],"a":1,"e":"Correct answer: Specific heat capacity."},{"id":"octC21","t":"mc","q":"Which scientific term matches this description? The phase change of a gas into a liquid upon losing thermal energy.","o":["Impurities","Boiling point","Condensation","Scientific model"],"a":2,"e":"Correct answer: Condensation."},{"id":"octC22","t":"mc","q":"Which scientific term matches this description? The phase change of a liquid into a solid upon cooling.","o":["Scientific model","Melting point","Freezing","Intermolecular attraction forces"],"a":2,"e":"Correct answer: Freezing."},{"id":"octC23","t":"mc","q":"Which scientific term matches this description? Thermal energy absorbed during a phase change that alters state without changing temperature.","o":["Condensation","Latent heat of fusion / vaporization","Plasma state","Diffusion"],"a":1,"e":"Correct answer: Latent heat of fusion / vaporization."},{"id":"octC24","t":"mc","q":"Which scientific term matches this description? The theoretical temperature at which all molecular kinetic motion comes to a complete halt (0 K).","o":["Condensation","Absolute zero (0 K)","Intermolecular spaces","Intermolecular attraction forces"],"a":1,"e":"Correct answer: Absolute zero (0 K)."},{"id":"octC25","t":"mc","q":"Which scientific term matches this description? The process of removing electrons from neutral gas atoms to form plasma.","o":["Sublimation","Humidity","Ionization","Intermolecular attraction forces"],"a":2,"e":"Correct answer: Ionization."},{"id":"octD1","t":"mc","q":"Why? Solids maintain a fixed shape and volume under normal conditions.","o":["Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions.","Because warm water vapor in surrounding air contacts the cold glass surface, loses thermal energy, and condenses into liquid water droplets.","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration."],"a":0,"e":"Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions."},{"id":"octD2","t":"mc","q":"Why? Gases are easily compressible while solids and liquids are virtually incompressible.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage.","Because all supplied heat energy (latent heat of fusion) is used exclusively to break intermolecular attraction bonds between ice molecules rather than increasing kinetic energy.","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles."],"a":3,"e":"Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles."},{"id":"octD3","t":"mc","q":"Why? Drop of potassium permanganate or ink spreads throughout an entire beaker of water without stirring.","o":["Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle).","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration."],"a":3,"e":"Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration."},{"id":"octD4","t":"mc","q":"Why? Plasma conducts electricity whereas ordinary neutral gases do not.","o":["Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because plasma contains free mobile electric charges (free electrons and positive ions), while neutral gas atoms have bound electrons.","Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle).","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions."],"a":1,"e":"Because plasma contains free mobile electric charges (free electrons and positive ions), while neutral gas atoms have bound electrons."},{"id":"octD5","t":"mc","q":"Why? Water in a cup evaporates faster on a windy day than on a calm day.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions."],"a":0,"e":"Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation."},{"id":"octD6","t":"mc","q":"Why? Wet clothes dry much faster when spread out on a line than when left folded in a pile.","o":["Because spreading out clothes increases the exposed surface area of water to air, which directly speeds up the rate of evaporation.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration.","Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle).","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase."],"a":0,"e":"Because spreading out clothes increases the exposed surface area of water to air, which directly speeds up the rate of evaporation."},{"id":"octD7","t":"mc","q":"Why? A pressure cooker cooks tough food and meat in much less time than a conventional pot.","o":["Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles.","Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation.","Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation."],"a":0,"e":"Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat."},{"id":"octD8","t":"mc","q":"Why? Water boils at a temperature lower than 100°C on top of Mount Everest.","o":["Because warm water vapor in surrounding air contacts the cold glass surface, loses thermal energy, and condenses into liquid water droplets.","Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage.","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions."],"a":2,"e":"Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature."},{"id":"octD9","t":"mc","q":"Why? Salt is spread over icy road surfaces in cold countries during winter storms.","o":["Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system).","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature."],"a":0,"e":"Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures."},{"id":"octD10","t":"mc","q":"Why? Water droplets form on the outside of a cold soda bottle taken out of the refrigerator.","o":["Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase.","Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage.","Because warm water vapor in surrounding air contacts the cold glass surface, loses thermal energy, and condenses into liquid water droplets."],"a":3,"e":"Because warm water vapor in surrounding air contacts the cold glass surface, loses thermal energy, and condenses into liquid water droplets."},{"id":"octD11","t":"mc","q":"Why? Adding table salt to pure water causes its boiling point to rise above 100°C.","o":["Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration.","Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature).","Because non-volatile salt particles bind to water molecules, making it harder for water molecules to break free into vapor, requiring higher thermal energy (boiling point > 100°C)."],"a":3,"e":"Because non-volatile salt particles bind to water molecules, making it harder for water molecules to break free into vapor, requiring higher thermal energy (boiling point > 100°C)."},{"id":"octD12","t":"mc","q":"Why? The thermos flask keeps hot soup warm for many hours.","o":["Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system).","Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because sweat absorbs body heat and uses it as latent heat to evaporate off skin, producing a cooling effect."],"a":1,"e":"Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system)."},{"id":"octD13","t":"mc","q":"Why? Sand on a beach becomes extremely hot on a sunny noon, while ocean water stays comfortably cool.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature).","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system).","Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries."],"a":1,"e":"Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature)."},{"id":"octD14","t":"mc","q":"Why? Farmers in cold regions spray water over fruit orchards when freezing temperatures are expected.","o":["Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions.","Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage.","Because heat supplies kinetic energy to metal atoms, causing them to vibrate more vigorously and push slightly farther apart (thermal expansion)."],"a":2,"e":"Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage."},{"id":"octD15","t":"mc","q":"Why? Heating a solid metal rod causes it to expand slightly in length.","o":["Because heat supplies kinetic energy to metal atoms, causing them to vibrate more vigorously and push slightly farther apart (thermal expansion).","Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature).","Because sweat absorbs body heat and uses it as latent heat to evaporate off skin, producing a cooling effect.","Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle)."],"a":0,"e":"Because heat supplies kinetic energy to metal atoms, causing them to vibrate more vigorously and push slightly farther apart (thermal expansion)."},{"id":"octD16","t":"mc","q":"Why? Temperature remains constant during the melting process of ice even though heat is continuously added.","o":["Because all supplied heat energy (latent heat of fusion) is used exclusively to break intermolecular attraction bonds between ice molecules rather than increasing kinetic energy.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration.","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase.","Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation."],"a":0,"e":"Because all supplied heat energy (latent heat of fusion) is used exclusively to break intermolecular attraction bonds between ice molecules rather than increasing kinetic energy."},{"id":"octD17","t":"mc","q":"Why? Plasma is utilized in modern advanced air purification and sterilization systems.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because plasma contains energetic ions and UV light that disrupt bacterial cell walls and breakdown organic odor molecules effectively.","Because heat supplies kinetic energy to metal atoms, causing them to vibrate more vigorously and push slightly farther apart (thermal expansion).","Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes."],"a":1,"e":"Because plasma contains energetic ions and UV light that disrupt bacterial cell walls and breakdown organic odor molecules effectively."},{"id":"octD18","t":"mc","q":"Why? Small masses of a substance heat up faster than large masses when supplied with equal heat.","o":["Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation.","Because thermal energy is distributed among fewer particles in smaller masses, resulting in a higher average kinetic energy increase per particle.","Because non-volatile salt particles bind to water molecules, making it harder for water molecules to break free into vapor, requiring higher thermal energy (boiling point > 100°C).","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system)."],"a":1,"e":"Because thermal energy is distributed among fewer particles in smaller masses, resulting in a higher average kinetic energy increase per particle."},{"id":"octD19","t":"mc","q":"Why? Sweating cools down the human body on hot summer days.","o":["Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes.","Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation.","Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because sweat absorbs body heat and uses it as latent heat to evaporate off skin, producing a cooling effect."],"a":3,"e":"Because sweat absorbs body heat and uses it as latent heat to evaporate off skin, producing a cooling effect."},{"id":"octD20","t":"mc","q":"Why? Liquid water takes the shape of whatever container it is poured into.","o":["Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because liquid molecules have weak attraction forces and can slide over one another easily, allowing the fluid to adapt to container geometry.","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system).","Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature)."],"a":1,"e":"Because liquid molecules have weak attraction forces and can slide over one another easily, allowing the fluid to adapt to container geometry."},{"id":"octD21","t":"mc","q":"Why? Dry ice vanishes completely over time without leaving behind any wet liquid stain.","o":["Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions.","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase."],"a":3,"e":"Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase."},{"id":"octD22","t":"mc","q":"Why? A cup of hot tea cools down faster when poured into a broad saucer than in a narrow cup.","o":["Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries.","Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation.","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature."],"a":2,"e":"Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation."},{"id":"octD23","t":"mc","q":"Why? A cup of coffee left in an open room acts as an open thermodynamic system.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries.","Because plasma contains free mobile electric charges (free electrons and positive ions), while neutral gas atoms have bound electrons."],"a":2,"e":"Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries."},{"id":"octD24","t":"mc","q":"Why? Temperature is considered a measure of average kinetic energy rather than total kinetic energy.","o":["Because plasma contains energetic ions and UV light that disrupt bacterial cell walls and breakdown organic odor molecules effectively.","Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle).","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles.","Because all supplied heat energy (latent heat of fusion) is used exclusively to break intermolecular attraction bonds between ice molecules rather than increasing kinetic energy."],"a":1,"e":"Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle)."},{"id":"octD25","t":"mc","q":"Why? Water is widely used as an effective coolant in car radiators and industrial engines.","o":["Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes.","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase.","Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries.","Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation."],"a":0,"e":"Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes."},{"id":"octE1","t":"mc","q":"What happens when/if: A solid substance absorbs sufficient thermal energy to reach its melting point.","o":["The boiling point of the liquid decreases below its standard sea-level boiling point.","Dry ice sublimates directly into gaseous carbon dioxide fog without melting into liquid.","Intermolecular bonds weaken, particles gain kinetic energy to slide past each other, and solid melts into a liquid.","Particle motion completely stops, and kinetic energy reaches absolute zero."],"a":2,"e":"Intermolecular bonds weaken, particles gain kinetic energy to slide past each other, and solid melts into a liquid."},{"id":"octE2","t":"mc","q":"What happens when/if: You try to compress a closed syringe filled with water versus one filled with air.","o":["The air syringe compresses easily due to large gas spaces, while the water syringe resists compression because liquid molecules are closely packed.","Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system.","The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster.","Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time."],"a":0,"e":"The air syringe compresses easily due to large gas spaces, while the water syringe resists compression because liquid molecules are closely packed."},{"id":"octE3","t":"mc","q":"What happens when/if: A drop of red dye is added to a beaker containing hot water versus cold water.","o":["Dry ice sublimates directly into gaseous carbon dioxide fog without melting into liquid.","Neutral gas atoms become ionized (lose electrons), transforming into the plasma state.","Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system.","Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed."],"a":3,"e":"Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed."},{"id":"octE4","t":"mc","q":"What happens when/if: A neutral gas is subjected to extremely high temperatures or powerful electrical discharges.","o":["Neutral gas atoms become ionized (lose electrons), transforming into the plasma state.","Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time.","Sweat cannot evaporate into saturated air, preventing body cooling and causing overheating.","Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system."],"a":0,"e":"Neutral gas atoms become ionized (lose electrons), transforming into the plasma state."},{"id":"octE5","t":"mc","q":"What happens when/if: The exposed surface area of a liquid in an open container is increased.","o":["The metal ball expands in volume due to increased particle vibrations (thermal expansion).","The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster.","Average kinetic energy of particles increases, particle speed increases, and body temperature rises.","Neutral gas atoms become ionized (lose electrons), transforming into the plasma state."],"a":1,"e":"The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster."},{"id":"octE6","t":"mc","q":"What happens when/if: Relative humidity in the surrounding air increases significantly on a hot day.","o":["The 100g water sample undergoes a temperature rise 5 times greater than the 500g sample.","Average kinetic energy of particles increases, particle speed increases, and body temperature rises.","The rate of evaporation slows down because air is already saturated with moisture.","The state of matter transforms towards a denser, more rigid state (e.g. gas to liquid or liquid to solid)."],"a":2,"e":"The rate of evaporation slows down because air is already saturated with moisture."},{"id":"octE7","t":"mc","q":"What happens when/if: Atmospheric pressure acting on a liquid is reduced below standard sea-level pressure.","o":["Water converts to steam and escapes into air, while heat flows out; both mass and energy leave the open system.","The boiling point of the liquid decreases below its standard sea-level boiling point.","The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster.","Copper experiences a much larger and faster temperature rise than water because copper has a lower specific heat capacity."],"a":1,"e":"The boiling point of the liquid decreases below its standard sea-level boiling point."},{"id":"octE8","t":"mc","q":"What happens when/if: Pure water is heated inside a tightly sealed pressure cooker.","o":["Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed.","The metal ball expands in volume due to increased particle vibrations (thermal expansion).","The rate of evaporation slows down because air is already saturated with moisture.","Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time."],"a":3,"e":"Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time."},{"id":"octE9","t":"mc","q":"What happens when/if: Non-volatile salt is added to a pan of boiling water.","o":["The boiling point of water increases above 100°C.","Dye diffuses much faster in hot water than cold water because higher temperature increases
