أن جزيئات الشوائب تتداخل مع جزيئات الماء وتؤثر على قوى التماسك بينها فتتغير طاقة تغير الحالة.","لأنها تتكون من غازات متأينة تحوي أيونات موجبة وإلكترونات حرة طليقة الحركة.","لأنها لا تنتج مواد جديدة ولا تغير في التركيب الكيميائي للجزيئات ويمكن عكسها بتغيير الحرارة."],"a":3,"e":"السبب: لأنها لا تنتج مواد جديدة ولا تغير في التركيب الكيميائي للجزيئات ويمكن عكسها بتغيير الحرارة.","id":"sci111"},{"t":"mc","q":"علل: انخفاض درجة غليان الماء النقي عن 100°م على قمم الجبال العالية.","o":["لأنها تتكون من غازات متأينة تحوي أيونات موجبة وإلكترونات حرة طليقة الحركة.","لأن الطاقة الحرارية المكتسبة تستهلك في إضعاف قوى التماسك بين الجسيمات لتحويلها لسائل بدلاً من رفع الحرارة.","بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط.","بسبب انخفاض الضغط الجوي بالارتفاع عن مستوى سطح البحر."],"a":3,"e":"السبب: بسبب انخفاض الضغط الجوي بالارتفاع عن مستوى سطح البحر.","id":"sci112"},{"t":"mc","q":"علل: ينصح باستخدام قدر الضغط (Steam Pot) في المناطق الجبلية مرتفعة السطح.","o":["لأن جزيئات الشوائب تتداخل مع جزيئات الماء وتؤثر على قوى التماسك بينها فتتغير طاقة تغير الحالة.","لأن الضغط الجوي منخفض على الجبال مما يقلل درجة الغليان، فتقوم طنجرة الضغط برفع الضغط للطهي السريع.","لأنها لا تنتج مواد جديدة ولا تغير في التركيب الكيميائي للجزيئات ويمكن عكسها بتغيير الحرارة.","بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط."],"a":1,"e":"السبب: لأن الضغط الجوي منخفض على الجبال مما يقلل درجة الغليان، فتقوم طنجرة الضغط برفع الضغط للطهي السريع.","id":"sci113"},{"t":"mc","q":"علل: قدر الضغط يوفر الوقت والطاقة بنسبة 70% إلى 90% عند طهي الطعام.","o":["لأن الطاقة الحرارية المكتسبة تستهلك في إضعاف قوى التماسك بين الجسيمات لتحويلها لسائل بدلاً من رفع الحرارة.","لأنها لا تنتج مواد جديدة ولا تغير في التركيب الكيميائي للجزيئات ويمكن عكسها بتغيير الحرارة.","بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط.","لأن حبس البخار يرفع الضغط فتصل درجة غليان الماء لأعلى من 100°م مما ينضج الطعام أسرع."],"a":3,"e":"السبب: لأن حبس البخار يرفع الضغط فتصل درجة غليان الماء لأعلى من 100°م مما ينضج الطعام أسرع.","id":"sci114"},{"t":"mc","q":"علل: إضافة الملح أو السكر للماء النقي يغير من درجات غليانه وتجمده.","o":["لأن حبس البخار يرفع الضغط فتصل درجة غليان الماء لأعلى من 100°م مما ينضج الطعام أسرع.","لأن جزيئات الشوائب تتداخل مع جزيئات الماء وتؤثر على قوى التماسك بينها فتتغير طاقة تغير الحالة.","لأن الضغط الجوي منخفض على الجبال مما يقلل درجة الغليان، فتقوم طنجرة الضغط برفع الضغط للطهي السريع.","بسبب انخفاض الضغط الجوي بالارتفاع عن مستوى سطح البحر."],"a":1,"e":"السبب: لأن جزيئات الشوائب تتداخل مع جزيئات الماء وتؤثر على قوى التماسك بينها فتتغير طاقة تغير الحالة.","id":"sci115"},{"t":"mc","q":"علل: جفاف الملابس المبتلة عند تعرضها للشمس رغم عدم وصول حرارتها لدرجة الغليان.","o":["لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط.","لأن جزيئات الشوائب تتداخل مع جزيئات الماء وتؤثر على قوى التماسك بينها فتتغير طاقة تغير الحالة.","لأن الضغط الجوي منخفض على الجبال مما يقلل درجة الغليان، فتقوم طنجرة الضغط برفع الضغط للطهي السريع."],"a":1,"e":"السبب: بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط.","id":"sci116"},{"t":"mc","q":"علل: تجف الملابس بسرعة أكبر في الأيام التي تهب فيها الرياح ويقل فيها الرطوبة.","o":["لأن سرعة الرياح تبعد جزيئات البخار عن سطح السائل وانخفاض الرطوبة يزيد قدرة الهواء على استيعاب البخار فيزداد معدل التبخر.","لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","لأنه يتبادل الطاقة (الحرارة) فقط مع جسم المريض دون تبادل المادة (الزئبق).","لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة."],"a":0,"e":"السبب: لأن سرعة الرياح تبعد جزيئات البخار عن سطح السائل وانخفاض الرطوبة يزيد قدرة الهواء على استيعاب البخار فيزداد معدل التبخر.","id":"sci117"},{"t":"mc","q":"علل: تعريض رذاذ مستخلص القهوة لهواء ساخن وجاف عند تصنيع القهوة سريعة الذوبان.","o":["لزيادة مساحة سطح القطرات وسرعة التبخر الفوري للماء وجمع بلورات القهوة الجافة.","لأن سرعة الرياح تبعد جزيئات البخار عن سطح السائل وانخفاض الرطوبة يزيد قدرة الهواء على استيعاب البخار فيزداد معدل التبخر.","لأن جزيئات الشوائب تتداخل مع جزيئات الماء وتؤثر على قوى التماسك بينها فتتغير طاقة تغير الحالة.","بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط."],"a":0,"e":"السبب: لزيادة مساحة سطح القطرات وسرعة التبخر الفوري للماء وجمع بلورات القهوة الجافة.","id":"sci118"},{"t":"mc","q":"علل: يعتبر الترمومتر الطبي نظاماً مغلقاً.","o":["لزيادة مساحة سطح القطرات وسرعة التبخر الفوري للماء وجمع بلورات القهوة الجافة.","لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","لأن الطاقة الحرارية تتوزع على عدد أقل من الجسيمات في الكتلة الأصغر فيزداد متوسط طاقة حركتها بمقدار أكبر.","لأنه يتبادل الطاقة (الحرارة) فقط مع جسم المريض دون تبادل المادة (الزئبق)."],"a":3,"e":"السبب: لأنه يتبادل الطاقة (الحرارة) فقط مع جسم المريض دون تبادل المادة (الزئبق).","id":"sci119"},{"t":"mc","q":"علل: تعتبر قارورة الفراغ (الترمس) نظاماً معزولاً.","o":["لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة.","لأن الطاقة الحرارية تتوزع على عدد أقل من الجسيمات في الكتلة الأصغر فيزداد متوسط طاقة حركتها بمقدار أكبر.","بسبب حدوث عملية التبخر لجزيئات الماء السطحية باكتساب الطاقة من الوسط المحيط.","لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط."],"a":3,"e":"السبب: لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","id":"sci120"},{"t":"mc","q":"علل: تعبر درجة الحرارة عن متوسط طاقة حركة الجسيمات وليس طاقة حركة الجسيم الواحد.","o":["لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","لأن سرعة الرياح تبعد جزيئات البخار عن سطح السائل وانخفاض الرطوبة يزيد قدرة الهواء على استيعاب البخار فيزداد معدل التبخر.","لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة.","لزيادة مساحة سطح القطرات وسرعة التبخر الفوري للماء وجمع بلورات القهوة الجافة."],"a":2,"e":"السبب: لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة.","id":"sci121"},{"t":"mc","q":"علل: ارتفاع درجة حرارة المادة عند اكتسابها طاقة حرارية.","o":["لأن اكتساب الطاقة الحرارية يزيد من متوسط طاقة حركة الجسيمات وبالتالي ترتفع حرارة النظام.","لأن حرارته النوعية هي الأعلى مرتفعة جداً فيمتص كميات كبيرة من حرارة المحرك دون ارتفاع كبير في حرارته.","لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة."],"a":0,"e":"السبب: لأن اكتساب الطاقة الحرارية يزيد من متوسط طاقة حركة الجسيمات وبالتالي ترتفع حرارة النظام.","id":"sci122"},{"t":"mc","q":"علل: ارتفاع درجة حرارة 0.5 كجم ماء أسرع من 1 كجم ماء عند تسخينهما بنفس المصدر بنفس الزمن.","o":["لأن الطاقة الحرارية تتوزع على عدد أقل من الجسيمات في الكتلة الأصغر فيزداد متوسط طاقة حركتها بمقدار أكبر.","لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة.","لأن حرارته النوعية هي الأعلى مرتفعة جداً فيمتص كميات كبيرة من حرارة المحرك دون ارتفاع كبير في حرارته."],"a":0,"e":"السبب: لأن الطاقة الحرارية تتوزع على عدد أقل من الجسيمات في الكتلة الأصغر فيزداد متوسط طاقة حركتها بمقدار أكبر.","id":"sci123"},{"t":"mc","q":"علل: يفضل استخدام النحاس أو الألومنيوم في تصنيع أواني الطهي بدلاً من المواد الأخرى.","o":["لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة.","لأن الطاقة الحرارية تتوزع على عدد أقل من الجسيمات في الكتلة الأصغر فيزداد متوسط طاقة حركتها بمقدار أكبر.","لأن جدارها العازل يمنع تبادل الحرارة (الطاقة) والمادة مع الوسط المحيط.","لأن حرارتها النوعية منخفضة فيسخن بسرعة ويوصل الحرارة للطعام بكفاءة."],"a":3,"e":"السبب: لأن حرارتها النوعية منخفضة فيسخن بسرعة ويوصل الحرارة للطعام بكفاءة.","id":"sci124"},{"t":"mc","q":"علل: استخدام الماء كأفضل سائل لتبريد محركات السيارات (في الرادياتير).","o":["لأن الطاقة الحرارية تتوزع على عدد أقل من الجسيمات في الكتلة الأصغر فيزداد متوسط طاقة حركتها بمقدار أكبر.","لأن حرارتها النوعية منخفضة فيسخن بسرعة ويوصل الحرارة للطعام بكفاءة.","لأن حرارته النوعية هي الأعلى مرتفعة جداً فيمتص كميات كبيرة من حرارة المحرك دون ارتفاع كبير في حرارته.","لأن طاقة حركة الجسيمات تختلف من جسيم لآخر داخل نفس المادة."],"a":2,"e":"السبب: لأن حرارته النوعية هي الأعلى مرتفعة جداً فيمتص كميات كبيرة من حرارة المحرك دون ارتفاع كبير في حرارته.","id":"sci125"},{"t":"mc","q":"ماذا يحدث عند: وضع نقطة حبر أو كريستالة برمنجنات البوتاسيوم في beaker به ماء.","o":["تنتشر جسيمات المادة الملونة تدريجياً في الماء حتى يتلون السائل بالكامل باللون البنفسجي أو لون الحبر.","تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","لا يتغير الحجم ولا ينضغط المكبس لأن السوائل والمواد الصلبة غير قابلة للانضغط.","يتأين الغاز ويتحول إلى الحالة البلازمية (أيونات موجبة وإلكترونات حرة)."],"a":0,"e":"الإجابة: تنتشر جسيمات المادة الملونة تدريجياً في الماء حتى يتلون السائل بالكامل باللون البنفسجي أو لون الحبر.","id":"sci126"},{"t":"mc","q":"ماذا يحدث عند: الضغط على مكبس محقنة طبية تحتوي على هواء ومسدودة الطرف.","o":["يتأين الغاز ويتحول إلى الحالة البلازمية (أيونات موجبة وإلكترونات حرة).","تنتشر جسيمات المادة الملونة تدريجياً في الماء حتى يتلون السائل بالكامل باللون البنفسجي أو لون الحبر.","تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","يقل حجم الهواء ويزداد ضغطه لأن المسافات البينية بين جزيئاته تقل دون أن يتغير حجم الجزيئات نفسها."],"a":3,"e":"الإجابة: يقل حجم الهواء ويزداد ضغطه لأن المسافات البينية بين جزيئاته تقل دون أن يتغير حجم الجزيئات نفسها.","id":"sci127"},{"t":"mc","q":"ماذا يحدث عند: الضغط على مكبس محقنة طبية تحتوي على ماء أو رمل.","o":["تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","يقل حجم الهواء ويزداد ضغطه لأن المسافات البينية بين جزيئاته تقل دون أن يتغير حجم الجزيئات نفسها.","تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","لا يتغير الحجم ولا ينضغط المكبس لأن السوائل والمواد الصلبة غير قابلة للانضغط."],"a":3,"e":"الإجابة: لا يتغير الحجم ولا ينضغط المكبس لأن السوائل والمواد الصلبة غير قابلة للانضغط.","id":"sci128"},{"t":"mc","q":"ماذا يحدث عند: تسخين غاز متعادل إلى درجات حرارة فائقة جداً أو إمراره في مجال كهربائي قوي.","o":["تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","يتأين الغاز ويتحول إلى الحالة البلازمية (أيونات موجبة وإلكترونات حرة).","ترتفع حرارته حتى 0°م، ثم تثبت عند 0°م حتى يكتمل الانصهار، ثم ترتفع حرارة الماء حتى 100°م.","يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل."],"a":1,"e":"الإجابة: يتأين الغاز ويتحول إلى الحالة البلازمية (أيونات موجبة وإلكترونات حرة).","id":"sci129"},{"t":"mc","q":"ماذا يحدث عند: مرور الأشعة الكونية المشحونة بالقرب من المجال المغناطيسي للقطبين الشمالي والجنوبي للأرض.","o":["تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","يتكثف بخار الماء على السطح البارد إلى قطرات ماء تسمى الندى."],"a":1,"e":"الإجابة: تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","id":"sci130"},{"t":"mc","q":"ماذا يحدث عند: اكتساب قطعة من الثلج (-5°م) كمية من الطاقة الحرارية باستمرار.","o":["يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","يتكثف بخار الماء على السطح البارد إلى قطرات ماء تسمى الندى.","ترتفع حرارته حتى 0°م، ثم تثبت عند 0°م حتى يكتمل الانصهار، ثم ترتفع حرارة الماء حتى 100°م.","تقل درجة غليان الماء بمقدار 10°م فتصبح 90°م لأن الضغط الجوي ينخفض."],"a":2,"e":"الإجابة: ترتفع حرارته حتى 0°م، ثم تثبت عند 0°م حتى يكتمل الانصهار، ثم ترتفع حرارة الماء حتى 100°م.","id":"sci131"},{"t":"mc","q":"ماذا يحدث عند: وصول الماء إلى درجة الغليان (100°م) مع استمرار التسخين.","o":["تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","ترتفع درجة غليان الماء بمقدار 1°م فتصبح 101°م لأن الضغط الجوي يزداد."],"a":2,"e":"الإجابة: تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","id":"sci132"},{"t":"mc","q":"ماذا يحدث عند: ترك الثلج الجاف (ثاني أكسيد الكربون الصلب) في درجة حرارة الغرفة.","o":["تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا).","يتأين الغاز ويتحول إلى الحالة البلازمية (أيونات موجبة وإلكترونات حرة).","يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر."],"a":2,"e":"الإجابة: يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","id":"sci133"},{"t":"mc","q":"ماذا يحدث عند: ملامسة بخار الماء الجوي لسطح بارد (مثل أوراق الشجر في الصباح الباكر).","o":["يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","يتكثف بخار الماء على السطح البارد إلى قطرات ماء تسمى الندى.","تقل درجة غليان الماء بمقدار 10°م فتصبح 90°م لأن الضغط الجوي ينخفض.","تتشتت الأشعة بعيداً عن سطح الأرض وتظهر في السماء ستائر ضوئية ملونة تسمى الشفق القطبي (الأرورا)."],"a":1,"e":"الإجابة: يتكثف بخار الماء على السطح البارد إلى قطرات ماء تسمى الندى.","id":"sci134"},{"t":"mc","q":"ماذا يحدث لدرجة غليان الماء النقي عند الصعود إلى قمة جبل ارتفاعه 3000 متر فوق سطح البحر.","o":["يتكثف بخار الماء على السطح البارد إلى قطرات ماء تسمى الندى.","تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","ترتفع حرارته حتى 0°م، ثم تثبت عند 0°م حتى يكتمل الانصهار، ثم ترتفع حرارة الماء حتى 100°م.","تقل درجة غليان الماء بمقدار 10°م فتصبح 90°م لأن الضغط الجوي ينخفض."],"a":3,"e":"الإجابة: تقل درجة غليان الماء بمقدار 10°م فتصبح 90°م لأن الضغط الجوي ينخفض.","id":"sci135"},{"t":"mc","q":"ماذا يحدث لدرجة غليان الماء النقي عند الهبوط إلى منخفض عمقه 300 متر تحت سطح البحر.","o":["تثبت درجة الحرارة عند 100°م ويبدأ الماء في التحول لبخار حتى يكتمل التبخر.","يقل معدل تبخر السائل لأن الهواء يكون مشبعاً ببخار الماء.","ترتفع درجة غليان الماء بمقدار 1°م فتصبح 101°م لأن الضغط الجوي يزداد.","يتكثف بخار الماء على السطح البارد إلى قطرات ماء تسمى الندى."],"a":2,"e":"الإجابة: ترتفع درجة غليان الماء بمقدار 1°م فتصبح 101°م لأن الضغط الجوي يزداد.","id":"sci136"},{"t":"mc","q":"ماذا يحدث عند: زيادة الضغط داخل طنجرة الضغط (قدر الضغط) أثناء طهي الطعام.","o":["يتسامى مباشرة ويتحول من الحالة الصلبة إلى غاز ثاني أكسيد الكربون دون أن يسيل.","يزداد معدل تبخر السائل لنقل الجزيئات المتبخرة بعيداً عن السطح.","ترتفع درجة غليان الماء لأعلى من 100°م فينضج الطعام بسرعة ويقل زمن الطهي وتوفير الطاقة.","يقل معدل تبخر السائل لأن الهواء يكون مشبعاً ببخار الماء."],"a":2,"e":"الإجابة: ترتفع درجة غليان الماء لأعلى من 100°م فينضج الطعام بسرعة ويقل زمن الطهي وتوفير الطاقة.","id":"sci137"},{"t":"mc","q":"ماذا يحدث لدرجة تجمد ودرجة غليان الماء عند إدابة 180 جم من الجلوكوز في لتر ماء نقي.","o":["يتكثف بخار الماء على السطح البارد إلى قطرات ماء تسمى الندى.","تقل درجة غليان الماء بمقدار 10°م فتصبح 90°م لأن الضغط الجوي ينخفض.","ترتفع درجة الغليان لتصبح 100.5°م وتنخفض درجة التجمد لتصبح -1.86°م.","ترتفع درجة غليان الماء بمقدار 1°م فتصبح 101°م لأن الضغط الجوي يزداد."],"a":2,"e":"الإجابة: ترتفع درجة الغليان لتصبح 100.5°م وتنخفض درجة التجمد لتصبح -1.86°م.","id":"sci138"},{"t":"mc","q":"ماذا يحدث لمعدل تبخر سائل عند زيادة مساحة السطح المعرضة للهواء.","o":["يزداد معدل تبخر السائل لزيادة عدد الجزيئات السطحية المعرضة للهواء.","تقل كتلة النظام (لتبخر بخار الماء) وتقل درجة الحرارة لانتقال الحرارة للوسط المحيط.","تقل درجة غليان الماء بمقدار 10°م فتصبح 90°م لأن الضغط الجوي ينخفض.","تظل كتلة النظام ثابته، بينما تقل درجة حرارته بفقدان الطاقة للثلج."],"a":0,"e":"الإجابة: يزداد معدل تبخر السائل لزيادة عدد الجزيئات السطحية المعرضة للهواء.","id":"sci139"},{"t":"mc","q":"ماذا يحدث لمعدل تبخر سائل عند ارتفاع نسبة الرطوبة في الجو.","o":["يقل معدل تبخر السائل لأن الهواء يكون مشبعاً ببخار الماء.","تظل كتلة المشروب ودرجة حرارته ثابتين لعدم وجود تبادل للمادة أو الطاقة.","ترتفع درجة غليان الماء بمقدار 1°م فتصبح 101°م لأن الضغط الجوي يزداد.","ترتفع درجة الغليان لتصبح 100.5°م وتنخفض درجة التجمد لتصبح -1.86°م."],"a":0,"e":"الإجابة: يقل معدل تبخر السائل لأن الهواء يكون مشبعاً ببخار الماء.","id":"sci140"},{"t":"mc","q":"ماذا يحدث لمعدل تبخر سائل عند زيادة سرعة تيارات الهواء (الرياح).","o":["يزداد معدل تبخر السائل لنقل الجزيئات المتبخرة بعيداً عن السطح.","تظل كتلة النظام ثابته، بينما تقل درجة حرارته بفقدان الطاقة للثلج.","تقل كتلة النظام (لتبخر بخار الماء) وتقل درجة الحرارة لانتقال الحرارة للوسط المحيط.","تظل كتلة المشروب ودرجة حرارته ثابتين لعدم وجود تبادل للمادة أو الطاقة."],"a":0,"e":"الإجابة: يزداد معدل تبخر السائل لنقل الجزيئات المتبخرة بعيداً عن السطح.","id":"sci141"},{"t":"mc","q":"ماذا يحدث لكتلة ودرجة حرارة ماء يغلي داخل إناء مفتوح (نظام مفتوح).","o":["ترتفع درجة الغليان لتصبح 100.5°م وتنخفض درجة التجمد لتصبح -1.86°م.","تظل كتلة المشروب ودرجة حرارته ثابتين لعدم وجود تبادل للمادة أو الطاقة.","تزداد الطاقة الداخلية للنظام (لأن الطاقة الداخلية = طاقة الحركة + طاقة الوضع).","تقل كتلة النظام (لتبخر بخار الماء) وتقل درجة الحرارة لانتقال الحرارة للوسط المحيط."],"a":3,"e":"الإجابة: تقل كتلة النظام (لتبخر بخار الماء) وتقل درجة الحرارة لانتقال الحرارة للوسط المحيط.","id":"sci142"},{"t":"mc","q":"ماذا يحدث لكتلة ودرجة حرارة علبة صودا مغلقة موضوعة في ثلج (نظام مغلق).","o":["يزداد معدل تبخر السائل لنقل الجزيئات المتبخرة بعيداً عن السطح.","تظل كتلة النظام ثابته، بينما تقل درجة حرارته بفقدان الطاقة للثلج.","يزداد متوسط طاقة حركة الجسيمات وتزداد سرعتها وتصادماتها.","تقل كتلة النظام (لتبخر بخار الماء) وتقل درجة الحرارة لانتقال الحرارة للوسط المحيط."],"a":1,"e":"الإجابة: تظل كتلة النظام ثابته، بينما تقل درجة حرارته بفقدان الطاقة للثلج.","id":"sci143"},{"t":"mc","q":"ماذا يحدث لكتلة ودرجة حرارة مشروب ساخن داخل قارورة الفراغ / الترمس (نظام معزول).","o":["يقل معدل تبخر السائل لأن الهواء يكون مشبعاً ببخار الماء.","تزداد الطاقة الداخلية للنظام (لأن الطاقة الداخلية = طاقة الحركة + طاقة الوضع).","تقل كتلة النظام (لتبخر بخار الماء) وتقل درجة الحرارة لانتقال الحرارة للوسط المحيط.","تظل كتلة المشروب ودرجة حرارته ثابتين لعدم وجود تبادل للمادة أو الطاقة."],"a":3,"e":"الإجابة: تظل كتلة المشروب ودرجة حرارته ثابتين لعدم وجود تبادل للمادة أو الطاقة.","id":"sci144"},{"t":"mc","q":"ماذا يحدث للط إلى الغازية دون المرور بالسائلة."],["الترسيب (Deposition)","تحول الغاز مباشرة إلى الحالة الصلبة دون المرور بالسائلة مثل الصقيع."],["التكثيف (Condensation)","تحول المادة من الحالة الغازية إلى السائلة بفقد طاقة حرارية."]],"e":"التوصيل الصحيح: الانصهار (Melting) ← تحول المادة من الحالة الصلبة إلى السائلة باكتساب طاقة حرارية.؛ التبخر (Evaporation) ← يحدث عند أي درجة حرارة أقل من الغليان وعلى سطح السائل فقط.؛ التسامي (Sublimation) ← تحول المادة مباشرة من الحالة الصلبة إلى الغازية دون المرور بالسائلة.؛ الترسيب (Deposition) ← تحول الغاز مباشرة إلى الحالة الصلبة دون المرور بالسائلة مثل الصقيع.؛ التكثيف (Condensation) ← تحول المادة من الحالة الغازية إلى السائلة بفقد طاقة حرارية.","id":"sci177"},{"t":"match","q":"وصّل من العمود (أ) ما يناسبه من العمود (ب): أنواع الأنظمة الحرارية","p":[["النظام المفتوح","يتبادل كل من المادة والطاقة مع الوسط المحيط مثل إناء مغلي مفتوح."],["النظام المغلق","يتبادل الطاقة فقط ولا يتبادل المادة مع الوسط المحيط مثل الترمومتر."],["النظام المعزول","لا يتبادل لا المادة ولا الطاقة مع الوسط المحيط مثل الترمس."],["حدود النظام","الفاصل الذي يعزل ويحدد النظام عن الوسط المحيط به."],["درجة الحرارة","مقياس لمتوسط طاقة حركة جسيمات النظام وتحدد اتجاه انتقال الحرارة."]],"e":"التوصيل الصحيح: النظام المفتوح ← يتبادل كل من المادة والطاقة مع الوسط المحيط مثل إناء مغلي مفتوح.؛ النظام المغلق ← يتبادل الطاقة فقط ولا يتبادل المادة مع الوسط المحيط مثل الترمومتر.؛ النظام المعزول ← لا يتبادل لا المادة ولا الطاقة مع الوسط المحيط مثل الترمس.؛ حدود النظام ← الفاصل الذي يعزل ويحدد النظام عن الوسط المحيط به.؛ درجة الحرارة ← مقياس لمتوسط طاقة حركة جسيمات النظام وتحدد اتجاه انتقال الحرارة.","id":"sci178"},{"t":"match","q":"وصّل من العمود (أ) ما يناسبه من العمود (ب): العوامل والحرارة النوعية","p":[["الحرارة النوعية للماء","مرتفعة جداً (4180 J/kg.°C) وتجعله ممتازاً لتبريد المحركات."],["الحرارة النوعية للزئبق","منخفضة جداً (140 J/kg.°C) فيسخن بسرعة ويستخدم في الترمومترات."],["كتلة المادة","تتناسب عكسياً مع التغير في درجة الحرارة عند تسخين نفس المادة."],["قدر الضغط","أداة تعمل على زيادة الضغط لرفع غليان الماء وطهي الطعام بسرعة."],["الرطوبة","تسبب خفض معدل تبخر السوائل عند زيادتها في الهواء الجوي."]],"e":"التوصيل الصحيح: الحرارة النوعية للماء ← مرتفعة جداً (4180 J/kg.°C) وتجعله ممتازاً لتبريد المحركات.؛ الحرارة النوعية للزئبق ← منخفضة جداً (140 J/kg.°C) فيسخن بسرعة ويستخدم في الترمومترات.؛ كتلة المادة ← تتناسب عكسياً مع التغير في درجة الحرارة عند تسخين نفس المادة.؛ قدر الضغط ← أداة تعمل على زيادة الضغط لرفع غليان الماء وطهي الطعام بسرعة.؛ الرطوبة ← تسبب خفض معدل تبخر السوائل عند زيادتها في الهواء الجوي.","id":"sci179"}];

دد الهواء النقي ودخوله وخروجه باستمرار من فتحتي الوعاء.","id":"g6o67"},{"t":"mc","q":"علل: يزداد توهج واشتعال عود البخور أو لهب الشمعة عند وضعه في مخبار ممتلئ بغاز الأكسجين النقي.","o":["بسبب استهلاك ونفاذ الأكسجين الموجود بالوعاء وتراكم الغازات التي لا تساعد على الاشتعال.","لأن غاز الأكسجين يساعد على الاشتعال ويزيد من توهج اللهب.","لحماية العينين من رذاذ ماء الجير أثناء إجراء التفاعلات التفاعلية في المعمل.","لجعل درجة الحرارة ممثلة لدرجة حرارة جسم الإنسان الداخلية (40° مئوية) ليعمل اللعاب بكفاءة."],"a":1,"e":"السبب: لأن غاز الأكسجين يساعد على الاشتعال ويزيد من توهج اللهب.","id":"g6o68"},{"t":"mc","q":"علل: تكدر ماء الجير الرائق وتحوله للون الأبيض الحليبي عند رجّه في وعاء احترقت فيه شمعة.","o":["لأن غاز الأكسجين يساعد على الاشتعال ويزيد من توهج اللهب.","لأن اللعاب في الفم يحتوي على عصارة هضمية تحول النشا المعقد إلى سكر حلو المذاق.","بسبب تفاعل غاز ثاني أكسيد الكربون الناتج من الاحتراق مع ماء الجير الرائق.","بسبب استهلاك ونفاذ الأكسجين الموجود بالوعاء وتراكم الغازات التي لا تساعد على الاشتعال."],"a":2,"e":"السبب: بسبب تفاعل غاز ثاني أكسيد الكربون الناتج من الاحتراق مع ماء الجير الرائق.","id":"g6o69"},{"t":"mc","q":"علل: ضرورة ارتداء نظارات الحماية (Safety goggles) عند إجراء تجارب ماء الجير في المعمل.","o":["لأن الكبد يقوم بتخزين بعض المواد الغذائية وتوزيعها على كافة أجزاء الجسم عند الحاجة.","لزيادة مساحة سطح الامتصاص مما يسمح بامتصاص العناصر الغذائية والماء بكفاءة عالية.","لحماية العينين من رذاذ ماء الجير أثناء إجراء التفاعلات التفاعلية في المعمل.","بسبب استهلاك ونفاذ الأكسجين الموجود بالوعاء وتراكم الغازات التي لا تساعد على الاشتعال."],"a":2,"e":"السبب: لحماية العينين من رذاذ ماء الجير أثناء إجراء التفاعلات التفاعلية في المعمل.","id":"g6o70"},{"t":"mc","q":"علل: تشعر بطعم حلو عند مضغ قطعة من الخبز ببطء في الفم.","o":["لزيادة مساحة سطح الامتصاص مما يسمح بامتصاص العناصر الغذائية والماء بكفاءة عالية.","لحماية العينين من رذاذ ماء الجير أثناء إجراء التفاعلات التفاعلية في المعمل.","لأن الأسماك تعيش في الماء وتستخلص الأكسجين الذائب بالخياشيم، بينما القطط تعيش على اليابسة وتتنفس أكسجين الهواء بالرئتين.","لأن اللعاب في الفم يحتوي على عصارة هضمية تحول النشا المعقد إلى سكر حلو المذاق."],"a":3,"e":"السبب: لأن اللعاب في الفم يحتوي على عصارة هضمية تحول النشا المعقد إلى سكر حلو المذاق.","id":"g6o71"},{"t":"mc","q":"علل: يفضل التسخين في حمام مائي عند درجة حرارة 40° مئوية في تجربة اختبار اللعاب والنشا.","o":["لتسهيل عملية تبادل الغازات بين الهواء في الحويصلات والدم في الشعيرات الدموية بسرعة.","لجعل درجة الحرارة ممثلة لدرجة حرارة جسم الإنسان الداخلية (40° مئوية) ليعمل اللعاب بكفاءة.","بسبب تفاعل غاز ثاني أكسيد الكربون الناتج من الاحتراق مع ماء الجير الرائق.","لحماية العينين من رذاذ ماء الجير أثناء إجراء التفاعلات التفاعلية في المعمل."],"a":1,"e":"السبب: لجعل درجة الحرارة ممثلة لدرجة حرارة جسم الإنسان الداخلية (40° مئوية) ليعمل اللعاب بكفاءة.","id":"g6o72"},{"t":"mc","q":"علل: وجود الخملات (Villi) بأعداد كبيرة على الجدار الداخلي للأمعاء الدقيقة.","o":["لزيادة مساحة سطح الامتصاص مما يسمح بامتصاص العناصر الغذائية والماء بكفاءة عالية.","لأن اللعاب في الفم يحتوي على عصارة هضمية تحول النشا المعقد إلى سكر حلو المذاق.","لأن الأسماك تعيش في الماء وتستخلص الأكسجين الذائب بالخياشيم، بينما القطط تعيش على اليابسة وتتنفس أكسجين الهواء بالرئتين.","لأن الكبد يقوم بتخزين بعض المواد الغذائية وتوزيعها على كافة أجزاء الجسم عند الحاجة."],"a":0,"e":"السبب: لزيادة مساحة سطح الامتصاص مما يسمح بامتصاص العناصر الغذائية والماء بكفاءة عالية.","id":"g6o73"},{"t":"mc","q":"علل: يمر الدم المحمل بالمواد الغذائية الممتصة عبر الكبد قبل انتقاله إلى بقية أعضاء الجسم.","o":["لأنها تقوم بتصفية الدم وتنقيته من الفضلات الضارة والماء الزائد وتكوين البول لإخراجه.","لحماية العينين من رذاذ ماء الجير أثناء إجراء التفاعلات التفاعلية في المعمل.","لأن الكبد يقوم بتخزين بعض المواد الغذائية وتوزيعها على كافة أجزاء الجسم عند الحاجة.","لأن الأسماك تعيش في الماء وتستخلص الأكسجين الذائب بالخياشيم، بينما القطط تعيش على اليابسة وتتنفس أكسجين الهواء بالرئتين."],"a":2,"e":"السبب: لأن الكبد يقوم بتخزين بعض المواد الغذائية وتوزيعها على كافة أجزاء الجسم عند الحاجة.","id":"g6o74"},{"t":"mc","q":"علل: تتنفس الأسماك باستخدام الخياشيم بينما تتنفس القطط باستخدام الرئتين.","o":["لأن الأسماك تعيش في الماء وتستخلص الأكسجين الذائب بالخياشيم، بينما القطط تعيش على اليابسة وتتنفس أكسجين الهواء بالرئتين.","لجعل درجة الحرارة ممثلة لدرجة حرارة جسم الإنسان الداخلية (40° مئوية) ليعمل اللعاب بكفاءة.","لأن اللعاب في الفم يحتوي على عصارة هضمية تحول النشا المعقد إلى سكر حلو المذاق.","لزيادة مساحة سطح الامتصاص مما يسمح بامتصاص العناصر الغذائية والماء بكفاءة عالية."],"a":0,"e":"السبب: لأن الأسماك تعيش في الماء وتستخلص الأكسجين الذائب بالخياشيم، بينما القطط تعيش على اليابسة وتتنفس أكسجين الهواء بالرئتين.","id":"g6o75"},{"t":"mc","q":"علل: تحاط الحويصلات الهوائية بشبكة كثيفة من الشعيرات الدموية.","o":["لأن الأسماك تعيش في الماء وتستخلص الأكسجين الذائب بالخياشيم، بينما القطط تعيش على اليابسة وتتنفس أكسجين الهواء بالرئتين.","لأنها تقوم بتصفية الدم وتنقيته من الفضلات الضارة والماء الزائد وتكوين البول لإخراجه.","لأن الكبد يقوم بتخزين بعض المواد الغذائية وتوزيعها على كافة أجزاء الجسم عند الحاجة.","لتسهيل عملية تبادل الغازات بين الهواء في الحويصلات والدم في الشعيرات الدموية بسرعة."],"a":3,"e":"السبب: لتسهيل عملية تبادل الغازات بين الهواء في الحويصلات والدم في الشعيرات الدموية بسرعة.","id":"g6o76"},{"t":"mc","q":"علل: تزداد سرعة ضربات القلب ونبضه بعد ممارسة الجري أو القيام بمجهود بدني.","o":["لأن الأسماك تعيش في الماء وتستخلص الأكسجين الذائب بالخياشيم، بينما القطط تعيش على اليابسة وتتنفس أكسجين الهواء بالرئتين.","لأن الكبد يقوم بتخزين بعض المواد الغذائية وتوزيعها على كافة أجزاء الجسم عند الحاجة.","لضخ الدم بسرعة أكبر وتزويد الجسم بالمزيد من الأكسجين والمغذيات اللازمة لإنتاج الطاقة أثناء الجهد.","لزيادة مساحة سطح الامتصاص مما يسمح بامتصاص العناصر الغذائية والماء بكفاءة عالية."],"a":2,"e":"السبب: لضخ الدم بسرعة أكبر وتزويد الجسم بالمزيد من الأكسجين والمغذيات اللازمة لإنتاج الطاقة أثناء الجهد.","id":"g6o77"},{"t":"mc","q":"علل: تلعب الكليتان دوراً حيوياً ورئيسياً في جسم الإنسان.","o":["لأن الأسماك تعيش في الماء وتستخلص الأكسجين الذائب بالخياشيم، بينما القطط تعيش على اليابسة وتتنفس أكسجين الهواء بالرئتين.","لأنها تقوم بتصفية الدم وتنقيته من الفضلات الضارة والماء الزائد وتكوين البول لإخراجه.","لضخ الدم بسرعة أكبر وتزويد الجسم بالمزيد من الأكسجين والمغذيات اللازمة لإنتاج الطاقة أثناء الجهد.","لنقل الأكسجين والمغذيات إلى جميع الأعضاء، وتخليصها من الفضلات وثاني أكسيد الكربون."],"a":1,"e":"السبب: لأنها تقوم بتصفية الدم وتنقيته من الفضلات الضارة والماء الزائد وتكوين البول لإخراجه.","id":"g6o78"},{"t":"mc","q":"علل: تحاط الرئتان والقلب بالضلوع داخل التجويف الصدري.","o":["لنقل الأكسجين والمغذيات إلى جميع الأعضاء، وتخليصها من الفضلات وثاني أكسيد الكربون.","لحمايتهما من الصدمات والتقلبات الفيزيائية بفضل القفص الصدري والضلوع.","لضخ الدم بسرعة أكبر وتزويد الجسم بالمزيد من الأكسجين والمغذيات اللازمة لإنتاج الطاقة أثناء الجهد.","لأنها تقوم بتصفية الدم وتنقيته من الفضلات الضارة والماء الزائد وتكوين البول لإخراجه."],"a":1,"e":"السبب: لحمايتهما من الصدمات والتقلبات الفيزيائية بفضل القفص الصدري والضلوع.","id":"g6o79"},{"t":"mc","q":"علل: ترتبط جميع أعضاء وأجهزة الجسم المختلفة بشبكة من الأوعية الدموية.","o":["لحمايتهما من الصدمات والتقلبات الفيزيائية بفضل القفص الصدري والضلوع.","لنقل الأكسجين والمغذيات إلى جميع الأعضاء، وتخليصها من الفضلات وثاني أكسيد الكربون.","لأن الكبد يقوم بتخزين بعض المواد الغذائية وتوزيعها على كافة أجزاء الجسم عند الحاجة.","لحماية العينين من رذاذ ماء الجير أثناء إجراء التفاعلات التفاعلية في المعمل."],"a":1,"e":"السبب: لنقل الأكسجين والمغذيات إلى جميع الأعضاء، وتخليصها من الفضلات وثاني أكسيد الكربون.","id":"g6o80"},{"t":"mc","q":"ماذا يحدث عند: إدخال شمعة مشتعلة داخل مخبار ممتلئ بغاز ثاني أكسيد الكربون.","o":["تقوم الأمعاء الغليظة بامتصاص الماء المتبقي منه وطرد الباقي كبراز عبر فتحة الشرج.","يحدث الزفير، حيث يضيق القفص الصدري ويخرج الهواء المحمل بثاني أكسيد الكربون.","يحدث الشهيق، حيث يتسع القفص الصدري ويدخل الهواء المحمل بالأكسجين إلى الرئتين.","ينطفئ لهب الشمعة فوراً لأن ثاني أكسيد الكربون لا يساعد على الاشتعال."],"a":3,"e":"الإجابة: ينطفئ لهب الشمعة فوراً لأن ثاني أكسيد الكربون لا يساعد على الاشتعال.","id":"g6o81"},{"t":"mc","q":"ماذا يحدث عند: إدخال عود بخور مشتعل داخل مخبار مغلق ممتلئ بغاز النيتروجين.","o":["تقل مساحة سطح الامتصاص بدرجة كبيرة وتضعف كفاءة امتصاص المغذيات والماء للجسم.","يزداد معدل نبضات قلبه من ~70 إلى نحو ~110 نبضة/دقيقة لتوفير الطاقة والدم.","يضعف لهب عود البخور تدريجياً ثم ينطفئ لأن النيتروجين لا يساعد على الاشتعال.","يحدث الشهيق، حيث يتسع القفص الصدري ويدخل الهواء المحمل بالأكسجين إلى الرئتين."],"a":2,"e":"الإجابة: يضعف لهب عود البخور تدريجياً ثم ينطفئ لأن النيتروجين لا يساعد على الاشتعال.","id":"g6o82"},{"t":"mc","q":"ماذا يحدث عند: تغطية الفتحة العلوية لوعاء زجاجي يحتوي على شمعة مشتعلة بغطاء معدني محكم.","o":["يتعكر ماء الجير ويتحول لونه إلى الأبيض الحليبي لاحتواء هواء الزفير على نسب عالية من CO2.","لا يتغير لون محلول اليود ويبقى بنياً لأن اللعاب هضم النشا وحوله إلى سكر.","يتحول لون محلول اليود من البني إلى الأزرق الداكن لوجود النشا.","ينطفئ اللهب بعد فترة قصيرة جداً لنفاذ الأكسجين وعدم تجدد الهواء."],"a":3,"e":"الإجابة: ينطفئ اللهب بعد فترة قصيرة جداً لنفاذ الأكسجين وعدم تجدد الهواء.","id":"g6o83"},{"t":"mc","q":"ماذا يحدث عند: نفخ هواء الزفير داخل كيس بلاستيكي يحتوي على كمية من ماء الجير الرائق ورجّه.","o":["يضعف لهب عود البخور تدريجياً ثم ينطفئ لأن النيتروجين لا يساعد على الاشتعال.","يتعكر ماء الجير ويتحول لونه إلى الأبيض الحليبي لاحتواء هواء الزفير على نسب عالية من CO2.","تنطفئ النيران وتتوقف عملية الاحتراق لنفاذ الأكسجين من المكان.","يتحول لون محلول اليود من البني إلى الأزرق الداكن لوجود النشا."],"a":1,"e":"الإجابة: يتعكر ماء الجير ويتحول لونه إلى الأبيض الحليبي لاحتواء هواء الزفير على نسب عالية من CO2.","id":"g6o84"},{"t":"mc","q":"ماذا يحدث عند: عدم تجدد الهواء النقي في مكان مغلق تحتوي على مواد مشتعلة.","o":["تقوم الأمعاء الغليظة بامتصاص الماء المتبقي منه وطرد الباقي كبراز عبر فتحة الشرج.","تنطفئ النيران وتتوقف عملية الاحتراق لنفاذ الأكسجين من المكان.","لا يتغير لون محلول اليود ويبقى بنياً لأن اللعاب هضم النشا وحوله إلى سكر.","يتعكر ماء الجير ويتحول لونه إلى الأبيض الحليبي لاحتواء هواء الزفير على نسب عالية من CO2."],"a":1,"e":"الإجابة: تنطفئ النيران وتتوقف عملية الاحتراق لنفاذ الأكسجين من المكان.","id":"g6o85"},{"t":"mc","q":"ماذا يحدث عند: إضافة قطرات من محلول اليود المخفف إلى أنبوبة تحتوي على محلول نشا نقي.","o":["يتعكر ماء الجير ويتحول لونه إلى الأبيض الحليبي لاحتواء هواء الزفير على نسب عالية من CO2.","تنطفئ النيران وتتوقف عملية الاحتراق لنفاذ الأكسجين من المكان.","يتحول لون محلول اليود من البني إلى الأزرق الداكن لوجود النشا.","تقل مساحة سطح الامتصاص بدرجة كبيرة وتضعف كفاءة امتصاص المغذيات والماء للجسم."],"a":2,"e":"الإجابة: يتحول لون محلول اليود من البني إلى الأزرق الداكن لوجود النشا.","id":"g6o86"},{"t":"mc","q":"ماذا يحدث عند: إضافة قطرات من محلول اليود إلى أنبوبة تحتوي على نشا تم خلطه باللعاب ودفئه عند 40° مئوية.","o":["تقوم الأمعاء الغليظة بامتصاص الماء المتبقي منه وطرد الباقي كبراز عبر فتحة الشرج.","يحدث الزفير، حيث يضيق القفص الصدري ويخرج الهواء المحمل بثاني أكسيد الكربون.","لا يتغير لون محلول اليود ويبقى بنياً لأن اللعاب هضم النشا وحوله إلى سكر.","يتعكر ماء الجير ويتحول لونه إلى الأبيض الحليبي لاحتواء هواء الزفير على نسب عالية من CO2."],"a":2,"e":"الإجابة: لا يتغير لون محلول اليود ويبقى بنياً لأن اللعاب هضم النشا وحوله إلى سكر.","id":"g6o87"},{"t":"mc","q":"ماذا يحدث عند: غياب الخملات (Villi) من الجدار الداخلي للأمعاء الدقيقة للإنسان.","o":["تقل مساحة سطح الامتصاص بدرجة كبيرة وتضعف كفاءة امتصاص المغذيات والماء للجسم.","تنطفئ النيران وتتوقف عملية الاحتراق لنفاذ الأكسجين من المكان.","لا يتغير لون محلول اليود ويبقى بنياً لأن اللعاب هضم النشا وحوله إلى سكر.","يتعكر ماء الجير ويتحول لونه إلى الأبيض الحليبي لاحتواء هواء الزفير على نسب عالية من CO2."],"a":0,"e":"الإجابة: تقل مساحة سطح الامتصاص بدرجة كبيرة وتضعف كفاءة امتصاص المغذيات والماء للجسم.","id":"g6o88"},{"t":"mc","q":"ماذا يحدث عند: مرور الطعام غير المهضوم عبر الأمعاء الغليظة.","o":["يحدث الزفير، حيث يضيق القفص الصدري ويخرج الهواء المحمل بثاني أكسيد الكربون.","تنطفئ النيران وتتوقف عملية الاحتراق لنفاذ الأكسجين من المكان.","يحدث الشهيق، حيث يتسع القفص الصدري ويدخل الهواء المحمل بالأكسجين إلى الرئتين.","تقوم الأمعاء الغليظة بامتصاص الماء المتبقي منه وطرد الباقي كبراز عبر فتحة الشرج."]," الإجابة الصحيحة: ثاني أكسيد الكربون","id":"g6o98"},{"t":"mc","q":"أكمل: الغاز الذي يمثل النسبة الأكبر في الهواء بنسبة 78% هو غاز ___ ولا يساعد على الاشتعال.","o":["ثاني أكسيد الكربون","الأكسجين","الهيدروجين","النيتروجين"],"a":3,"e":"الإجابة الصحيحة: النيتروجين","id":"g6o99"},{"t":"mc","q":"أكمل: يتم قياس وتحديد نسبة الأكسجين وثاني أكسيد الكربون في الزفير باستخدام أنابيب ___","o":["الزجاج","اليود","ماء الجير","كاشف الغازات"],"a":3,"e":"الإجابة الصحيحة: كاشف الغازات","id":"g6o100"},{"t":"mc","q":"أكمل: يدخل الهواء إلى المجرى التنفسي عبر عضو ___ أو الفم ثم يمر عبر ___","o":["الأنف - القصبة الهوائية","المعدة - المريء","الأذن - القصبة الهوائية","الأنف - المريء"],"a":0,"e":"الإجابة الصحيحة: الأنف - القصبة الهوائية","id":"g6o101"},{"t":"mc","q":"أكمل: تحدث عملية تبادل الغازات داخل الرئة في تراكيب صغيرة جداً تسمى ___","o":["الخملات","الشعيرات الدموية","الخياشيم","الحويصلات الهوائية"],"a":3,"e":"الإجابة الصحيحة: الحويصلات الهوائية","id":"g6o102"},{"t":"mc","q":"أكمل: تبدأ القناة الهضمية بعضو ___ وتستمر عبر البلعوم والمريء والمعدة حتى تنتهي بفتحة ___","o":["الفم - الأمعاء الغليظة","الفم - المريء","الفم - الشرج","المعدة - الشرج"],"a":2,"e":"الإجابة الصحيحة: الفم - الشرج","id":"g6o103"},{"t":"mc","q":"أكمل: يحتوي اللعاب على عصارة هضمية تحول المواد ___ إلى مواد سكرية بسيطة.","o":["البروتين (اللحوم)","الدهون (الزيوت)","النشا (المواد النشوية)","الأملاح المعدنية"],"a":2,"e":"الإجابة الصحيحة: النشا (المواد النشوية)","id":"g6o104"},{"t":"mc","q":"أكمل: يتغير لون محلول اليود من اللون البني إلى اللون ___ عند تفاعله مع النشا.","o":["الأصفر","الأحمر","الأزرق الداكن","الأخضر"],"a":2,"e":"الإجابة الصحيحة: الأزرق الداكن","id":"g6o105"},{"t":"mc","q":"أكمل: توجد نتوءات ___ على الجدار الداخلي للأمعاء الدقيقة لتزيد من مساحة سطح عملية ___","o":["الخملات - التنفس","الحويصلات - الامتصاص","الخملات - الهضم","الخملات - الامتصاص"],"a":3,"e":"الإجابة الصحيحة: الخملات - الامتصاص","id":"g6o106"},{"t":"mc","q":"أكمل: العضو الذي يعمل كمضخة لضخ الدم في الدورة الدموية هو ___","o":["الكبد","المخ","الرئة","القلب"],"a":3,"e":"الإجابة الصحيحة: القلب","id":"g6o107"},{"t":"mc","q":"أكمل: يمكن قياس النبض بسهولة عند منطقة ___ أو الرقبة، ويبلغ معدله في الراحة نحو ___ نبضة/دقيقة.","o":["الركبة - 150","الركبة - 70","الرسغ - 70","الرسغ - 110"],"a":2,"e":"الإجابة الصحيحة: الرسغ - 70","id":"g6o108"},{"t":"mc","q":"أكمل: تقوم الكليتان بتصفية الدم من الفضلات والماء الزائد لتكوين سائل ___","o":["البول","اللعاب","الدم","العصارة المعدية"],"a":0,"e":"الإجابة الصحيحة: البول","id":"g6o109"},{"t":"mc","q":"أكمل: تحمى الرئتان والقلب بداخل التجويف ___ بواسطة عظام ___","o":["الصدري - الجمجمة","البطني - الحوض","البطني - الضلوع","الصدري - الضلوع"],"a":3,"e":"الإجابة الصحيحة: الصدري - الضلوع","id":"g6o110"},{"t":"match","q":"وصّل من العمود (أ) ما يناسبه من العمود (ب): مكونات الهواء والاحتراق","p":[["غاز الأكسجين","يشكل 21% من الهواء ويساعد على استمرار الاشتعال."],["غاز النيتروجين","يشكل 78% من الهواء ولا يساعد على الاشتعال."],["غاز ثاني أكسيد الكربون","يتكون بعد الاحتراق ولا يساعد على الاشتعال وينطفئ اللهب بسببه بسرعة."],["ماء الجير الرائق","سائل شفاف يتعكر ويتحول للون الأبيض الحليبي عند تفاعله مع CO2."],["الاحتراق","تفاعل كيميائي بين المادة والأكسجين ينتج حرارة وضوء."]],"e":"التوصيل الصحيح: غاز الأكسجين ← يشكل 21% من الهواء ويساعد على استمرار الاشتعال.؛ غاز النيتروجين ← يشكل 78% من الهواء ولا يساعد على الاشتعال.؛ غاز ثاني أكسيد الكربون ← يتكون بعد الاحتراق ولا يساعد على الاشتعال وينطفئ اللهب بسببه بسرعة.؛ ماء الجير الرائق ← سائل شفاف يتعكر ويتحول للون الأبيض الحليبي عند تفاعله مع CO2.؛ الاحتراق ← تفاعل كيميائي بين المادة والأكسجين ينتج حرارة وضوء.","id":"g6o111"},{"t":"match","q":"وصّل من العمود (أ) ما يناسبه من العمود (ب): الجهاز التنفسي والتنفس","p":[["الشهيق","عملية دخول الهواء المحمل بالأكسجين إلى الجسم وتحرك الصدر لأعلى."],["الزفير","عملية خروج الهواء المحمل بـ CO2 وتحرك الصدر لأسفل."],["الأنف","العضو الأول الذي يمر من خلاله الهواء في المجرى التنفسي."],["الحويصلات الهوائية","أكياس هوائية صغيرة جداً يتم فيها تبادل الغازات بين الهواء والدم."],["الخياشيم","الأعضاء المسؤولة عن امتصاص الأكسجين الذائب في الماء لدى الأسماك."]],"e":"التوصيل الصحيح: الشهيق ← عملية دخول الهواء المحمل بالأكسجين إلى الجسم وتحرك الصدر لأعلى.؛ الزفير ← عملية خروج الهواء المحمل بـ CO2 وتحرك الصدر لأسفل.؛ الأنف ← العضو الأول الذي يمر من خلاله الهواء في المجرى التنفسي.؛ الحويصلات الهوائية ← أكياس هوائية صغيرة جداً يتم فيها تبادل الغازات بين الهواء والدم.؛ الخياشيم ← الأعضاء المسؤولة عن امتصاص الأكسجين الذائب في الماء لدى الأسماك.","id":"g6o112"},{"t":"match","q":"وصّل من العمود (أ) ما يناسبه من العمود (ب): الجهاز الهضمي والامتصاص","p":[["اللعاب","عصارة هضمية تفصل في الفم تحول النشا إلى سكر."],["المريء","أنبوب عضلي ينقل الطعام من البلعوم إلى المعدة."],["محلول اليود","كاشف كيميائي يتغير لونه من البني للأزرق الداكن عند وجود النشا."],["الخملات","نتوءات في الأمعاء الدقيقة تزيد مساحة السطح لامتصاص المغذيات."],["الكبد","عضو يخزن المواد الغذائية الممتصة ويوزعها للجسم عند الحاجة."]],"e":"التوصيل الصحيح: اللعاب ← عصارة هضمية تفصل في الفم تحول النشا إلى سكر.؛ المريء ← أنبوب عضلي ينقل الطعام من البلعوم إلى المعدة.؛ محلول اليود ← كاشف كيميائي يتغير لونه من البني للأزرق الداكن عند وجود النشا.؛ الخملات ← نتوءات في الأمعاء الدقيقة تزيد مساحة السطح لامتصاص المغذيات.؛ الكبد ← عضو يخزن المواد الغذائية الممتصة ويوزعها للجسم عند الحاجة.","id":"g6o113"},{"t":"match","q":"وصّل من العمود (أ) ما يناسبه من العمود (ب): الجهاز الدوري والإخراجي وأجهزة الجسم","p":[["القلب","مضخة عضلية تضخ الدم المحمل بالأكسجين والمغذيات لكل الجسم."],["الكليتان","عضوان يقعان في الظهر ويقومان بتصفية الدم وتكوين البول."],["الحالبان","أنبوبان ينقلان البول من الكليتين إلى المثانة البولية."],["التجويف الصدري","التجويف الذي يحتوي الرئتين والقلب وتحميهما الضلوع."],["التجويف البطني","التجويف الذي يضم المعدة والأمعاء الدقيقة والغليظة."]],"e":"التوصيل الصحيح: القلب ← مضخة عضلية تضخ الدم المحمل بالأكسجين والمغذيات لكل الجسم.؛ الكليتان ← عضوان يقعان في الظهر ويقومان بتصفية الدم وتكوين البول.؛ الحالبان ← أنبوبان ينقلان البول من الكليتين إلى المثانة البولية.؛ التجويف الصدري ← التجويف الذي يحتوي الرئتين والقلب وتحميهما الضلوع.؛ التجويف البطني ← التجويف الذي يضم المعدة والأمعاء الدقيقة والغليظة.","id":"g6o114"}];
const G6EN_REVIEW=[{"t":"mc","q":"The chemical reaction between oxygen and a substance that produces heat and light is called:","o":["Absorption","Excretion","Combustion","Respiration"],"a":2,"e":"Correct answer: Combustion.","id":"g6e1"},{"t":"mc","q":"The gas that forms the largest percentage of atmospheric air volume at 78% is:","o":["Nitrogen","Carbon dioxide","Water vapor","Oxygen"],"a":0,"e":"Correct answer: Nitrogen.","id":"g6e2"},{"t":"mc","q":"The percentage of oxygen gas in atmospheric air is approximately:","o":["78%","21%","0.04%","1%"],"a":1,"e":"Correct answer: 21%.","id":"g6e3"},{"t":"mc","q":"The percentage of carbon dioxide gas in atmospheric air is approximately:","o":["5%","78%","21%","0.04%"],"a":3,"e":"Correct answer: 0.04%.","id":"g6e4"},{"t":"mc","q":"For a candle to continue burning inside a glass container, there must be:","o":["Limewater inside the container","Continuous flow of fresh air","Tight sealing of the container","A vacuum inside"],"a":1,"e":"Correct answer: Continuous flow of fresh air.","id":"g6e5"},{"t":"mc","q":"When a burning candle is placed inside a jar containing pure oxygen gas, the flame:","o":["Increases in brightness and burning","Diminishes and weakens","Turns blue","Extinguishes immediately"],"a":0,"e":"Correct answer: Increases in brightness and burning.","id":"g6e6"},{"t":"mc","q":"The clear, colorless liquid that turns milky white upon reacting with carbon dioxide gas is:","o":["Dilute iodine solution","Alcohol","Clear limewater","Distilled water"],"a":2,"e":"Correct answer: Clear limewater.","id":"g6e7"},{"t":"mc","q":"Gases that do NOT support combustion include:","o":["Oxygen and water vapor","Oxygen and carbon dioxide","Nitrogen and carbon dioxide","Oxygen and nitrogen"],"a":2,"e":"Correct answer: Nitrogen and carbon dioxide.","id":"g6e8"},{"t":"mc","q":"The biological process where the body takes in oxygen and expels carbon dioxide is called:","o":["Condensation","Digestion","Breathing / Respiration","Excretio async top(g,f){const sn=await getDocs(query(col(g),orderBy(f,"desc"),limit(20)));return sn.docs.map(d=>({id:d.id,...d.data()}))},
async del(g,pid){try{await deleteDoc(doc(db,"grades",String(g),"players",pid))}catch(e){}}};
}catch(e){window.FBERR=String(e.code||e.message||e);console.warn("Firebase unavailable, using local leaderboard",e.code||e)}
