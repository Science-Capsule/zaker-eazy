swer: Decrease below 0°C."},{"id":"octA27","t":"mc","q":"Salt is spread on icy roads in winter because it:","o":["Raises the melting point of ice","Lowers the freezing point of water to prevent ice formation","Absorbs all sunlight","Increases friction without melting ice"],"a":1,"e":"Correct answer: Lowers the freezing point of water to prevent ice formation."},{"id":"octA28","t":"mc","q":"A system that allows exchange of both energy and matter with its surroundings is a/an:","o":["Closed system","Isolated system","Open system","Thermal insulator"],"a":2,"e":"Correct answer: Open system."},{"id":"octA29","t":"mc","q":"A sealed glass bottle of water that permits heat transfer but no mass exchange is a/an:","o":["Open system","Closed system","Isolated system","Vacuum system"],"a":1,"e":"Correct answer: Closed system."},{"id":"octA30","t":"mc","q":"A thermos flask (vacuum flask) represents an ideal approximation of a/an:","o":["Open system","Closed system","Isolated system","Permeable system"],"a":2,"e":"Correct answer: Isolated system."},{"id":"octA31","t":"mc","q":"Internal energy of a substance is defined as the total sum of its particles':","o":["Kinetic energy only","Potential energy only","Kinetic energy and potential energy","Mechanical energy and chemical energy"],"a":2,"e":"Correct answer: Kinetic energy and potential energy."},{"id":"octA32","t":"mc","q":"The temperature of a substance is a direct measure of the:","o":["Total mass of its particles","Average kinetic energy of its particles","Total volume of the container","Potential energy between molecules"],"a":1,"e":"Correct answer: Average kinetic energy of its particles."},{"id":"octA33","t":"mc","q":"When a substance absorbs thermal energy without changing its state, its particles move:","o":["Slower and kinetic energy decreases","Faster and average kinetic energy increases","At constant speed with zero kinetic energy","In a straight line backwards"],"a":1,"e":"Correct answer: Faster and average kinetic energy increases."},{"id":"octA34","t":"mc","q":"The amount of heat required to raise the temperature of 1 kg of a substance by 1°C is:","o":["Thermal capacity","Specific heat capacity","Latent heat of fusion","Internal work"],"a":1,"e":"Correct answer: Specific heat capacity."},{"id":"octA35","t":"mc","q":"Which substance has the highest specific heat capacity known in nature?","o":["Copper metal","Liquid water","Sand","Iron metal"],"a":1,"e":"Correct answer: Liquid water."},{"id":"octA36","t":"mc","q":"Because water has a very high specific heat capacity, it:","o":["Heats up and cools down very quickly","Takes a long time to heat up and a long time to cool down","Never absorbs heat","Boils instantly at 50°C"],"a":1,"e":"Correct answer: Takes a long time to heat up and a long time to cool down."},{"id":"octA37","t":"mc","q":"Equal masses of sand and water exposed to the same heat source for 5 minutes will show:","o":["Sand heating up much faster than water","Water heating up much faster than sand","Both reaching the exact same temperature","Sand remaining cold while water boils"],"a":0,"e":"Correct answer: Sand heating up much faster than water."},{"id":"octA38","t":"mc","q":"If equal amounts of thermal energy are supplied to 1 kg and 2 kg of liquid water:","o":["The 1 kg mass will experience a greater temperature rise","The 2 kg mass will experience a greater temperature rise","Both will experience the same temperature rise","Neither will change temperature"],"a":0,"e":"Correct answer: The 1 kg mass will experience a greater temperature rise."},{"id":"octA39","t":"mc","q":"Solid ice has a specific heat capacity that is:","o":["Equal to liquid water","Higher than liquid water","Lower than liquid water","Infinite"],"a":2,"e":"Correct answer: Lower than liquid water."},{"id":"octA40","t":"mc","q":"Thermal expansion occurs because heating a substance causes its particles to:","o":["Increase in mass","Gain kinetic energy, vibrate more vigorously, and push apart","Shrink in size","Multiply in number"],"a":1,"e":"Correct answer: Gain kinetic energy, vibrate more vigorously, and push apart."},{"id":"octA41","t":"mc","q":"The temperature at which all particle motion theoretically ceases is called Absolute Zero, which corresponds to:","o":["0°C","-273.15°C (0 Kelvin)","100°C","-100°C"],"a":1,"e":"Correct answer: -273.15°C (0 Kelvin)."},{"id":"octA42","t":"mc","q":"Which phase change releases thermal energy to the surroundings?","o":["Melting","Evaporation","Sublimation","Freezing"],"a":3,"e":"Correct answer: Freezing."},{"id":"octA43","t":"mc","q":"Condensation is the physical process of changing a:","o":["Solid into a liquid","Gas into a liquid by cooling","Liquid into a solid","Solid directly into a gas"],"a":1,"e":"Correct answer: Gas into a liquid by cooling."},{"id":"octA44","t":"mc","q":"During a phase change (like boiling or melting), the temperature of a pure substance:","o":["Increases continuously","Decreases steadily","Remains constant","Fluctuates rapidly"],"a":2,"e":"Correct answer: Remains constant."},{"id":"octA45","t":"mc","q":"The energy absorbed during melting that overcomes intermolecular bonds without raising temperature is called:","o":["Specific heat capacity","Latent heat of fusion","Latent heat of vaporization","Kinetic energy"],"a":1,"e":"Correct answer: Latent heat of fusion."},{"id":"octA46","t":"mc","q":"Why does spreading out a wet towel speed up its drying?","o":["It increases humidity","It increases the exposed surface area for evaporation","It lowers air temperature","It blocks wind flow"],"a":1,"e":"Correct answer: It increases the exposed surface area for evaporation."},{"id":"octA47","t":"mc","q":"Water droplets forming on the outer surface of a cold glass cylinder demonstrate:","o":["Evaporation","Sublimation","Condensation","Melting"],"a":2,"e":"Correct answer: Condensation."},{"id":"octA48","t":"mc","q":"A gas can be compressed into a smaller volume because:","o":["Its particles are fixed","Intermolecular spaces between its particles are very large","Intermolecular forces are extremely strong","Its particles do not move"],"a":1,"e":"Correct answer: Intermolecular spaces between its particles are very large."},{"id":"octA49","t":"mc","q":"The kinetic theory of matter states that all matter is composed of tiny particles that are:","o":["Completely stationary","In continuous motion","Embedded in solid matrix","Indestructible spheres without spaces"],"a":1,"e":"Correct answer: In continuous motion."},{"id":"octA50","t":"mc","q":"Neon sign lights glow with vibrant colors because they contain:","o":["Compressed oxygen gas","Heated liquid mercury","Glowing plasma state","Solid fluorescent powder"],"a":2,"e":"Correct answer: Glowing plasma state."},{"id":"octB1","t":"tf","q":"Liquids have a fixed shape and take the volume of the container holding them.","a":false,"e":"1. False (Liquids have a fixed volume but take the SHAPE of the container)."},{"id":"octB2","t":"tf","q":"Diffusion occurs faster in warm liquids than in cold liquids.","a":true,"e":"2. True."},{"id":"octB3","t":"tf","q":"Gases and liquids are collectively known as fluids because they can flow.","a":true,"e":"3. True."},{"id":"octB4","t":"tf","q":"Plasma is the most abundant state of matter in the universe.","a":true,"e":"4. True (Plasma makes up over 99% of visible matter in the universe like stars)."},{"id":"octB5","t":"tf","q":"Intermolecular forces of attraction in gases are stronger than in solids.","a":false,"e":"5. False (Intermolecular forces in gases are extremely WEAK or negligible)."},{"id":"octB6","t":"tf","q":"Particles in a solid object have translational motion moving freely from place to place.","a":false,"e":"6. False (Particles in a solid have VIBRATIONAL motion in fixed positions)."},{"id":"octB7","t":"tf","q":"Melting is an endothermic process that absorbs thermal energy.","a":true,"e":"7. True."},{"id":"octB8","t":"tf","q":"Sublimation is the transformation of a liquid into a gas below its boiling point.","a":false,"e":"8. False (Sublimation is the transformation of a SOLID into a gas)."},{"id":"octB9","t":"tf","q":"Dry ice is solid carbon dioxide that sublimates directly into gas at room temperature.","a":true,"e":"9. True."},{"id":"octB10","t":"tf","q":"Evaporation occurs throughout the entire volume of a liquid and forms bubbles.","a":false,"e":"10. False (Evaporation occurs ONLY at the SURFACE without forming bubbles; boiling forms bubbles)."},{"id":"octB11","t":"tf","q":"Increasing the exposed surface area of a liquid increases its rate of evaporation.","a":true,"e":"11. True."},{"id":"octB12","t":"tf","q":"On high mountain peaks, water boils at a temperature higher than 100°C.","a":false,"e":"12. False (On high mountains, pressure is lower, so water boils at a LOWER temperature than 100°C)."},{"id":"octB13","t":"tf","q":"Pressure cookers cook food faster by increasing atmospheric pressure, which raises boiling point.","a":true,"e":"13. True."},{"id":"octB14","t":"tf","q":"Adding table salt to pure water lowers its boiling point below 100°C.","a":false,"e":"14. False (Adding salt RAISES the boiling point above 100°C)."},{"id":"octB15","t":"tf","q":"Adding salt to ice lowers the freezing point of water, preventing ice formation on roads.","a":true,"e":"15. True."},{"id":"octB16","t":"tf","q":"An open system allows the exchange of thermal energy only with its surroundings.","a":false,"e":"16. False (An open system permits exchange of BOTH energy AND matter)."},{"id":"octB17","t":"tf","q":"A thermos flask is an example of an isolated thermodynamic system.","a":true,"e":"17. True."},{"id":"octB18","t":"tf","q":"Internal energy consists solely of the kinetic energy of microscopic particles.","a":false,"e":"18. False (Internal energy is the sum of BOTH kinetic energy and potential energy)."},{"id":"octB19","t":"tf","q":"Temperature is a measure of the average kinetic energy of the particles in a body.","a":true,"e":"19. True."},{"id":"octB20","t":"tf","q":"Water has a lower specific heat capacity than copper metal.","a":false,"e":"20. False (Water has a much HIGHER specific heat capacity than copper)."},{"id":"octB21","t":"tf","q":"Substances with low specific heat capacity heat up and cool down quickly.","a":true,"e":"21. True."},{"id":"octB22","t":"tf","q":"Equal masses of different materials require different amounts of heat to raise their temperature by 1°C.","a":true,"e":"22. True."},{"id":"octB23","t":"tf","q":"Solid ice requires more heat to raise its temperature by 1°C than an equal mass of liquid water.","a":false,"e":"23. False (Solid ice has a LOWER specific heat capacity (~2090 J/kg°C) than liquid water (~4184 J/kg°C))."},{"id":"octB24","t":"tf","q":"During boiling, the temperature of pure water continues to rise above 100°C.","a":false,"e":"24. False (During boiling, temperature remains CONSTANT at 100°C until all liquid turns to vapor)."},{"id":"octB25","t":"tf","q":"Freezing and condensation are exothermic thermal phase changes.","a":true,"e":"25. True."},{"id":"octC1","t":"mc","q":"Which scientific term matches this description? The state of matter having a definite volume but taking the shape of its container.","o":["Ionization","Liquid state","Intermolecular spaces","Latent heat of fusion / vaporization"],"a":1,"e":"Correct answer: Liquid state."},{"id":"octC2","t":"mc","q":"Which scientific term matches this description? Substances that can flow and have no fixed shape (liquids and gases).","o":["Intermolecular attraction forces","Specific heat capacity","Humidity","Fluids"],"a":3,"e":"Correct answer: Fluids."},{"id":"octC3","t":"mc","q":"Which scientific term matches this description? The natural movement of particles from an area of higher concentration to lower concentration.","o":["Diffusion","Intermolecular spaces","Scientific model","Plasma state"],"a":0,"e":"Correct answer: Diffusion."},{"id":"octC4","t":"mc","q":"Which scientific term matches this description? A simplified physical or mental representation of an object, system, or concept.","o":["Scientific model","Humidity","Open system","Melting point"],"a":0,"e":"Correct answer: Scientific model."},{"id":"octC5","t":"mc","q":"Which scientific term matches this description? The fourth state of matter consisting of a gas of ions and free electrons.","o":["Freezing","Plasma state","Diffusion","Internal energy"],"a":1,"e":"Correct answer: Plasma state."},{"id":"octC6","t":"mc","q":"Which scientific term matches this description? The spaces present between the molecules or particles of a substance.","o":["Melting point","Specific heat capacity","Boiling point","Intermolecular spaces"],"a":3,"e":"Correct answer: Intermolecular spaces."},{"id":"octC7","t":"mc","q":"Which scientific term matches this description? The forces that hold neighboring particles together in a substance.","o":["Intermolecular attraction forces","Sublimation","Diffusion","Melting point"],"a":0,"e":"Correct answer: Intermolecular attraction forces."},{"id":"octC8","t":"mc","q":"Which scientific term matches this description? The temperature at which a solid substance changes into a liquid state.","o":["Condensation","Scientific model","Intermolecular spaces","Melting point"],"a":3,"e":"Correct answer: Melting point."},{"id":"octC9","t":"mc","q":"Which scientific term matches this description? The temperature at which a liquid rapidly turns into vapor throughout its volume.","o":["Fluids","Melting point","Specific heat capacity","Boiling point"],"a":3,"e":"Correct answer: Boiling point."},{"id":"octC10","t":"mc","q":"Which scientific term matches this description? The direct phase change from a solid to a gas without passing through the liquid state.","o":["Sublimation","Boiling point","Absolute zero (0 K)","Plasma state"],"a":0,"e":"Correct answer: Sublimation."},{"id":"octC11","t":"mc","q":"Which scientific term matches this description? The slow phase change of a liquid into a gas taking place only at the liquid surface at any temperature.","o":["Plasma state","Freezing","Evaporation","Boiling point"],"a":2,"e":"Correct answer: Evaporation."},{"id":"octC12","t":"mc","q":"Which scientific term matches this description? The mass of water vapor present in a given volume of air.","o":["Humidity","Scientific model","Absolute zero (0 K)","Impurities"],"a":0,"e":"Correct answer: Humidity."},{"id":"octC13","t":"mc","q":"Which scientific term matches this description? A sealed cooking vessel that speeds cooking by trapping steam to elevate boiling temperature.","o":["Humidity","Scientific model","Melting point","Pressure cooker"],"a":3,"e":"Correct answer: Pressure cooker."},{"id":"octC14","t":"mc","q":"Which scientific term matches this description? Foreign substances mixed into a pure material that alter its physical properties like boiling and freezing points.","o":["Intermolecular spaces","Diffusion","Open system","Impurities"],"a":3,"e":"Correct answer: Impurities."},{"id":"octC15","t":"mc","q":"Which scientific term matches this description? A system that exchanges both energy and matter with its surrounding environment.","o":["Evaporation","Open system","Freezing","Latent heat of fusion / vaporization"],"a":1,"e":"Correct answer: Open system."},{"id":"octC16","t":"mc","q":"Which scientific term matches this description? A system that exchanges energy only, but not matter, with its surroundings.","o":["Closed system","Latent heat of fusion / vaporization","Intermolecular spaces","Scientific model"],"a":0,"e":"Correct answer: Closed system."},{"id":"octC17","t":"mc","q":"Which scientific term matches this description? A system that does not exchange either energy or matter with its surroundings.","o":["Diffusion","Liquid state","Specific heat capacity","Isolated system"],"a":3,"e":"Correct answer: Isolated system."},{"id":"octC18","t":"mc","q":"Which scientific term matches this description? The total sum of potential energy and kinetic energy stored within the particles of a substance.","o":["Boiling point","Internal energy","Diffusion","Freezing"],"a":1,"e":"Correct answer: Internal energy."},{"id":"octC19","t":"mc","q":"Which scientific term matches this description? A physical quantity that indicates the average kinetic energy of particles in a substance.","o":["Liquid state","Intermolecular attraction forces","Melting point","Temperature"],"a":3,"e":"Correct answer: Temperature."},{"id":"octC20","t":"mc","q":"Which scientific term matches this description? The amount of heat required to raise the temperature of 1 kg of a substance by 1°C.","o":["Ionization","Specific heat capacity","Isolated system","Latent heat of fusion / vaporization"],"a":1,"e":"Correct answer: Specific heat capacity."},{"id":"octC21","t":"mc","q":"Which scientific term matches this description? The phase change of a gas into a liquid upon losing thermal energy.","o":["Impurities","Boiling point","Condensation","Scientific model"],"a":2,"e":"Correct answer: Condensation."},{"id":"octC22","t":"mc","q":"Which scientific term matches this description? The phase change of a liquid into a solid upon cooling.","o":["Scientific model","Melting point","Freezing","Intermolecular attraction forces"],"a":2,"e":"Correct answer: Freezing."},{"id":"octC23","t":"mc","q":"Which scientific term matches this description? Thermal energy absorbed during a phase change that alters state without changing temperature.","o":["Condensation","Latent heat of fusion / vaporization","Plasma state","Diffusion"],"a":1,"e":"Correct answer: Latent heat of fusion / vaporization."},{"id":"octC24","t":"mc","q":"Which scientific term matches this description? The theoretical temperature at which all molecular kinetic motion comes to a complete halt (0 K).","o":["Condensation","Absolute zero (0 K)","Intermolecular spaces","Intermolecular attraction forces"],"a":1,"e":"Correct answer: Absolute zero (0 K)."},{"id":"octC25","t":"mc","q":"Which scientific term matches this description? The process of removing electrons from neutral gas atoms to form plasma.","o":["Sublimation","Humidity","Ionization","Intermolecular attraction forces"],"a":2,"e":"Correct answer: Ionization."},{"id":"octD1","t":"mc","q":"Why? Solids maintain a fixed shape and volume under normal conditions.","o":["Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions.","Because warm water vapor in surrounding air contacts the cold glass surface, loses thermal energy, and condenses into liquid water droplets.","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration."],"a":0,"e":"Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions."},{"id":"octD2","t":"mc","q":"Why? Gases are easily compressible while solids and liquids are virtually incompressible.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage.","Because all supplied heat energy (latent heat of fusion) is used exclusively to break intermolecular attraction bonds between ice molecules rather than increasing kinetic energy.","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles."],"a":3,"e":"Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles."},{"id":"octD3","t":"mc","q":"Why? Drop of potassium permanganate or ink spreads throughout an entire beaker of water without stirring.","o":["Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle).","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration."],"a":3,"e":"Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration."},{"id":"octD4","t":"mc","q":"Why? Plasma conducts electricity whereas ordinary neutral gases do not.","o":["Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because plasma contains free mobile electric charges (free electrons and positive ions), while neutral gas atoms have bound electrons.","Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle).","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions."],"a":1,"e":"Because plasma contains free mobile electric charges (free electrons and positive ions), while neutral gas atoms have bound electrons."},{"id":"octD5","t":"mc","q":"Why? Water in a cup evaporates faster on a windy day than on a calm day.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions."],"a":0,"e":"Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation."},{"id":"octD6","t":"mc","q":"Why? Wet clothes dry much faster when spread out on a line than when left folded in a pile.","o":["Because spreading out clothes increases the exposed surface area of water to air, which directly speeds up the rate of evaporation.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration.","Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle).","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase."],"a":0,"e":"Because spreading out clothes increases the exposed surface area of water to air, which directly speeds up the rate of evaporation."},{"id":"octD7","t":"mc","q":"Why? A pressure cooker cooks tough food and meat in much less time than a conventional pot.","o":["Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles.","Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation.","Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation."],"a":0,"e":"Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat."},{"id":"octD8","t":"mc","q":"Why? Water boils at a temperature lower than 100°C on top of Mount Everest.","o":["Because warm water vapor in surrounding air contacts the cold glass surface, loses thermal energy, and condenses into liquid water droplets.","Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage.","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions."],"a":2,"e":"Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature."},{"id":"octD9","t":"mc","q":"Why? Salt is spread over icy road surfaces in cold countries during winter storms.","o":["Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system).","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature."],"a":0,"e":"Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures."},{"id":"octD10","t":"mc","q":"Why? Water droplets form on the outside of a cold soda bottle taken out of the refrigerator.","o":["Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase.","Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage.","Because warm water vapor in surrounding air contacts the cold glass surface, loses thermal energy, and condenses into liquid water droplets."],"a":3,"e":"Because warm water vapor in surrounding air contacts the cold glass surface, loses thermal energy, and condenses into liquid water droplets."},{"id":"octD11","t":"mc","q":"Why? Adding table salt to pure water causes its boiling point to rise above 100°C.","o":["Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration.","Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature).","Because non-volatile salt particles bind to water molecules, making it harder for water molecules to break free into vapor, requiring higher thermal energy (boiling point > 100°C)."],"a":3,"e":"Because non-volatile salt particles bind to water molecules, making it harder for water molecules to break free into vapor, requiring higher thermal energy (boiling point > 100°C)."},{"id":"octD12","t":"mc","q":"Why? The thermos flask keeps hot soup warm for many hours.","o":["Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system).","Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because sweat absorbs body heat and uses it as latent heat to evaporate off skin, producing a cooling effect."],"a":1,"e":"Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system)."},{"id":"octD13","t":"mc","q":"Why? Sand on a beach becomes extremely hot on a sunny noon, while ocean water stays comfortably cool.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature).","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system).","Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries."],"a":1,"e":"Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature)."},{"id":"octD14","t":"mc","q":"Why? Farmers in cold regions spray water over fruit orchards when freezing temperatures are expected.","o":["Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions.","Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage.","Because heat supplies kinetic energy to metal atoms, causing them to vibrate more vigorously and push slightly farther apart (thermal expansion)."],"a":2,"e":"Because water releases latent heat as it freezes into ice on leaves/fruits, giving off warmth to surrounding plant tissues and protecting them from freezing damage."},{"id":"octD15","t":"mc","q":"Why? Heating a solid metal rod causes it to expand slightly in length.","o":["Because heat supplies kinetic energy to metal atoms, causing them to vibrate more vigorously and push slightly farther apart (thermal expansion).","Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature).","Because sweat absorbs body heat and uses it as latent heat to evaporate off skin, producing a cooling effect.","Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle)."],"a":0,"e":"Because heat supplies kinetic energy to metal atoms, causing them to vibrate more vigorously and push slightly farther apart (thermal expansion)."},{"id":"octD16","t":"mc","q":"Why? Temperature remains constant during the melting process of ice even though heat is continuously added.","o":["Because all supplied heat energy (latent heat of fusion) is used exclusively to break intermolecular attraction bonds between ice molecules rather than increasing kinetic energy.","Due to the continuous random motion of water and dye particles, causing them to diffuse from regions of high concentration to lower concentration.","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase.","Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation."],"a":0,"e":"Because all supplied heat energy (latent heat of fusion) is used exclusively to break intermolecular attraction bonds between ice molecules rather than increasing kinetic energy."},{"id":"octD17","t":"mc","q":"Why? Plasma is utilized in modern advanced air purification and sterilization systems.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because plasma contains energetic ions and UV light that disrupt bacterial cell walls and breakdown organic odor molecules effectively.","Because heat supplies kinetic energy to metal atoms, causing them to vibrate more vigorously and push slightly farther apart (thermal expansion).","Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes."],"a":1,"e":"Because plasma contains energetic ions and UV light that disrupt bacterial cell walls and breakdown organic odor molecules effectively."},{"id":"octD18","t":"mc","q":"Why? Small masses of a substance heat up faster than large masses when supplied with equal heat.","o":["Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation.","Because thermal energy is distributed among fewer particles in smaller masses, resulting in a higher average kinetic energy increase per particle.","Because non-volatile salt particles bind to water molecules, making it harder for water molecules to break free into vapor, requiring higher thermal energy (boiling point > 100°C).","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system)."],"a":1,"e":"Because thermal energy is distributed among fewer particles in smaller masses, resulting in a higher average kinetic energy increase per particle."},{"id":"octD19","t":"mc","q":"Why? Sweating cools down the human body on hot summer days.","o":["Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes.","Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation.","Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because sweat absorbs body heat and uses it as latent heat to evaporate off skin, producing a cooling effect."],"a":3,"e":"Because sweat absorbs body heat and uses it as latent heat to evaporate off skin, producing a cooling effect."},{"id":"octD20","t":"mc","q":"Why? Liquid water takes the shape of whatever container it is poured into.","o":["Because trapped steam increases pressure inside the cooker, elevating water's boiling point above 100°C (up to ~120°C), cooking food much faster with higher heat.","Because liquid molecules have weak attraction forces and can slide over one another easily, allowing the fluid to adapt to container geometry.","Because the thermos flask has double-walled glass with an evacuated vacuum layer that prevents heat loss via conduction, convection, and radiation (isolated system).","Because sand has a very low specific heat capacity (heats up rapidly), whereas water has a very high specific heat capacity (requires much more heat to raise temperature)."],"a":1,"e":"Because liquid molecules have weak attraction forces and can slide over one another easily, allowing the fluid to adapt to container geometry."},{"id":"octD21","t":"mc","q":"Why? Dry ice vanishes completely over time without leaving behind any wet liquid stain.","o":["Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because intermolecular forces between solid particles are very strong and intermolecular spaces are extremely tiny, keeping particles tightly bound in fixed positions.","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase."],"a":3,"e":"Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase."},{"id":"octD22","t":"mc","q":"Why? A cup of hot tea cools down faster when poured into a broad saucer than in a narrow cup.","o":["Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries.","Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation.","Because atmospheric pressure on mountain tops is significantly lower than sea level pressure, allowing liquid molecules to escape as gas at a lower temperature."],"a":2,"e":"Because a saucer provides a larger surface area exposed to air, accelerating evaporation and heat dissipation."},{"id":"octD23","t":"mc","q":"Why? A cup of coffee left in an open room acts as an open thermodynamic system.","o":["Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation.","Because adding salt lowers the freezing point of water below 0°C, causing snow and ice to melt even at sub-zero outdoor temperatures.","Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries.","Because plasma contains free mobile electric charges (free electrons and positive ions), while neutral gas atoms have bound electrons."],"a":2,"e":"Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries."},{"id":"octD24","t":"mc","q":"Why? Temperature is considered a measure of average kinetic energy rather than total kinetic energy.","o":["Because plasma contains energetic ions and UV light that disrupt bacterial cell walls and breakdown organic odor molecules effectively.","Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle).","Because gases have very large intermolecular spaces that can be reduced, whereas solids and liquids have very small intermolecular spaces with closely packed particles.","Because all supplied heat energy (latent heat of fusion) is used exclusively to break intermolecular attraction bonds between ice molecules rather than increasing kinetic energy."],"a":1,"e":"Because total kinetic energy depends on total mass, while temperature reflects the intensity of particle motion (kinetic energy per single particle)."},{"id":"octD25","t":"mc","q":"Why? Water is widely used as an effective coolant in car radiators and industrial engines.","o":["Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes.","Because dry ice undergoes sublimation, turning directly from solid CO2 into gaseous CO2 without passing through a liquid phase.","Because it allows both thermal energy (heat loss to air) and matter (evaporating water vapor) to cross its boundaries.","Because wind removes the saturated water vapor molecules accumulated directly above the liquid surface, allowing faster continuous evaporation."],"a":0,"e":"Because water has an exceptionally high specific heat capacity, allowing it to absorb huge amounts of heat without experiencing dangerous temperature spikes."},{"id":"octE1","t":"mc","q":"What happens when/if: A solid substance absorbs sufficient thermal energy to reach its melting point.","o":["The boiling point of the liquid decreases below its standard sea-level boiling point.","Dry ice sublimates directly into gaseous carbon dioxide fog without melting into liquid.","Intermolecular bonds weaken, particles gain kinetic energy to slide past each other, and solid melts into a liquid.","Particle motion completely stops, and kinetic energy reaches absolute zero."],"a":2,"e":"Intermolecular bonds weaken, particles gain kinetic energy to slide past each other, and solid melts into a liquid."},{"id":"octE2","t":"mc","q":"What happens when/if: You try to compress a closed syringe filled with water versus one filled with air.","o":["The air syringe compresses easily due to large gas spaces, while the water syringe resists compression because liquid molecules are closely packed.","Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system.","The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster.","Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time."],"a":0,"e":"The air syringe compresses easily due to large gas spaces, while the water syringe resists compression because liquid molecules are closely packed."},{"id":"octE3","t":"mc","q":"What happens when/if: A drop of red dye is added to a beaker containing hot water versus cold water.","o":["Dry ice sublimates directly into gaseous carbon dioxide fog without melting into liquid.","Neutral gas atoms become ionized (lose electrons), transforming into the plasma state.","Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system.","Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed."],"a":3,"e":"Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed."},{"id":"octE4","t":"mc","q":"What happens when/if: A neutral gas is subjected to extremely high temperatures or powerful electrical discharges.","o":["Neutral gas atoms become ionized (lose electrons), transforming into the plasma state.","Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time.","Sweat cannot evaporate into saturated air, preventing body cooling and causing overheating.","Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system."],"a":0,"e":"Neutral gas atoms become ionized (lose electrons), transforming into the plasma state."},{"id":"octE5","t":"mc","q":"What happens when/if: The exposed surface area of a liquid in an open container is increased.","o":["The metal ball expands in volume due to increased particle vibrations (thermal expansion).","The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster.","Average kinetic energy of particles increases, particle speed increases, and body temperature rises.","Neutral gas atoms become ionized (lose electrons), transforming into the plasma state."],"a":1,"e":"The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster."},{"id":"octE6","t":"mc","q":"What happens when/if: Relative humidity in the surrounding air increases significantly on a hot day.","o":["The 100g water sample undergoes a temperature rise 5 times greater than the 500g sample.","Average kinetic energy of particles increases, particle speed increases, and body temperature rises.","The rate of evaporation slows down because air is already saturated with moisture.","The state of matter transforms towards a denser, more rigid state (e.g. gas to liquid or liquid to solid)."],"a":2,"e":"The rate of evaporation slows down because air is already saturated with moisture."},{"id":"octE7","t":"mc","q":"What happens when/if: Atmospheric pressure acting on a liquid is reduced below standard sea-level pressure.","o":["Water converts to steam and escapes into air, while heat flows out; both mass and energy leave the open system.","The boiling point of the liquid decreases below its standard sea-level boiling point.","The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster.","Copper experiences a much larger and faster temperature rise than water because copper has a lower specific heat capacity."],"a":1,"e":"The boiling point of the liquid decreases below its standard sea-level boiling point."},{"id":"octE8","t":"mc","q":"What happens when/if: Pure water is heated inside a tightly sealed pressure cooker.","o":["Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed.","The metal ball expands in volume due to increased particle vibrations (thermal expansion).","The rate of evaporation slows down because air is already saturated with moisture.","Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time."],"a":3,"e":"Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time."},{"id":"octE9","t":"mc","q":"What happens when/if: Non-volatile salt is added to a pan of boiling water.","o":["The boiling point of water increases above 100°C.","Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed.","The state of matter transforms towards a denser, more rigid state (e.g. gas to liquid or liquid to solid).","Liquid water freezes into solid ice as particles lose kinetic energy and lock into fixed positions."],"a":0,"e":"The boiling point of water increases above 100°C."},{"id":"octE10","t":"mc","q":"What happens when/if: Salt is sprinkled over snow or ice covering a road at -5°C.","o":["Dry ice sublimates directly into gaseous carbon dioxide fog without melting into liquid.","Water boils smoothly and steadily at exactly 100°C under 1 atm pressure.","Liquid water freezes into solid ice as particles lose kinetic energy and lock into fixed positions.","Ice melts into liquid water because salt depresses the freezing point below -5°C."],"a":3,"e":"Ice melts into liquid water because salt depresses the freezing point below -5°C."},{"id":"octE11","t":"mc","q":"What happens when/if: A hot cup of coffee is left placed inside a completely insulated vacuum flask (thermos).","o":["The rate of evaporation slows down because air is already saturated with moisture.","Water vapor condenses into fine water droplets or frost on the cold surface.","Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system.","Neutral gas atoms become ionized (lose electrons), transforming into the plasma state."],"a":2,"e":"Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system."},{"id":"octE12","t":"mc","q":"What happens when/if: Heat energy is added to an open system containing boiling water","o":["Neutral gas atoms become ionized (lose electrons), transforming into the plasma state.","The boiling point of water increases above 100°C.","Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time.","Water converts to steam and escapes into air, while heat flows out; both mass and energy leave the open system."],"a":3,"e":"Water converts to steam and escapes into air, while heat flows out; both mass and energy leave the open system."},{"id":"octE13","t":"mc","q":"What happens when/if: Thermal energy is supplied to a body without causing a change in its physical state.","o":["Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time.","Average kinetic energy of particles increases, particle speed increases, and body temperature rises.","Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system.","Liquid water freezes into solid ice as particles lose kinetic energy and lock into fixed positions."],"a":1,"e":"Average kinetic energy of particles increases, particle speed increases, and body temperature rises."},{"id":"octE14","t":"mc","q":"What happens when/if: Equal masses of copper and water are given the exact same amount of thermal energy.","o":["Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed.","The metal ball expands in volume due to increased particle vibrations (thermal expansion).","Dry ice sublimates directly into gaseous carbon dioxide fog without melting into liquid.","Copper experiences a much larger and faster temperature rise than water because copper has a lower specific heat capacity."],"a":3,"e":"Copper experiences a much larger and faster temperature rise than water because copper has a lower specific heat capacity."},{"id":"octE15","t":"mc","q":"What happens when/if: Liquid water is cooled down until its temperature reaches 0°C under normal pressure.","o":["The boiling point of water increases above 100°C.","Liquid water freezes into solid ice as particles lose kinetic energy and lock into fixed positions.","Water converts to steam and escapes into air, while heat flows out; both mass and energy leave the open system.","Ice melts into liquid water because salt depresses the freezing point below -5°C."],"a":1,"e":"Liquid water freezes into solid ice as particles lose kinetic energy and lock into fixed positions."},{"id":"octE16","t":"mc","q":"What happens when/if: A block of dry ice (solid CO2) is left exposed on a table at room temperature.","o":["Particle motion completely stops, and kinetic energy reaches absolute zero.","Intermolecular bonds weaken, particles gain kinetic energy to slide past each other, and solid melts into a liquid.","Water converts to steam and escapes into air, while heat flows out; both mass and energy leave the open system.","Dry ice sublimates directly into gaseous carbon dioxide fog without melting into liquid."],"a":3,"e":"Dry ice sublimates directly into gaseous carbon dioxide fog without melting into liquid."},{"id":"octE17","t":"mc","q":"What happens when/if: Warm water vapor contacts the cold glass window pane on a winter morning.","o":["Vapor condenses into liquid water at 100°C releasing latent heat.","The rate of evaporation slows down because air is already saturated with moisture.","Pressure rises inside, elevating boiling temperature above 100°C and cooking food in a fraction of normal time.","Water vapor condenses into fine water droplets or frost on the cold surface."],"a":3,"e":"Water vapor condenses into fine water droplets or frost on the cold surface."},{"id":"octE18","t":"mc","q":"What happens when/if: A solid metal ball is heated strongly over a Bunsen burner flame.","o":["The metal ball expands in volume due to increased particle vibrations (thermal expansion).","The air syringe compresses easily due to large gas spaces, while the water syringe resists compression because liquid molecules are closely packed.","Intermolecular bonds weaken, particles gain kinetic energy to slide past each other, and solid melts into a liquid.","Copper experiences a much larger and faster temperature rise than water because copper has a lower specific heat capacity."],"a":0,"e":"The metal ball expands in volume due to increased particle vibrations (thermal expansion)."},{"id":"octE19","t":"mc","q":"What happens when/if: Equal amounts of heat are supplied to 100g of water and 500g of water initially at 20°C.","o":["Liquid water freezes into solid ice as particles lose kinetic energy and lock into fixed positions.","The 100g water sample undergoes a temperature rise 5 times greater than the 500g sample.","Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed.","Ice melts into liquid water because salt depresses the freezing point below -5°C."],"a":1,"e":"The 100g water sample undergoes a temperature rise 5 times greater than the 500g sample."},{"id":"octE20","t":"mc","q":"What happens when/if: Intermolecular spaces between particles decrease significantly as attraction forces increase.","o":["Liquid water freezes into solid ice as particles lose kinetic energy and lock into fixed positions.","The rate of evaporation increases significantly, causing the liquid to dry/vaporize faster.","The boiling point of the liquid decreases below its standard sea-level boiling point.","The state of matter transforms towards a denser, more rigid state (e.g. gas to liquid or liquid to solid)."],"a":3,"e":"The state of matter transforms towards a denser, more rigid state (e.g. gas to liquid or liquid to solid)."},{"id":"octE21","t":"mc","q":"What happens when/if: High-speed wind blows continuously over a wet freshly painted surface.","o":["Particle motion completely stops, and kinetic energy reaches absolute zero.","The rate of evaporation slows down because air is already saturated with moisture.","Paint dries rapidly because wind continuously clears vapor molecules, maximizing evaporation.","Water converts to steam and escapes into air, while heat flows out; both mass and energy leave the open system."],"a":2,"e":"Paint dries rapidly because wind continuously clears vapor molecules, maximizing evaporation."},{"id":"octE22","t":"mc","q":"What happens when/if: Water vapor loses heat energy at 100°C.","o":["Intermolecular bonds weaken, particles gain kinetic energy to slide past each other, and solid melts into a liquid.","Ice melts into liquid water because salt depresses the freezing point below -5°C.","Neutral gas atoms become ionized (lose electrons), transforming into the plasma state.","Vapor condenses into liquid water at 100°C releasing latent heat."],"a":3,"e":"Vapor condenses into liquid water at 100°C releasing latent heat."},{"id":"octE23","t":"mc","q":"What happens when/if: A gas is cooled down to absolute zero (0 Kelvin / -273.15°C).","o":["Particle motion completely stops, and kinetic energy reaches absolute zero.","Water vapor condenses into fine water droplets or frost on the cold surface.","Paint dries rapidly because wind continuously clears vapor molecules, maximizing evaporation.","The state of matter transforms towards a denser, more rigid state (e.g. gas to liquid or liquid to solid)."],"a":0,"e":"Particle motion completely stops, and kinetic energy reaches absolute zero."},{"id":"octE24","t":"mc","q":"What happens when/if: Pure water containing no impurities is heated at sea level (1 atm).","o":["Coffee stays hot for a long duration with minimal heat loss because the flask acts as an isolated system.","Water boils smoothly and steadily at exactly 100°C under 1 atm pressure.","Paint dries rapidly because wind continuously clears vapor molecules, maximizing evaporation.","The state of matter transforms towards a denser, more rigid state (e.g. gas to liquid or liquid to solid)."],"a":1,"e":"Water boils smoothly and steadily at exactly 100°C under 1 atm pressure."},{"id":"octE25","t":"mc","q":"What happens when/if: A human body exercises heavily in a room with 100% relative humidity.","o":["Intermolecular bonds weaken, particles gain kinetic energy to slide past each other, and solid melts into a liquid.","Dye diffuses much faster in hot water than cold water because higher temperature increases average kinetic energy and particle motion speed.","Sweat cannot evaporate into saturated air, preventing body cooling and causing overheating.","Water vapor condenses into fine water droplets or frost on the cold surface."],"a":2,"e":"Sweat cannot evaporate into saturated air, preventing body cooling and causing overheating."},{"id":"octF1","t":"mc","q":"Match the term with its correct description: Solid state","o":["E. Highly compressible with negligible attraction forces","D. Direct transition from solid to gas without liquid phase","A. Ionized gas with free electrons and high electrical conductivity","C. Fixed shape and fixed volume with vibrating particles","B. Indefinite shape, fixed volume, able to flow easily"],"a":3,"e":"Correct match: C. Fixed shape and fixed volume with vibrating particles."},{"id":"octF2","t":"mc","q":"Match the term with its correct description: Liquid state","o":["E. Highly compressible with negligible attraction forces","B. Indefinite shape, fixed volume, able to flow easily","D. Direct transition from solid to gas without liquid phase","A. Ionized gas with free electrons and high electrical conductivity","C. Fixed shape and fixed volume with vibrating particles"],"a":1,"e":"Correct match: B. Indefinite shape, fixed volume, able to flow easily."},{"id":"octF3","t":"mc","q":"Match the term with its correct description: Gaseous state","o":["E. Highly compressible with negligible attraction forces","C. Fixed shape and fixed volume with vibrating particles","A. Ionized gas with free electrons and high electrical conductivity","B. Indefinite shape, fixed volume, able to flow easily","D. Direct transition from solid to gas without liquid phase"],"a":0,"e":"Correct match: E. Highly compressible with negligible attraction forces."},{"id":"octF4","t":"mc","q":"Match the term with its correct description: Plasma state","o":["E. Highly compressible with negligible attraction forces","D. Direct transition from solid to gas without liquid phase","C. Fixed shape and fixed volume with vibrating particles","A. Ionized gas with free electrons and high electrical conductivity","B. Indefinite shape, fixed volume, able to flow easily"],"a":3,"e":"Correct match: A. Ionized gas with free electrons and high electrical conductivity."},{"id":"octF5","t":"mc","q":"Match the term with its correct description: Sublimation","o":["A. Ionized gas with free electrons and high electrical conductivity","D. Direct transition from solid to gas without liquid phase","B. Indefinite shape, fixed volume, able to flow easily","C. Fixed shape and fixed volume with vibrating particles","E. Highly compressible with negligible attraction forces"],"a":1,"e":"Correct match: D. Direct transition from solid to gas without liquid phase."},{"id":"octF6","t":"mc","q":"Match the term with its correct description: Evaporation","o":["B. Surface transformation of liquid to gas at any temperature","E. Significantly accelerates liquid evaporation rate","D. Slows down the rate of evaporation","C. Rapid vaporization throughout liquid at a specific temperature","A. Phase change from gas to liquid by losing thermal energy"],"a":0,"e":"Correct match: B. Surface transformation of liquid to gas at any temperature."},{"id":"octF7","t":"mc","q":"Match the term with its correct description: Boiling","o":["E. Significantly accelerates liquid evaporation rate","C. Rapid vaporization throughout liquid at a specific temperature","B. Surface transformation of liquid to gas at any temperature","A. Phase change from gas to liquid by losing thermal energy","D. Slows down the rate of evaporation"],"a":1,"e":"Correct match: C. Rapid vaporization throughout liquid at a specific temperature."},{"id":"octF8","t":"mc","q":"Match the term with its correct description: Condensation","o":["C. Rapid vaporization throughout liquid at a specific temperature","A. Phase change from gas to liquid by losing thermal energy","B. Surface transformation of liquid to gas at any temperature","E. Significantly accelerates liquid evaporation rate","D. Slows down the rate of evaporation"],"a":1,"e":"Correct match: A. Phase change from gas to liquid by losing thermal energy."},{"id":"octF9","t":"mc","q":"Match the term with its correct description: High surface area","o":["B. Surface transformation of liquid to gas at any temperature","C. Rapid vaporization throughout liquid at a specific temperature","D. Slows down the rate of evaporation","E. Significantly accelerates liquid evaporation rate","A. Phase change from gas to liquid by losing thermal energy"],"a":3,"e":"Correct match: E. Significantly accelerates liquid evaporation rate."},{"id":"octF10","t":"mc","q":"Match the term with its correct description: High air humidity","o":["A. Phase change from gas to liquid by losing thermal energy","D. Slows down the rate of evaporation","B. Surface transformation of liquid to gas at any temperature","C. Rapid vaporization throughout liquid at a specific temperature","E. Significantly accelerates liquid evaporation rate"],"a":1,"e":"Correct match: D. Slows down the rate of evaporation."},{"id":"octF11","t":"mc","q":"Match the term with its correct description: Open system","o":["E. Exchanges both energy and matter across its boundary","B. Exchanges neither matter nor energy with surrounding environment","A. Sum of potential and kinetic energy of all constituent particles","C. Measure of the average kinetic energy of particles","D. Exchanges energy with surroundings but not mass/matter"],"a":0,"e":"Correct match: E. Exchanges both energy and matter across its boundary."},{"id":"octF12","t":"mc","q":"Match the term with its correct description: Closed system","o":["C. Measure of the average kinetic energy of particles","D. Exchanges energy with surroundings but not mass/matter","B. Exchanges neither matter nor energy with surrounding environment","E. Exchanges both energy and matter across its boundary","A. Sum of potential and kinetic energy of all constituent particles"],"a":1,"e":"Correct match: D. Exchanges energy with surroundings but not mass/matter."},{"id":"octF13","t":"mc","q":"Match the term with its correct description: Isolated system","o":["B. Exchanges neither matter nor energy with surrounding environment","D. Exchanges energy with surroundings but not mass/matter","E. Exchanges both energy and matter across its boundary","A. Sum of potential and kinetic energy of all constituent particles","C. Measure of the average kinetic energy of particles"],"a":0,"e":"Correct match: B. Exchanges neither matter nor energy with surrounding environment."},{"id":"octF14","t":"mc","q":"Match the term with its correct description: Internal energy","o":["B. Exchanges neither matter nor energy with surrounding environment","E. Exchanges both energy and matter across its boundary","D. Exchanges energy with surroundings but not mass/matter","C. Measure of the average kinetic energy of particles","A. Sum of potential and kinetic energy of all constituent particles"],"a":4,"e":"Correct match: A. Sum of potential and kinetic energy of all constituent particles."},{"id":"octF15","t":"mc","q":"Match the term with its correct description: Temperature","o":["C. Measure of the average kinetic energy of particles","B. Exchanges neither matter nor energy with surrounding environment","A. Sum of potential and kinetic energy of all constituent particles","E. Exchanges both energy and matter across its boundary","D. Exchanges energy with surroundings but not mass/matter"],"a":0,"e":"Correct match: C. Measure of the average kinetic energy of particles."},{"id":"octF16","t":"mc","q":"Match the term with its correct description: High specific heat","o":["B. Lowers boiling point of water below 100°C","D. Lowers freezing point of water to melt ice","C. Water takes long time to heat up and cool down","A. Cooks food rapidly by raising water's boiling point","E. Metals heat up and cool down very rapidly"],"a":2,"e":"Correct match: C. Water takes long time to heat up and cool down."},{"id":"octF17","t":"mc","q":"Match the term with its correct description: Low specific heat","o":["B. Lowers boiling point of water below 100°C","D. Lowers freezing point of water to melt ice","C. Water takes long time to heat up and cool down","E. Metals heat up and cool down very rapidly","A. Cooks food rapidly by raising water's boiling point"],"a":3,"e":"Correct match: E. Metals heat up and cool down very rapidly."},{"id":"octF18","t":"mc","q":"Match the term with its correct description: Pressure cooker","o":["A. Cooks food rapidly by raising water's boiling point","C. Water takes long time to heat up and cool down","E. Metals heat up and cool down very rapidly","B. Lowers boiling point of water below 100°C","D. Lowers freezing point of water to melt ice"],"a":0,"e":"Correct match: A. Cooks food rapidly by raising water's boiling point."},{"id":"octF19","t":"mc","q":"Match the term with its correct description: High altitude (mountain)","o":["B. Lowers boiling point of water below 100°C","D. Lowers freezing point of water to melt ice","C. Water takes long time to heat up and cool down","A. Cooks food rapidly by raising water's boiling point","E. Metals heat up and cool down very rapidly"],"a":0,"e":"Correct match: B. Lowers boiling point of water below 100°C."},{"id":"octF20","t":"mc","q":"Match the term with its correct description: Salt on icy roads","o":["E. Metals heat up and cool down very rapidly","C. Water takes long time to heat up and cool down","D. Lowers freezing point of water to melt ice","B. Lowers boiling point of water below 100°C","A. Cooks food rapidly by raising water's boiling point"],"a":2,"e":"Correct match: D. Lowers freezing point of water to melt ice."},{"id":"octG1","t":"mc","q":"Complete the sentence: Matter exists in four physical states: solid, liquid, gas, and ......................... .","o":["Liquid","Solid","Plasma","Metal"],"a":2,"e":"Correct answer: Plasma."},{"id":"octG2","t":"mc","q":"Complete the sentence: Liquids and gases are classified as ......................... because they have the ability to flow.","o":["Solids","Fluids","Plasma","Crystals"],"a":1,"e":"Correct answer: Fluids."},{"id":"octG3","t":"mc","q":"Complete the sentence: Intermolecular spaces are largest in ......................... and smallest in ......................... .","o":["Solids, Gases","Gases, Solids","Liquids, Solids","Liquids, Gases"],"a":1,"e":"Correct answer: Gases, Solids."},{"id":"octG4","t":"mc","q":"Complete the sentence: The movement of gas molecules from high concentration to low concentration is called ......................... .","o":["Condensation","Sublimation","Diffusion","Freezing"],"a":2,"e":"Correct answer: Diffusion."},{"id":"octG5","t":"mc","q":"Complete the sentence: Sublimation is the transformation of a solid directly into a ......................... state without becoming a liquid.","o":["Liquid","Gas / Vapor","Solid","Plasma"],"a":1,"e":"Correct answer: Gas / Vapor."},{"id":"octG6","t":"mc","q":"Complete the sentence: Dry ice is the solid form of ......................... gas.","o":["Oxygen","Nitrogen","Carbon dioxide (CO2)","Hydrogen"],"a":2,"e":"Correct answer: Carbon dioxide (CO2)."},{"id":"octG7","t":"mc","q":"Complete the sentence: Evaporation takes place at the ......................... of a liquid at any temperature.","o":["Bottom","Surface","Middle","Entire volume"],"a":1,"e":"Correct answer: Surface."},{"id":"octG8","t":"mc","q":"Complete the sentence: Boiling occurs throughout the entire volume of a liquid at a specific constant temperature called the ......................... point.","o":["Melting","Freezing","Boiling","Condensation"],"a":2,"e":"Correct answer: Boiling."},{"id":"octG9","t":"mc","q":"Complete the sentence: Increasing exposed surface area, wind speed, and temperature will ......................... the rate of evaporation.","o":["Decrease / Slow down","Increase , Potential","Chemical and electrical","Kinetic and thermal","Potential and nuclear"],"a":0,"e":"Correct answer: Kinetic, Potential."},{"id":"octG17","t":"mc","q":"Complete the sentence: Temperature is a measure of the average ......................... energy of particles in a substance.","o":["Potential","Kinetic","Chemical","Nuclear"],"a":1,"e":"Correct answer: Kinetic."},{"id":"octG18","t":"mc","q":"Complete the sentence: The amount of heat required to raise 1 kg of a material by 1°C is called ......................... heat capacity.","o":["Latent","Specific","Total","Mechanical"],"a":1,"e":"Correct answer: Specific."},{"id":"octG19","t":"mc","q":"Complete the sentence: The substance with the highest specific heat capacity in nature is liquid ......................... .","o":["Copper","Sand","Water","Iron"],"a":2,"e":"Correct answer: Water."},{"id":"octG20","t":"mc","q":"Complete the sentence: Materials with low specific heat capacity heat up ......................... and cool down ......................... .","o":["Quickly and slowly","Slowly and quickly","Rapidly / Quickly, Rapidly / Quickly","Slowly and slowly"],"a":2,"e":"Correct answer: Rapidly / Quickly, Rapidly / Quickly."},{"id":"octG21","t":"mc","q":"Complete the sentence: Condensation is the reverse phase change of ......................... .","o":["Melting","Freezing","Evaporation / Vaporization","Condensation"],"a":2,"e":"Correct answer: Evaporation / Vaporization."},{"id":"octG22","t":"mc","q":"Complete the sentence: Freezing is the process of converting a liquid into a solid by ......................... thermal energy.","o":["Adding","Removing / Losing","Generating","Storing"],"a":1,"e":"Correct answer: Removing / Losing."},{"id":"octG23","t":"mc","q":"Complete the sentence: Neon lights and plasma air purifiers operate based on the ......................... state of matter.","o":["Solid","Liquid","Plasma","Ordinary gas only"],"a":2,"e":"Correct answer: Plasma."},{"id":"octG24","t":"mc","q":"Complete the sentence: Absolute zero corresponds to 0 Kelvin or ......................... °C.","o":["0","-273.15","100","-100"],"a":1,"e":"Correct answer: -273.15."},{"id":"octG25","t":"mc","q":"Complete the sentence: When two bodies at different temperatures are in contact, heat flows from the ......................... body to the ......................... body.","o":["Colder to hotter","Hotter / Warmer, Colder / Cooler","Equal-temperature to equal-temperature","Warmer to warmer"],"a":1,"e":"Correct answer: Hotter / Warmer, Colder / Cooler."}];
