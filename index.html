SUBJ=[{id:"ar",g:6,t:"العلوم",ic:"🔬",s:"الفصل الأول · الاحتراق والهواء",L:LAR,rtl:1,T:30,MT:60,M:[["الاحتراق تفاعل بين الأكسجين ومادة، وينتج عنه حرارة وضوء.","للهواء دور في حدوث الاحتراق واستمراره.","في الوعاء المغلق يُستهلك الهواء فتنطفئ الشمعة بعد وقت قصير.","لازم يتجدد الهواء الطازج (يدخل ويخرج) عشان الاشتعال يستمر."],["الهواء خليط من الغازات: نيتروجين 78%، أكسجين 21%، ثاني أكسيد الكربون 0.04%.","الأكسجين هو الغاز الوحيد الذي يساعد على الاحتراق، ويجعل اللهب أقوى وأكثر سطوعاً.","النيتروجين وثاني أكسيد الكربون لا يساعدان على الاحتراق."],["أثناء الاحتراق يقل الأكسجين ويزداد ثاني أكسيد الكربون.","ماء الجير سائل رائق عديم اللون، ويتحول إلى أبيض لبني مع ثاني أكسيد الكربون.","نرتدي نظارات الأمان لحماية العين من ماء الجير."]]},{id:"en",g:6,t:"Science",ic:"🧪",s:"Chapter 1 · Burning and Air",L:D0,T:45,MT:90,M:[["Burning is a reaction between oxygen and a substance that produces heat and light.","Air has a role in the occurrence and continuation of burning.","In a closed jar the air is used up, so the candle goes out after a short time.","Fresh air must constantly flow in and out for burning to continue."],["Air is a mixture of gases: nitrogen 78%, oxygen 21%, carbon dioxide 0.04%.","Oxygen helps burning: the flame becomes stronger and brighter.","Nitrogen and carbon dioxide do not help burning."],["During burning, oxygen decreases and carbon dioxide increases.","Limewater is a colorless clear liquid that turns milky white with carbon dioxide.","Wear safety goggles to protect the eyes from limewater."]]}];

[[D2,0,[["m","What is breathing (respiration)?","The process by which the body takes in oxygen and lets out carbon dioxide|The process of digesting food|Pumping blood to the body|Absorbing water","ما هو التنفس؟","العملية التي يأخذ بها الجسم الأكسجين ويتخلص من ثاني أكسيد الكربون|عملية هضم الطعام|ضخ الدم في الجسم|امتصاص الماء","التنفس = أخذ الأكسجين والتخلص من ثاني أكسيد الكربون."],

const MA2=[["التنفس هو العملية التي يأخذ بها الجسم الأكسجين ويتخلص من ثاني أكسيد الكربون.","الشهيق: دخول هواء به أكسجين كثير وثاني أكسيد كربون قليل، ويرتفع الصدر لأعلى.","الزفير: خروج هواء به ثاني أكسيد كربون كثير وأكسجين قليل، وينخفض الصدر لأسفل.","نشاط: هواء الزفير يعكّر ماء الجير ويحوّله لأبيض لبني، وهواء الغرفة يعكّره قليلاً.","أنابيب كاشف الغاز تقيس الأكسجين وثاني أكسيد الكربون في هواء الزفير."],["الجهاز التنفسي مسؤول عن التنفس. مسار الهواء: الأنف (أو الفم) ثم القصبة الهوائية ثم الرئتان.","داخل كل رئة حويصلات هوائية صغيرة تحيط بها شبكة أوعية دموية، والرئتان هما الموقع الرئيسي لتبادل الغازات.","الأكسجين ينتقل إلى الدم ويضخه القلب لكل الجسم، وثاني أكسيد الكربون ينتقل من الدم إلى الهواء ويخرج بالزفير.","السمك يتنفس بالخياشيم (يمتص الأكسجين الذائب في الماء)، والقطة تتنفس بالرئتين."]],
ME2=[["Breathing is the process by which the body takes in oxygen and lets out carbon dioxide.","Breathing in: air with a large amount of oxygen enters, and the chest moves up.","Breathing out: air with a large amount of carbon dioxide leaves, and the chest moves down.","Activity: breathed-out air turns limewater milky white, room air only slightly cloudy.","Gas detector tubes check oxygen and carbon dioxide in breathed-out air."],["The respiratory system is responsible for breathing. Air path: nose (or mouth), windpipe, then the lungs.","Each lung has tiny alveoli surrounded by blood vessels; the lungs are the main site of gas exchange.","Oxygen moves into the blood and the heart pumps it around the body; carbon dioxide moves into the air and is breathed out.","Fish breathe with gills (absorbing oxygen dissolved in water); a cat breathes with lungs."]],
MA3=[["الهضم هو تكسير الطعام وتحويله إلى صورة سهلة الامتصاص، والمسار الهضمي من الفم إلى فتحة الشرج.","الترتيب: الفم، البلعوم، المريء، المعدة، الأمعاء الدقيقة، الأمعاء الغليظة.","الأسنان تقطع وتطحن، واللعاب يبدأ هضم النشا ويحوّل بعضه إلى سكر.","المعدة تفرز عصارة هضمية، والأمعاء الدقيقة يكتمل فيها الهضم ويُمتص معظم الغذاء.","الأمعاء الغليظة تمتص الماء ويخرج الباقي كبراز، والسمك والقطة لهما نفس المسار."],["محلول اليود يكشف النشا: يتحول من البني إلى الأزرق المسود.","أنبوب (نشا + لعاب) لا يتغير لون اليود فيه لأن النشا تحول إلى سكر.","أنبوب (نشا + ماء) يتحول فيه اليود لأزرق مسود لأن النشا لم يُهضم.","نضع الأنابيب في ماء 40°م لتكون مثل حرارة الجسم. الاستنتاج: اللعاب يهضم النشا ويحوله إلى سكر."],["الأمعاء الدقيقة هي العضو الرئيسي لامتصاص الغذاء المهضوم ومعظم الماء.","الزغابات نتوءات صغيرة تغطي جدارها الداخلي وتزيد مساحة السطح، وفيها أوعية دموية تنقل الغذاء للدم.","الدم يحمل الغذاء الممتص إلى الكبد ثم لكل الجسم، والكبد يخزّن بعضه.","الباقي غير المهضوم ينتقل للأمعاء الغليظة ثم يخرج كبراز.","نشاط المنشفة الخشنة يوضح كيف تزيد الزغابات مساحة الامتصاص."]],
ME3=[["Digestion is breaking down food into a form easy to absorb; the digestive tract runs from the mouth to the anus.","Order: mouth, pharynx, food pipe, stomach, small intestine, large intestine.","Teeth cut and grind; saliva begins digesting starch and changes some into sugar.","The stomach secretes digestive juice; digestion is completed and most nutrients absorbed in the small intestine.","The large intestine absorbs water and the rest leaves as feces; fish and cats have the same path."],["Iodine solution detects starch: it changes from brown to blue-black.","Tube 1 (starch + saliva): iodine color does not change because starch changed into sugar.","Tube 2 (starch + water): iodine turns blue-black because starch was not digested.","Tubes are warmed to 40°C like the body. Conclusion: saliva digests starch into sugar."],["The small intestine is the main organ absorbing digested food and most water.","Villi are tiny bumps on its inner wall; they increase surface area and move nutrients into the blood vessels.","Blood carries nutrients to the liver, then to the whole body; the liver stores some.","Undigested food moves on to the large intestine and leaves as feces.","The rough towel activity shows how villi increase the absorption surface."]];

["d","Reducing the volume of a gas by increasing the pressure on it","Compressibility of gases","إمكانية تقليل حجم الغاز بزيادة الضغط الواقع عليه","انضغاطية الغازات"],

["s","How fast does diffusion occur?","Very quickly|At a medium speed|Very slowly","Bromine vapour in air:0|Dye in water:1|Dye in a sponge:2|Gases:0|Liquids:1|Solids:2","ما سرعة الانتشار؟","سريع جداً|متوسط|بطيء جداً","بخار البروم في الهواء:0|صبغة في الماء:1|صبغة في إسفنجة:2|الغازات:0|السوائل:1|المواد الصلبة:2","الانتشار: غازات ثم سوائل ثم صلب."],
["o","Arrange the steps of the compressibility activity:","Put equal volumes of air, water and fine sand in the syringes|Seal the opening of three identical syringes with a plug|Gradually press the piston of each syringe|Notice that only the volume of air decreases","رتّب خطوات نشاط الانضغاطية:","ضع حجوماً متساوية من الهواء والماء والرمل الناعم|اسدد فتحة ثلاث محاقن متماثلة بسدادة|اضغط مكبس كل محقنة تدريجياً|لاحظ أن حجم الهواء وحده هو الذي يقل","First fill the syringes, then seal them, press the pistons, and observe that only air decreases in volume."],
["o","Arrange from the fastest diffusion to the slowest:","Gases|Liquids|Solids","رتّب من الأسرع انتشاراً إلى الأبطأ:","الغازات|السوائل|المواد الصلبة","معدل الانتشار: غازات أكبر من سوائل أكبر من صلب."],
["x","Match the substance with its description:","Honey=High viscosity|Water=Low viscosity|Sand=Not a fluid|Oil=A liquid that can flow","وصّل المادة بما يناسبها:","العسل=لزوجة عالية|الماء=لزوجة منخفضة|الرمل=ليس مائعاً|الزيت=سائل ينساب","العسل أكثر لزوجة من الماء."],
["x","Match the state with the speed of diffusion in it:","Gaseous=Very quickly|Liquid=At a medium speed|Solid=Very slowly","وصّل الحالة بسرعة الانتشار فيها:","الغازية=سريع جداً|السائلة=متوسطة السرعة|الصلبة=بطيئة جداً","سرعة الانتشار تتوقف على الحالة."],
["x","Match the example with the factor that affects diffusion:","Tea in hot and cold water=Temperature|Hydrogen and oxygen gases=Mass of the particles","وصّل المثال بالعامل المؤثر في الانتشار:","الشاي في ماء ساخن وبارد=درجة الحرارة|غازا الهيدروجين والأكسجين=كتلة الجسيمات","عاملان: الحرارة وكتلة الجسيمات."],

["m","Why is the plasma state used in air conditioners?","To improve air quality in enclosed spaces|To make the air colder|To make the air heavier|To produce light","لماذا تُستخدم حالة البلازما في المكيفات؟","لتحسين جودة الهواء في الأماكن المغلقة|لتبريد الهواء أكثر|لزيادة وزن الهواء|لإنتاج الضوء","الأيونات تحطم الملوثات."],

["m","Why are educational models used in science?","To simplify things that are too tiny to be seen or too massive to be comprehended|To make real objects bigger|To replace all experiments|To change the properties of matter","لماذا تُستخدم النماذج التعليمية في العلوم؟","لتبسيط ما هو صغير جداً لا يُرى أو ضخم جداً لا يُستوعب|لتكبير الأشياء الحقيقية|لتحل محل كل التجارب|لتغيير خواص المادة","النمذجة تبسّط الفهم."]],[]);
SUBJ.push({id:"ar8",g:8,t:"العلوم",ic:"🔬",s:"",rtl:1,T:35,MT:60,ul:["الوحدة","Unit"],C:[{n:"المادة والطاقة",ne:"Matter and Energy",L:ar(D4),M:[["المادة هي كل ما له كتلة ويشغل حيّزاً، وكتلتها كمية ثابتة لا تتغير من مكان لآخر.","يصنّف العلماء المواد حسب حالتها الفيزيائية: صلبة وسائلة وغازية، وندرس خواصها: الشكل والانسيابية، الحجم والانضغاطية، والانتشار.","السوائل والغازات موائع: تنساب وتأخذ شكل الإناء، أما الصلب فله شكل ثابت. اللزوجة هي مقاومة السائل للانسياب، فكلما قلّت زادت الانسيابية (الماء أقل لزوجة من العسل).","الغازات قابلة للانضغاط (يقل حجمها بزيادة الضغط)، أما السوائل والمواد الصلبة فلا تنضغط.","الانتشار هو حركة الجسيمات من التركيز المرتفع إلى المنخفض. معدله في الغازات أكبر من السوائل أكبر من الصلب، ويزداد بارتفاع الحرارة ويقل بزيادة كتلة الجسيمات."],["النمذجة: تمثيل مبسّط لما هو صغير جداً لا يُرى أو ضخم جداً لا يُستوعب، مثل جسيمات المادة والنظام الشمسي.","نظرية الجسيمات: المادة تتكون من جسيمات صغيرة جداً في حركة مستمرة، جسيمات المادة الواحدة متماثلة، وبينها فراغات تختلف حسب الحالة، وتختزن طاقة وضع (بسبب التجاذب) وطاقة حركة (بسبب الحركة).","الصلب: تجاذب قوي جداً وفراغات صغيرة جداً (شكل وحجم ثابتان). السائل: تجاذب ضعيف نسبياً وفراغات أكبر (شكل متغير وحجم ثابت). الغاز: تجاذب ضعيف جداً وفراغات كبيرة جداً (لا شكل ولا حجم ثابت).","هذا يفسّر صعوبة كسر الصخر، وانسياب السوائل، وذوبان الملح في الماء، وانضغاط الغازات.","الحركة البراونية: حركة عشوائية لجسيمات كبيرة نسبياً معلقة في مائع بسبب تصادمها بجسيماته (اكتشفها روبرت براون)، وتفسّر انتشار دخان الشمعة.","البلازما: الحالة الرابعة، غاز متأين من أيونات موجبة وإلكترونات حرة وتوصيلها الكهربي عالٍ، وتحدث بمجال كهربي قوي أو حرارة عالية جداً، مثل الشمس والنجوم والبرق والشفق القطبي، وتُستخدم في مكيفات تنقي الهواء."]]}]},{id:"en8",g:8,t:"Science",ic:"🧪",s:"",T:50,MT:90,ul:["الوحدة","Unit"],C:[{n:"المادة والطاقة",ne:"Matter and Energy",L:D4,M:[["Matter is anything that has mass and occupies space; its mass is constant and does not change from one place to another.","Scientists classify materials by physical state: solid, liquid and gas. We study shape and fluidity, volume and compressibility, and diffusibility.","Liquids and gases are fluids: they flow and take the shape of their container, while solids have a fixed shape. Viscosity is a liquid's resistance to flow: the lower it is, the greater the fluidity (water is less viscous than honey).","Gases are compressible (their volume decreases as pressure increases); liquids and solids are incompressible.","Diffusion is the movement of particles from high to low concentration. The rate is gases > liquids > solids; it increases with temperature and decreases as the mass of the particles increases."],["Modelling is a simplified representation of things too tiny to be seen or too massive to be comprehended, like particles of matter and the solar system.","Particle theory: matter is made of very tiny particles in continuous motion; particles of one substance are identical, there are spaces between them that vary with the state, and they have potential energy (attraction) and kinetic energy (motion).","Solid: very strong attraction and very small spaces (definite shape and volume). Liquid: relatively weak attraction and larger spaces (indefinite shape, definite volume). Gas: very weak attraction and very large spaces (no definite shape or volume).","This explains why a rock is hard to break, why liquids flow, why salt dissolves in water, and why gases are compressible.","Brownian motion: random motion of relatively large particles suspended in a fluid caused by collisions with its particles (discovered by Robert Brown); it explains the spread of candle smoke.","Plasma: the fourth state, an ionized gas of positive ions and free electrons with high electrical conductivity. It forms in a strong electric field or at extremely high temperatures, e.g. the Sun, stars, lightning and the aurora, and is used in air conditioners to purify air."]]}]});

SUBJ.filter(x=>x.g==8).forEach(x=>{x.C[0].L.push(...(x.rtl?A5:D5));x.C[0].M.push(...(x.rtl?[["#الجزء الأول: الانصهار والغليان ومنحنى التسخين","عند الضغط الجوي العادي درجة انصهار الجليد 0°م ودرجة غليان الماء 100°م.","عند التسخين ترتفع حرارة الجليد حتى درجة الانصهار (تزداد طاقة حركة الجسيمات)، ثم تثبت أثناء الانصهار لأن الطاقة تُضعف قوى التجاذب، وبعدها ترتفع حرارة الماء حتى الغليان وتثبت أثناء الغليان.","منحنى التسخين: أقل من الانصهار صلب، عند الانصهار صلب + سائل، بينهما سائل، عند الغليان سائل + غاز، وأعلى من الغليان غاز. وزمن الانصهار أقل من زمن الغليان.","اكتساب الطاقة يزيد طاقة حركة الجسيمات فترتفع الحرارة، وفقدها يقللها فتنخفض.","الضغط الجوي: بزيادته ترتفع درجة الغليان وتنخفض درجة التجمد. في الجبال يقل الضغط فتقل درجة الغليان (حوالي 1°م لكل 300 م ارتفاع)، وقدر الضغط يرفع درجة الغليان فيقلل زمن الطهي.","النقاوة: الشوائب تغيّر قوى التجاذب فتتغير درجتا الغليان والانصهار (الجلوكوز يرفع الغليان ويخفض التجمد)، ونتحقق من النقاوة بمقارنة الدرجات بالقيم الثابتة.","#الجزء الثاني: التحولات العكسية والتبخر","الانصهار عكس التجمد، والتبخر عكس التكاثف، والتسامي عكس الترسيب، وكلها تغيرات فيزيائية لا يتغير فيها تركيب الجزيئات.","أمثلة: الندى والضباب والسحب (تكاثف)، الصقيع (ترسيب)، الثلج الجاف واليود الصلب (تسامي).","التبخر عند أي درجة وبجزيئات السطح فقط وبدون فقاقيع، أما الغليان فعند درجة ثابتة ولكل الجزيئات وبفقاقيع.","يزداد معدل التبخر بارتفاع الحرارة وزيادة مساحة السطح وسرعة تيارات الهواء، ويقل بزيادة الرطوبة.","دورة الماء تعتمد على التبخر والتكاثف والتجمد والانصهار، والقهوة سريعة الذوبان تُصنع برش المستخلص في هواء ساخن جاف لزيادة التبخر."],["#الجزء الأول: الأنظمة والطاقة الداخلية","النظام: أي جزء من الكون قيد الدراسة تُلاحظ فيه تغيرات الطاقة والمادة، وله حدود تفصله عن الوسط المحيط الذي يتبادل معه الطاقة أو المادة.","المفتوح يتبادل الطاقة والمادة (وعاء ماء يغلي)، المغلق يتبادل الطاقة فقط (علبة مشروب في الثلج، الترمومتر الطبي)، المعزول لا يتبادل شيئاً (الترمس).","ماء ساخن: في المفتوح تقل الحرارة والكتلة، في المغلق تقل الحرارة وتثبت الكتلة، في المعزول تثبت الحرارة والكتلة.","الطاقة الداخلية = مجموع طاقتي الوضع والحركة لجسيمات النظام. طاقة الوضع أكبر ما يمكن في الصلب وشبه معدومة في الغاز، وطاقة الحركة أقل ما يمكن في الصلب وأكبر ما يمكن في الغاز.","#الجزء الثاني: درجة الحرارة والحرارة النوعية","درجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات (درجة السخونة أو البرودة) وليست كل الطاقة الداخلية. اكتساب الطاقة يرفعها وفقدها يخفضها.","مقدار التغير في الحرارة يتوقف على كتلة المادة (الكتلة الأقل ترتفع أكثر)، ونوعها، وحالتها.","الحرارة النوعية: كمية الحرارة اللازمة لرفع حرارة 1 كجم من المادة 1°م، وتُقاس بوحدة جول/كجم·°م، وهي صفة مميزة لا تتغير بالكتلة وتختلف باختلاف النوع والحالة.","كلما زادت الحرارة النوعية احتاجت المادة حرارة أكبر وارتفعت حرارتها قليلاً وبردت ببطء (الماء الأعلى: 4180). لذلك يُستخدم الزئبق في الترمومتر، والماء في المبرد وفي جسم الإنسان، والنحاس في أواني الطهي."]]:[["#Part 1: Melting, boiling and the heating curve","At normal atmospheric pressure, ice melts at 0°C and water boils at 100°C.","When heated, the temperature of ice rises to the melting point (particles gain kinetic energy), stays constant during melting because the energy weakens the attraction forces, then water heats up to the boiling point and stays constant while boiling.","Heating curve: below the melting point = solid; at it = solid + liquid; between = liquid; at the boiling point = liquid + gas; above it = gas. Melting takes less time than boiling.","Gaining energy increases the kinetic energy of particles so temperature rises; losing energy lowers it.","Atmospheric pressure: when it increases the boiling point rises and the freezing point falls. On mountains the pressure is lower so the boiling point drops (about 1°C per 300 m). A pressure cooker raises the boiling point and shortens cooking time.","Purity: impurities change the attraction forces, so melting and boiling points change (glucose raises the boiling point and lowers the freezing point). Purity is checked by comparing with the fixed values.","#Part 2: Reversible changes and evaporation","Melting is the reverse of freezing, evaporation of condensation, sublimation of deposition. They are physical changes: the molecules do not change.","Examples: dew, fog and clouds (condensation), frost (deposition), dry ice and solid iodine (sublimation).","Evaporation happens at any temperature, only for surface molecules, with no bubbles; boiling happens at a fixed temperature, for all molecules, with bubbles.","The rate of evaporation increases with temperature, surface area and air currents, and decreases with humidity.","The water cycle depends on evaporation, condensation, freezing and melting; instant coffee is made by spraying the extract into hot dry air to speed up evaporation."],["#Part 1: Systems and internal energy","A system is any part of the universe under study where changes in energy and matter are observed; it has a boundary separating it from the surroundings, with which it can exchange energy or matter.","Open: exchanges energy and matter (open pot of boiling water). Closed: exchanges energy only (can of drink in ice, medical thermometer). Isolated: exchanges nothing (thermos flask).","Hot water: in an open system temperature and mass decrease; in a closed system temperature decreases and mass is constant; in an isolated system both are constant.","Internal energy = the sum of potential and kinetic energies of the particles. Potential energy is largest in solids and almost non-existent in gases; kinetic energy is smallest in solids and largest in gases.","#Part 2: Temperature and specific heat","Temperature measures the average kinetic energy of the particles (hotness or coldness), not all the internal energy. Gaining energy raises it, losing energy lowers it.","The change in temperature depends on the mass (a smaller mass rises more), the type and the state of the substance.","Specific heat: the heat needed to raise 1 kg of a substance by 1°C, measured in J/kg·°C. It is a characteristic property that does not depend on mass and varies with type and state.","The higher the specific heat, the more heat is needed, the smaller the rise in temperature, and the slower it cools (water is the highest: 4180). So mercury is used in thermometers, water in radiators and the human body, and copper in cooking utensils."]]))});

["#القلب والنبض","القلب يعمل مثل المضخة: يرسل الدم إلى جميع أجزاء الجسم عبر الأوعية الدموية ثم يستقبله مرة أخرى.","نبضات القلب هي الحركة المستمرة للقلب أثناء ضخه للدم، ونحس بها كنبض عند الرسغ والرقبة والكاحل.","#الدورة الدموية","الدورة الدموية هي الحركة المستمرة للدم داخل شبكة من الأوعية الدموية المنتشرة في الجسم.","1) القلب يضخ دماً غنياً بالأكسجين والعناصر الغذائية إلى كل أجزاء الجسم.","2) الدم يجمع ثاني أكسيد الكربون والفضلات الناتجة في الجسم ويعود إلى القلب.","3) القلب يضخ الدم المحمّل بثاني أكسيد الكربون إلى الرئتين.","4) الدم يطرد ثاني أكسيد الكربون ويأخذ الأكسجين في الرئتين ثم يعود إلى القلب.","مفتاح الألوان: الأحمر = دم غني بالأكسجين، والأزرق = دم غني بثاني أكسيد الكربون.","الجهاز الدوري هو الجهاز المسؤول عن ضخ الدم وتوزيعه في الجسم، ويشمل القلب والأوعية الدموية.","#نشاط قياس النبض","نضع الإصبع قرب قاعدة الإبهام على الرسغ ونعد النبضات في دقيقة: حوالي 70 نبضة أثناء الجلوس، وحوالي 110 نبضات بعد القفز الخفيف.","الاستنتاج: القلب ينبض أسرع أثناء الجهد (الحركة أو الرياضة) لأنه يضخ الدم بسرعة أكبر ليمد الجسم بأكسجين وعناصر غذائية أكثر لإنتاج الطاقة."],
["بعد استفادة الجسم من الأكسجين والعناصر الغذائية تتكون فضلات (مواد غير ضرورية وضارة) لازم يتخلص منها الجسم بعملية الإخراج.","الدم ينقل الفضلات الضارة إلى أعضاء تتخلص منها خارج الجسم مثل الكليتين.","الكليتان تزيلان الفضلات والماء الزائد من الدم على هيئة بول.","البول سائل يحتوي على الفضلات والماء الزائد، وينتج عندما ترشّح الكليتان الدم.","#تكوّن البول وخروجه","1) الدم المحمّل بالفضلات يمر في الكليتين.","2) الكليتان ترشحان الدم وتزيلان الفضلات والماء الزائد.","3) البول ينتقل من الكليتين عبر الحالبين إلى المثانة البولية.","4) البول يُخزَّن مؤقتاً في المثانة البولية حتى يخرج من الجسم.","الحالبان أنبوبان دقيقان ينقلان البول من الكليتين إلى المثانة البولية.","الجهاز البولي هو الجهاز المسؤول عن ترشيح الدم بإزالة الفضلات والماء الزائد وتكوين البول والتخلص منه."],
["تترتب الأعضاء بالقرب من بعضها داخل تجاويف الجسم لأنها تعمل معاً لأداء وظائفها.","#الصدر","الرئتان اليمنى واليسرى والقلب بينهما، وكلها محمية بالأضلاع.","#البطن","المعدة: تقع في أعلى البطن (أسفل القلب والرئتين).","الأمعاء الدقيقة: عضو طويل يقع أسفل المعدة.","الأمعاء الغليظة: تحيط بالأمعاء الدقيقة.","#الظهر","الكليتان: تقعان في أسفل الظهر، كلية على كل جانب من العمود الفقري.","#ترابط الأعضاء","ترتبط أعضاء الجسم ببعضها بالأوعية الدموية: الدم ينقل الأكسجين والعناصر الغذائية إلى الأعضاء، وينقل الفضلات منها إلى الأعضاء التي تساعد على التخلص منها."]];

["#Heart and pulse","The heart works like a pump, sending blood to all parts of the body through the blood vessels and then receiving it again.","Heartbeat is the continuous movement of the heart as it pumps blood. It can be felt as a pulse at the wrist, the neck and the ankle.","#Blood circulation","Blood circulation is the continuous movement of blood through a network of blood vessels spread throughout the body.","1) The heart pumps blood rich in oxygen and nutrients to all parts of the body.","2) The blood collects carbon dioxide and waste produced in the body and returns to the heart.","3) The heart pumps blood that carries carbon dioxide to the lungs.","4) The blood lets out carbon dioxide, takes in oxygen in the lungs and returns to the heart.","Key: red = blood rich in oxygen, blue = blood rich in carbon dioxide.","The circulatory system is responsible for pumping and circulating the blood throughout the body. It includes the heart and the blood vessels.","#Activity: measuring the pulse","Put your finger near the base of your thumb on your wrist and count the beats in 1 minute: about 70 beats per minute while sitting and about 110 after jumping lightly.","Conclusion: the heart beats faster during effort, such as movement or exercise, because it pumps blood faster to give the body more oxygen and nutrients to produce energy."],
["After the body benefits from oxygen and nutrients, unnecessary and harmful substances called waste products are produced and must be eliminated through excretion.","The blood carries harmful waste products to certain organs that eliminate them out of the body, such as the kidneys.","The two kidneys remove waste products and extra water from the blood in the form of urine.","Urine is a liquid containing waste products and extra water, produced when the kidneys filter the blood.","#Urine formation and discharging","1) The blood that carries waste products flows through the kidneys.","2) The kidneys filter the blood, removing waste products and extra water.","3) Urine passes from the kidneys through the two ureters to the urinary bladder.","4) Urine is temporarily stored in the urinary bladder until it is discharged from the body.","The ureters are two fine tubes that carry urine from the kidneys to the urinary bladder.","The urinary system is the system responsible for filtering the blood by removing waste products and excess water, forming urine and getting rid of it."],
["The organs are arranged close together inside the body cavities because they work together to perform their functions.","#Chest","The right and left lungs, and the heart between them, are all protected by the ribs.","#Abdomen","Stomach: located in the upper abdomen (below the heart and lungs).","Small intestine: a long organ located below the stomach.","Large intestine: it surrounds the small intestine.","#Back","The two kidneys: located on the lower back, one kidney on each side of the backbone.","#Connection between organs","The body organs are connected to one another by blood vessels: blood carries oxygen and nutrients to the organs, and carries waste products from them to the organs that help eliminate the waste."]];
